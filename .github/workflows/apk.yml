name: Fabriquer l'APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - run: gradle assembleDebug
      - run: cp app/build/outputs/apk/debug/app-debug.apk cartes-claude.apk
      - uses: actions/upload-artifact@v4
        with:
          name: cartes-claude-apk
          path: cartes-claude.apk
      - name: Publier l'APK en téléchargement direct
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete apk --yes --cleanup-tag || true
          gh release create apk cartes-claude.apk --title "50 cartes Claude" --notes "Ouvre le fichier cartes-claude.apk sur ton téléphone Android pour installer l'appli."
