  <div class="stack" id="res" style="gap:30px"></div>
  <p class="about">Guide indépendant, non officiel. Les histoires de la vidéo sont rapportées telles qu'elle les raconte. Les noms de menus suivent l'aide en ligne de Claude (novembre 2026) et peuvent varier selon ta version. Ta progression reste sur cet appareil.</p>`;
  const q = $("#q"); q.value = HF.q;
  const draw = () => {
    $$("#fl .chip[data-s]").forEach(b => b.setAttribute("aria-pressed", String(HF.src === b.dataset.s)));
    $$("#fl .chip[data-l]").forEach(b => b.setAttribute("aria-pressed", String(HF.lvl == b.dataset.l)));
    const ok = t => (!HF.lvl || t.lvl == HF.lvl);
    const found = HF.q.trim() ? search(HF.q) : null;
    let html = "";
    if (found) {
      const l = found.filter(t => t.src !== "s" ? (!HF.src || t.src === HF.src) && ok(t) : !HF.src);
      html = l.length ? `<section class="stack"><div class="sec-h"><h2>Résultats</h2><span class="count">${l.length}</span></div><div class="grid">${l.map(card).join("")}</div></section>`
        : `<p class="empty">Rien pour « ${esc(HF.q)} ». Essaie un mot plus simple.</p>`;
    } else {
      const v = VID.filter(ok), p = PLUS.filter(ok);
      if (HF.src !== "p" && v.length) html += `<section class="stack"><div class="sec-h"><h2>Vu dans la vidéo</h2><span class="count">${v.length} idées</span></div><div class="grid">${v.map(card).join("")}</div></section>`;
      if (HF.src !== "v" && p.length) html += `<section class="stack"><div class="sec-h"><h2>Les idées en plus</h2><span class="count">${p.length} idées</span></div><div class="grid">${p.map(card).join("")}</div></section>`;
      if (!html) html = `<p class="empty">Aucune idée pour ce filtre.</p>`;
    }
    $("#res").innerHTML = html;
  };
  q.addEventListener("input", () => { HF.q = q.value; draw(); });
  $("#fl").addEventListener("click", e => {
    const b = e.target.closest("button.chip"); if (!b) return;
    if (b.dataset.s) HF.src = HF.src === b.dataset.s ? "" : b.dataset.s; else HF.lvl = HF.lvl == b.dataset.l ? 0 : +b.dataset.l;
    draw();
  });
  draw();
}

/* ---------- tuto ---------- */
const WH = { chat: ["Claude", "Sur claude.ai ou dans l'appli Claude"], code: ["Claude Code", "Onglet Code de l'appli Claude, sur ton ordinateur"], chrome: ["Claude dans Chrome", "Panneau de l'extension Claude, dans Chrome"], voice: ["Mode vocal", "À dire à voix haute"] };
const BIG = /colle|message|texte|liste|description|explication|déroulé|informations|tarifs|détails|avis|affirmation|points|semaine|fonctions|contenu|rubriques/i;
function stepHTML(t, s, i, done) {
  const ps = Array.isArray(s.p) ? s.p : (s.p ? [s.p] : []);
  let pr = "";
  if (s.pr) {
    const w = s.w || (t.lvl === 3 ? "code" : "chat"), key = t.id + ":" + i, parts = promptParts(s.pr);
    const phs = [...new Set(parts.filter(p => p.ph).map(p => p.ph))], vals = S.vals[key] || {};
    pr = `<div class="pw pw-${w}" data-k="${key}" data-w="${w}">
      <div class="pw-bar"><span class="dots"><i></i><i></i><i></i></span><b>${WH[w][0]}</b><span>${WH[w][1]}</span></div>
      <div class="pw-body">${w === "code" ? '<span class="caret">&gt;</span>' : w === "chat" ? '<span class="plus">+</span>' : ""}<div class="pw-text"></div></div>
      ${phs.length ? `<div class="pw-fields" hidden>${phs.map((ph, j) => `<div class="field"><label class="label" for="f-${key.replace(":", "-")}-${j}">${esc(cap(ph))}</label>${BIG.test(ph) ? `<textarea id="f-${key.replace(":", "-")}-${j}" rows="2" data-ph="${esc(ph)}">${esc(vals[ph] || "")}</textarea>` : `<input id="f-${key.replace(":", "-")}-${j}" type="text" data-ph="${esc(ph)}" value="${esc(vals[ph] || "")}" autocomplete="off">`}</div>`).join("")}</div>` : ""}
      <div class="pw-act"><button type="button" class="btn primary sm" data-copy>${icon("copy", "sm")}Copier</button>${phs.length ? `<button type="button" class="btn sm" data-edit aria-expanded="false">${icon("edit", "sm")}Personnaliser</button>` : ""}${w === "chat" ? `<a class="btn sm" data-open target="_blank" rel="noopener">Ouvrir dans Claude ${icon("ext", "sm")}</a>` : ""}</div>
    </div>`;
  }
  return `<li class="stp${done ? " done" : ""}" id="e${i}">
    <div class="stp-h"><span class="num">${done ? icon("check") : i + 1}</span><h3>${esc(s.h)}</h3></div>
    <div class="stp-b">${ps.map(p => `<p>${esc(p)}</p>`).join("")}
      ${s.fig ? `<figure class="skc sm paper">${fig(s.fig)}</figure>` : ""}
      ${s.cmd ? `<div class="cmd"><div class="cmd-bar"><span>Commande, exemple</span><button type="button" data-cmd>Copier</button></div><pre>${esc(s.cmd)}</pre></div>` : ""}
      ${pr}
      <button type="button" class="done-btn" data-i="${i}" aria-pressed="${done}">${icon("check", "sm")}${done ? "Étape faite" : "Marquer comme faite"}</button>
    </div></li>`;
}
function viewTuto(t) {
  const list = t.src === "v" ? VID : t.src === "p" ? PLUS : START, idx = list.indexOf(t), prev = list[idx - 1], next = list[idx + 1];
  const st = S.steps[t.id] || (S.steps[t.id] = []), nd = S.need[t.id] || (S.need[t.id] = []);
  const backTo = t.src === "s" ? ["demarrer", "Démarrer"] : ["idees", "Toutes les idées"];
  $("#view").innerHTML = `
  <a class="back" href="#${backTo[0]}" data-back>${icon("left", "sm")}${backTo[1]}</a>
  <article class="read">
    <header class="th">
      <div class="badges">${t.src === "v" ? `<span class="badge vid">${icon("play", "sm")}Vu dans la vidéo</span>` : t.src === "p" ? `<span class="badge">${icon("spark", "sm")}Idée en plus</span>` : `<span class="badge">Démarrer</span>`}<span class="badge">${bars(t.lvl)}${LV[t.lvl]}</span><span class="badge ok" id="bdone" ${S.done.includes(t.id) ? "" : "hidden"}>${icon("check", "sm")}Fait</span></div>
      <h1>${esc(t.t)}</h1>
      <p class="lede">${esc(t.pitch)}</p>
    </header>
    <dl class="facts"><div><dt>Difficulté</dt><dd>${esc(t.diff)}</dd></div><div><dt>Durée</dt><dd>${esc(t.time)}</dd></div><div><dt>Coût</dt><dd>${esc(t.cost)}</dd></div></dl>
    <figure class="skc paper"><figcaption class="label">Comment ça marche</figcaption>${sketch(t.sk, "Croquis : " + t.t)}</figure>
    ${t.story ? `<aside class="story"><p class="label">${icon("play", "sm")}Dans la vidéo</p><p>${esc(t.story)}</p></aside>` : ""}
    <section class="stack"><h2>Ce que tu obtiens</h2><p class="prose">${esc(t.res)}</p></section>
    ${t.pre && t.pre.length ? `<section class="stack"><p class="label">Avant de commencer</p><div class="chips pre-chips">${t.pre.map(id => `<a class="chip" href="#idee-${id}">${icon("chev", "sm")}${esc(BY[id].t)}</a>`).join("")}</div></section>` : ""}
    <section class="stack"><h2>Ce qu'il te faut</h2><ul class="need">${t.need.map((n, i) => `<li><button type="button" class="nd" data-i="${i}" aria-pressed="${nd.includes(i)}"><span class="box">${icon("check")}</span><span>${esc(n)}</span></button></li>`).join("")}</ul></section>
    <section class="stack"><div class="sec-h"><h2>Pas à pas</h2><span class="count" id="pt"></span></div><div class="pbar"><i id="pb"></i></div>
      <ol class="stps">${t.steps.map((s, i) => stepHTML(t, s, i, st.includes(i))).join("")}</ol></section>
    ${t.trouble && t.trouble.length ? `<section class="stack"><h2>Si ça coince</h2><div class="qa">${t.trouble.map(q => `<details><summary>${esc(q[0])}${icon("chev", "sm")}</summary><p>${esc(q[1])}</p></details>`).join("")}</div></section>` : ""}
    ${t.more && t.more.length ? `<section class="stack"><h2>Pour aller plus loin</h2><ul class="more">${t.more.map(m => `<li>${icon("spark", "sm")}<span>${esc(m)}</span></li>`).join("")}</ul></section>` : ""}
    ${t.warn ? `<p class="note"><b>À savoir.</b> ${esc(t.warn)}</p>` : ""}
    <div class="actions"><button type="button" class="btn" id="tdone"></button><button type="button" class="btn" id="tfav"></button></div>
    <nav class="pager" aria-label="Autres idées">
      ${prev ? `<a class="pg" href="#idee-${prev.id}"><span>${icon("left", "sm")}Précédente</span><b>${esc(prev.t)}</b></a>` : ""}
      ${next ? `<a class="pg nx" href="#idee-${next.id}"><span>Suivante${icon("right", "sm")}</span><b>${esc(next.t)}</b></a>` : ""}
    </nav>
  </article>`;
  const prog = () => { $("#pt").textContent = `${st.length} / ${t.steps.length} étapes`; $("#pb").style.width = (st.length / t.steps.length * 100) + "%"; };
  const drawBtns = () => {
    const d = S.done.includes(t.id), fv = S.fav.includes(t.id);
    $("#tdone").className = "btn" + (d ? " ok" : ""); $("#tdone").innerHTML = icon("check", "sm") + (d ? "Tuto terminé" : "J'ai terminé ce tuto");
    $("#tfav").innerHTML = icon("star", "sm" + (fv ? " on" : "")) + (fv ? "Dans mes tutos" : "Garder dans mes tutos");
    $("#tfav").setAttribute("aria-pressed", String(fv)); $("#bdone").hidden = !d;
  };
  $$(".pw").forEach(box => {
    const key = box.dataset.k, i = +key.split(":")[1], s = t.steps[i], parts = promptParts(s.pr), vals = S.vals[key] || (S.vals[key] = {});
    const text = () => parts.map(p => p.s != null ? p.s : ((vals[p.ph] || "").trim() || "[" + p.ph + "]")).join("");
    const draw = () => {
      $(".pw-text", box).innerHTML = parts.map(p => p.s != null ? esc(p.s) : ((vals[p.ph] || "").trim() ? `<mark>${esc(vals[p.ph].trim())}</mark>` : `<span class="ph">${esc(p.ph)}</span>`)).join("");
      const o = $("[data-open]", box); if (o) o.href = "https://claude.ai/new?q=" + encodeURIComponent(text());
    };
    $$("[data-ph]", box).forEach(el => el.addEventListener("input", () => { vals[el.dataset.ph] = el.value; save(); draw(); }));
    $("[data-copy]", box).addEventListener("click", () => copyText(text(), $(".pw-text", box), "Consigne copiée"));
    const ed = $("[data-edit]", box);
    if (ed) ed.addEventListener("click", () => { const f = $(".pw-fields", box), open = f.hidden; f.hidden = !open; ed.setAttribute("aria-expanded", String(open)); if (open) { const first = $("input,textarea", f); if (first) first.focus(); } });
    draw();
  });
  $(".read").addEventListener("click", e => {
    const c = e.target.closest("[data-cmd]");
    if (c) { const pre = c.closest(".cmd").querySelector("pre"); copyText(pre.textContent, pre, "Commande copiée"); return; }
    const n = e.target.closest(".nd");
    if (n) { const i = +n.dataset.i, k = nd.indexOf(i); if (k >= 0) nd.splice(k, 1); else nd.push(i); n.setAttribute("aria-pressed", String(k < 0)); save(); return; }
    const b = e.target.closest(".done-btn");
    if (b) {
      const i = +b.dataset.i, k = st.indexOf(i), li = b.closest(".stp");
      if (k >= 0) st.splice(k, 1); else st.push(i);
      const on = k < 0;
      b.setAttribute("aria-pressed", String(on)); b.innerHTML = icon("check", "sm") + (on ? "Étape faite" : "Marquer comme faite");
      li.classList.toggle("done", on); $(".num", li).innerHTML = on ? icon("check") : i + 1;
      if (st.length === t.steps.length && !S.done.includes(t.id)) { S.done.push(t.id); toast("Tuto terminé, bravo"); drawBtns(); }
      save(); prog();
    }
  });
  $("#tdone").addEventListener("click", () => { const k = S.done.indexOf(t.id); if (k >= 0) S.done.splice(k, 1); else S.done.push(t.id); save(); drawBtns(); });
  $("#tfav").addEventListener("click", () => { const k = S.fav.indexOf(t.id); if (k >= 0) S.fav.splice(k, 1); else S.fav.push(t.id); save(); drawBtns(); toast(k >= 0 ? "Retiré de mes tutos" : "Ajouté à mes tutos"); });
  prog(); drawBtns();
}

/* ---------- démarrer ---------- */
function viewStart() {
  $("#view").innerHTML = `
  <header class="hero"><h1>Démarrer</h1>
    <p class="lede">Chaque idée indique ce qu'il te faut, en un, deux ou trois traits. Voici ce qu'ils veulent dire, et les installations que certains tutos demandent.</p></header>
  <div class="lv3">${DATA.levels.map(l => `<div><h3>${bars(l.id)}${esc(l.name)}</h3><p>${esc(l.setup)}</p></div>`).join("")}</div>
  <section class="stack"><div class="sec-h"><h2>Les installations</h2><span class="count">${START.length} guides</span></div><div class="grid">${START.map(card).join("")}</div></section>`;
}

/* ---------- mes tutos ---------- */
function viewMine() {
  const inprog = T.filter(t => (S.steps[t.id] || []).length && !S.done.includes(t.id));
  const fav = S.fav.map(id => BY[id]).filter(Boolean), done = S.done.map(id => BY[id]).filter(Boolean);
  const sec = (h, l) => l.length ? `<section class="stack"><div class="sec-h"><h2>${h}</h2><span class="count">${l.length}</span></div><div class="grid">${l.map(card).join("")}</div></section>` : "";
  const body = sec("En cours", inprog) + sec("Gardés", fav) + sec("Terminés", done);
  $("#view").innerHTML = `<header class="hero"><h1>Mes tutos</h1><p class="lede">Les tutos commencés, ceux que tu gardes de côté, et ceux que tu as terminés.</p></header>
    ${body || `<div class="empty"><p>Rien ici pour l'instant. Ouvre une idée, coche une étape ou appuie sur « Garder dans mes tutos ».</p><p style="margin-top:14px"><a class="btn primary" href="#idees">Voir les idées</a></p></div>`}`;
}

/* ---------- navigation ---------- */
$("#nav").innerHTML = `<a class="brand" href="#idees">${LOGO}Claude en main</a>`
  + [["idees", "grid", "Idées"], ["demarrer", "play", "Démarrer"], ["mes", "star", "Mes tutos"]].map(t => `<a class="tab" href="#${t[0]}" data-tab="${t[0]}">${icon(t[1])}<span>${t[2]}</span></a>`).join("");
const cur = () => location.hash || "#idees";
const stack = [cur()], pos = {};
function route() {
  const h = cur().slice(1); let m, tab = "idees";
  if ((m = h.match(/^idee-([a-z0-9-]+)$/)) && BY[m[1]]) { const t = BY[m[1]]; tab = t.src === "s" ? "demarrer" : "idees"; viewTuto(t); }
  else if (h === "demarrer") { tab = "demarrer"; viewStart(); }
  else if (h === "mes") { tab = "mes"; viewMine(); }
  else viewHome();
  $$(".tab").forEach(a => { if (a.dataset.tab === tab) a.setAttribute("aria-current", "page"); else a.removeAttribute("aria-current"); });
}
window.addEventListener("hashchange", () => {
  const h = cur(), back = stack.length > 1 && stack[stack.length - 2] === h;
  pos[stack[stack.length - 1]] = window.scrollY;
  if (back) stack.pop(); else stack.push(h);
  route(); window.scrollTo(0, back ? (pos[h] || 0) : 0);
});
document.addEventListener("click", e => { const b = e.target.closest("[data-back]"); if (b && stack.length > 1) { e.preventDefault(); history.back(); } });
route();
</script>

</body></html>
