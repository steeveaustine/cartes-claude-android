 sert à rien. Tout reste réversible.", "cmd": "adb shell pm revoke nom.de.l.appli android.permission.RECORD_AUDIO"}, {"h": "Refais l'audit après les mises à jour", "p": "Une mise à jour peut redonner des autorisations. Garde le rapport et refais le contrôle de temps en temps."}], "trouble": [["L'ordinateur ne voit pas l'autoradio", "Essaie un autre port USB de la voiture, car souvent un seul transmet les données, ou passe par le débogage Wi-Fi."], ["Le GPS ou le Bluetooth ne marche plus", "Une appli système a été coupée par erreur : demande à Claude de la réactiver."]], "more": ["Faire le même audit sur une box télé ou une tablette bon marché.", "Vérifier ce que ton téléphone partage avec la voiture."], "warn": "Fais tout ça à l'arrêt, jamais en roulant. Sur un autoradio d'origine, renseigne-toi sur la garantie avant de modifier quoi que ce soit.", "kw": "voiture autoradio android micro écoute bluetooth vie privée adb infotainment"}, {"id": "hotel", "src": "v", "ico": "eye", "t": "Inspecter une chambre d'hôtel ou un Airbnb", "pitch": "Caméras Wi-Fi, traceurs Bluetooth, logiciel espion sur ton téléphone : Claude t'aide à faire le tour en un quart d'heure en arrivant.", "story": "Claude passe en revue le réseau d'une chambre d'hôtel ou d'un Airbnb à la recherche de caméras, analyse un téléphone pour y trouver des logiciels espions, et liste les appareils Bluetooth à proximité.", "lvl": 3, "diff": "Facile", "time": "15 min", "cost": "Gratuit", "pre": ["s-code"], "sk": {"n": [["laptop", "Ton ordi", 0, 0.5], ["wifi", "Appareils\nsur le Wi-Fi", 1.5, 0], ["bt", "Traceurs\nBluetooth", 1.5, 1], ["eye", "Caméra\ncachée ?", 3, 0.5, "hi"]], "e": [[0, 1, "", ""], [0, 2, "", ""], [1, 3, "", ""], [2, 3, "", ""]]}, "res": "La liste des appareils connectés au réseau du logement avec leur fabricant probable, celle des appareils Bluetooth proches, et les endroits à vérifier à l'œil.", "need": ["Un ordinateur portable avec Claude Code", "Ton téléphone, pour sa lampe et son appareil photo"], "steps": [{"h": "Commence à l'œil", "p": "Éteins la lumière et balaie la pièce avec la lampe du téléphone : l'objectif d'une caméra renvoie un petit reflet. Regarde les détecteurs de fumée, réveils, chargeurs USB, multiprises et cadres, surtout face au lit et dans la salle de bain."}, {"h": "Fais scanner le réseau", "p": "Beaucoup de réseaux d'hôtel isolent les clients entre eux : le scan y verra peu de chose. Dans un Airbnb, il est souvent plus parlant.", "pr": "Je suis dans un logement de vacances, connecté à son Wi-Fi. Liste les appareils présents sur ce réseau avec leur fabricant probable et leur type. Signale ceux qui ressemblent à une caméra, un micro ou un enregistreur. Reste passif : ne tente aucune connexion aux appareils."}, {"h": "Cherche les traceurs Bluetooth", "p": "Sur Android, active aussi les alertes de traceurs inconnus dans les paramètres de sécurité. Sur iPhone, l'alerte est automatique.", "pr": "Liste les appareils Bluetooth à proximité, avec la force de leur signal et leur type probable. Signale les traceurs (AirTag, Tile, SmartTag) et tout appareil qui ressemble à une caméra ou un micro."}, {"h": "Si tu as un doute sur ton téléphone", "p": "L'outil gratuit MVT, publié par Amnesty International, cherche les traces des logiciels espions connus. Claude peut l'installer et l'utiliser avec toi.", "pr": "Installe Mobile Verification Toolkit (MVT) et guide-moi pour analyser mon [iPhone ou Android] à la recherche de logiciels espions connus. Explique chaque résultat."}, {"h": "Si tu trouves quelque chose", "p": "Ne débranche rien et ne touche à rien. Prends des photos, quitte le logement, et signale-le à la plateforme et à la police. Les caméras cachées dans les espaces privés sont illégales."}], "trouble": [["Le scan ne voit presque rien", "Le réseau isole les appareils. Fie-toi davantage à l'inspection visuelle et au Bluetooth."], ["Un appareil inconnu apparaît", "Une box, une télé ou une enceinte connectée sont normales. Demande à Claude de chercher le fabricant pour trancher."]], "more": ["Faire le même tour dans une salle de réunion louée.", "Vérifier ta voiture si tu soupçonnes un traceur."], "warn": "Ne rien trouver n'est pas une garantie : une caméra qui enregistre sur une carte mémoire, sans Wi-Fi, n'apparaît pas sur le réseau.", "kw": "hôtel airbnb caméra cachée traceur airtag bluetooth espion vacances sécurité location"}, {"id": "medical", "src": "v", "ico": "heart", "t": "Faire travailler une équipe d'agents sur un dossier médical", "pitch": "Face à un diagnostic lourd, Claude fait travailler plusieurs agents en parallèle : lecture des comptes rendus, état de la recherche, essais cliniques, questions pour l'équipe soignante.", "story": "Une ingénieure de 35 ans, atteinte d'un cancer du sein avancé avec une tumeur rare, a coordonné une trentaine d'agents Claude pour étudier son cas. Le plan de biopsie qui en est sorti a été relu et amélioré par un laboratoire du Dana-Farber, à Boston.", "lvl": 1, "diff": "Moyen", "time": "2 h, puis au fil de l'eau", "cost": "Abonnement payant conseillé", "pre": [], "sk": {"n": [["doc", "Tes comptes\nrendus", 0, 0.5], ["bots", "Agents en\nparallèle", 1.5, 0.5, "hi"], ["flask", "Recherche,\nessais cliniques", 3, 0], ["user", "Questions pour\ntes médecins", 3, 1]], "e": [[0, 1, "", ""], [1, 2, "", ""], [1, 3, "", ""]]}, "res": "Un dossier clair : ton diagnostic expliqué simplement, les traitements reconnus, les essais en cours en France et en Europe, les centres spécialisés, et une liste de questions précises pour la prochaine consultation.", "need": ["Tes comptes rendus et analyses, en PDF ou en photos", "Claude avec un abonnement payant, pour la recherche approfondie et les projets", "Du temps, et quelqu'un de confiance à qui en parler"], "steps": [{"h": "Crée un projet dédié", "p": "Dans Claude, ouvre Projets, puis Nouveau projet. Ajoute tous les documents médicaux. Remplace ton nom par tes initiales si tu préfères. Chaque conversation du projet aura accès au dossier."}, {"h": "Fais expliquer le dossier", "p": "Commence par comprendre, avant de chercher plus loin.", "pr": "Lis tous les documents du projet. Explique-moi mon diagnostic avec des mots simples : ce que j'ai, à quel stade, ce que signifient les résultats importants. Fais une chronologie de mon parcours. Signale les termes que tu n'es pas sûr de bien comprendre."}, {"h": "Lance plusieurs recherches en parallèle", "p": "Active la recherche approfondie (bouton +, puis Recherche) et lance une recherche par angle, chacune dans sa conversation : traitements reconnus, recherche récente, essais cliniques ouverts. C'est ta petite équipe d'agents.", "pr": "Pour [diagnostic précis], quels essais cliniques recrutent en France et en Europe ? Pour chacun : critères d'inclusion, centres, contacts. Utilise les registres officiels (ClinicalTrials.gov, registre de l'Institut national du cancer) et cite tes sources."}, {"h": "Confronte les avis", "p": "C'est une façon de voir les angles morts, pas un avis médical.", "pr": "Joue tour à tour un oncologue, un radiologue et un spécialiste de la recherche clinique qui examinent mon dossier. Chacun donne son analyse, puis ils discutent de leurs désaccords. Termine par ce qui fait consensus et ce qui reste à trancher avec mes médecins."}, {"h": "Prépare la consultation", "p": "Une page, à imprimer et à apporter.", "pr": "Fais-moi une fiche d'une page pour ma prochaine consultation : mes dix questions par ordre de priorité, les essais à évoquer, les examens à demander, et ce que je dois apporter."}], "trouble": [["Claude se trompe sur un détail", "Corrige-le dans la conversation : il reprend son analyse. Vérifie toujours les chiffres sur le document d'origine."], ["Les sources se contredisent", "Demande-lui d'expliquer pourquoi (dates, populations étudiées) et pose la question à ton médecin."]], "more": ["Accompagner un proche : le projet peut se partager.", "Tenir un journal des symptômes et des traitements, que Claude résume avant chaque rendez-vous."], "warn": "Claude ne remplace ni le médecin ni l'équipe soignante. Il t'aide à comprendre et à poser les bonnes questions ; les décisions de traitement se prennent avec eux.", "kw": "santé cancer maladie dossier médical essais cliniques agents recherche médecin diagnostic"}, {"id": "solo", "src": "v", "ico": "group", "t": "Faire tourner ton entreprise avec une équipe d'agents", "pitch": "Veille, prospection, relances, support, préparation de la compta : Claude prend les postes que tu n'as pas, chacun avec sa mission et sa routine.", "story": "La vidéo raconte l'histoire d'un fondateur de biotech qui travaillait seul, avec des agents Claude et quelques prestataires, jusqu'au rachat de son entreprise.", "lvl": 2, "diff": "Moyen", "time": "Une demi-journée", "cost": "Abonnement payant", "pre": [], "sk": {"n": [["user", "Toi, le patron", 1.5, 0, "hi"], ["bot", "Veille", 0, 1], ["bot", "Relances", 1, 1], ["bot", "Support", 2, 1], ["bot", "Compta", 3, 1]], "e": [[0, 1, "", ""], [0, 2, "", ""], [0, 3, "", ""], [0, 4, "", ""]]}, "res": "Une organisation où chaque tâche récurrente a son agent, ses instructions et son horaire. Ton temps va à ce que toi seul sais faire : les clients, les décisions, le métier.", "need": ["Claude avec un abonnement payant (projets, connecteurs, tâches planifiées)", "Tes outils reliés : mails, agenda, Drive", "La liste de ce qui te prend du temps chaque semaine"], "steps": [{"h": "Liste les postes vacants", "p": "Décris ta semaine sans filtre, Claude fait le tri.", "pr": "Voici ma semaine type : [description]. Repère les tâches répétitives que des agents pourraient prendre en charge, regroupe-les en postes (veille, commercial, support, administratif), et estime le temps gagné pour chacun."}, {"h": "Crée un projet par poste", "p": "Un projet « Commercial », un projet « Veille », et ainsi de suite. Dans chacun, mets les documents utiles (tarifs, modèles, liste de clients) et des instructions claires : rôle, ton, limites, ce qui doit te remonter."}, {"h": "Branche les outils", "p": "Ouvre Personnaliser, puis Connecteurs, et relie la boîte mail, l'agenda et le Drive. L'agent commercial prépare alors des brouillons de relance, l'agent support trie les demandes."}, {"h": "Donne une routine à chaque agent", "p": "Les tâches planifiées tournent seules et t'envoient le résultat.", "pr": "Tous les lundis à 8 h, prépare la veille de la semaine sur [ton secteur] : concurrents, prix, nouveautés, en une page. Tous les jours à 17 h, liste les devis envoyés sans réponse depuis 7 jours et prépare une relance pour chacun, que je validerai."}, {"h": "Garde la main", "p": "Chaque vendredi, prends vingt minutes pour relire ce que les agents ont produit et corriger leurs instructions. Rien ne part chez un client sans ta validation."}], "trouble": [["Un agent fait n'importe quoi", "Ses instructions sont trop vagues. Donne-lui un exemple de bon résultat."], ["Trop de choses à valider", "Commence par un seul poste bien rodé avant d'en ajouter d'autres."]], "more": ["Un agent qui prépare chaque mois les pièces pour ton comptable.", "Un agent qui prépare les réponses aux questions fréquentes des clients."], "warn": "Pour tout ce qui est réglementé (contrats, santé, finances), garde un professionnel dans la boucle. Les agents préparent, tu décides.", "kw": "entreprise solo agents organisation équipe automatiser patron indépendant"}, {"id": "exoplanete", "src": "v", "ico": "planet", "t": "Chercher une exoplanète dans les données de la NASA", "pitch": "Les télescopes de la NASA publient leurs mesures gratuitement. Claude Code écrit les programmes qui fouillent des années de données à la recherche d'une petite baisse de lumière : le passage d'une planète devant son étoile.", "story": "Une personne fait écrire à Claude environ 1 500 programmes pour fouiller sept ans de données d'un télescope de la NASA, et repère une candidate planète passée inaperçue. Le lendemain, quelqu'un qui a refait la démarche en trouve deux autres.", "lvl": 3, "diff": "Moyen", "time": "Une soirée", "cost": "Gratuit", "pre": ["s-code"], "sk": {"n": [["telescope", "Télescope TESS,\ndonnées publiques", 0, 0], ["term", "Claude Code\nanalyse", 1.5, 0], ["chart", "Courbe de lumière\nqui baisse", 3, 0], ["planet", "Candidate\nplanète", 3, 1, "hi"]], "e": [[0, 1, "téléchargement", "d"], [1, 2, "", ""], [2, 3, "", ""]]}, "res": "Des graphiques que tu comprends, une méthode reproductible, et peut-être une candidate à soumettre aux astronomes amateurs qui vérifient ce genre de trouvaille.", "need": ["Un ordinateur avec Claude Code", "Quelques gigaoctets libres sur le disque", "De la curiosité, pas de diplôme d'astronomie"], "steps": [{"h": "Commence par une planète connue", "p": "Voir une vraie détection t'apprend à quoi ressemble le signal.", "pr": "Je veux apprendre à chercher des exoplanètes avec les données publiques du télescope TESS de la NASA. Installe ce qu'il faut (par exemple la bibliothèque lightkurve), télécharge la courbe de lumière d'une étoile connue pour avoir une planète, et montre-moi le graphique. Explique ce qu'on voit, comme à un débutant."}, {"h": "Comprends la méthode", "p": "Quand une planète passe devant son étoile, la lumière baisse un peu, à intervalles réguliers. Claude utilise une méthode de recherche de périodes pour trouver ces baisses répétées au milieu du bruit.", "fig": {"n": [["planet", "La planète passe", 0, 0], ["chart", "La lumière baisse\nun peu", 1.5, 0], ["clock", "Toujours au même\nintervalle", 3, 0]], "e": [[0, 1, "", ""], [1, 2, "", ""]]}}, {"h": "Cherche sur des étoiles non étudiées", "p": "Claude traite les étoiles par lots et garde un tableau des résultats.", "pr": "Applique la même méthode à [500] étoiles observées par TESS qui ne figurent pas dans la liste des candidats connus (TOI). Traite-les par lots, garde un tableau des résultats, et classe les signaux les plus prometteurs. Élimine les faux positifs classiques : étoiles doubles, taches, artefacts du télescope."}, {"h": "Vérifie tes meilleurs signaux", "p": "Pour chaque signal retenu, demande les vérifications : profondeur constante, forme du creux, pas de décalage sur l'image. Claude explique à chaque fois pourquoi il le garde ou le rejette."}, {"h": "Partage ta trouvaille", "p": "Si un signal tient la route, le projet participatif Planet Hunters TESS, sur Zooniverse, et la communauté ExoFOP sont les bons interlocuteurs. Claude t'aide à rédiger une présentation claire."}], "trouble": [["Le téléchargement est très long", "Commence par moins d'étoiles : les données sont lourdes."], ["Trop de signaux", "La plupart sont des faux positifs. Demande des filtres plus stricts."]], "more": ["Chercher des étoiles variables ou des éclipses.", "Appliquer la même démarche aux données ouvertes de la météo ou de la santé publique."], "warn": "Un signal n'est pas une découverte : il faut des observations de suivi par des astronomes pour confirmer une planète.", "kw": "astronomie exoplanète nasa tess science données planète étoile télescope"}, {"id": "agents-1000", "src": "v", "ico": "bots", "t": "Lancer des centaines d'agents sur une énorme base de données", "pitch": "Quand un travail se découpe en milliers de petits morceaux, Claude Code lance des agents en parallèle, chacun sur sa part, puis rassemble les résultats.", "story": "La vidéo rapporte qu'Anthropic a lancé environ 1 000 agents Claude sur une grande base de données d'ADN, et qu'ils ont repéré une enzyme inconnue, proche de celles utilisées pour l'édition génétique CRISPR. Une découverte qui demande encore à être confirmée.", "lvl": 3, "diff": "Avancé", "time": "Variable", "cost": "Abonnement élevé conseillé", "pre": ["s-code"], "sk": {"n": [["sheet", "Grosse base\n(milliers de lignes)", 0, 0], ["bots", "Agents\nen parallèle", 1.5, 0, "hi"], ["chart", "Résultats\nrassemblés", 3, 0], ["dna", "Comme les 1 000\nagents sur l'ADN", 1.5, 1]], "e": [[0, 1, "découpage", ""], [1, 2, "synthèse", ""]]}, "res": "Un travail de plusieurs semaines fait en quelques heures : fiches produits enrichies, catalogue fournisseur vérifié, centaines de documents classés, avec un tableau final.", "need": ["Un travail découpable en morceaux indépendants", "Claude Code", "Un abonnement qui supporte un gros volume, car les agents consomment vite"], "steps": [{"h": "Choisis le bon type de travail", "p": "Ça marche quand chaque morceau se traite seul : 3 000 références à vérifier, 500 contrats à résumer, 200 concurrents à étudier. Ça marche mal quand tout dépend de tout."}, {"h": "Teste sur dix éléments", "p": "Valide le format sur un petit échantillon avant de lancer la machine.", "pr": "Voici mon fichier [nom] avec [nombre] lignes. Pour chaque ligne, il faut [travail précis]. Commence par traiter seulement les 10 premières lignes et montre-moi le résultat pour que je valide le format."}, {"h": "Lance le grand travail", "p": "Claude répartit les lots entre ses agents et surveille l'avancement.", "pr": "Le format est bon. Traite maintenant toutes les lignes en répartissant le travail entre plusieurs agents en parallèle, par lots de [50]. Chaque agent écrit ses résultats dans un fichier à part. Ensuite, rassemble tout dans un seul tableau, signale les lignes en échec, et vérifie toi-même un échantillon de 20 lignes au hasard."}, {"h": "Contrôle l'échantillon", "p": "Vérifie quelques lignes à la main. Si un type d'erreur revient, corrige la consigne et relance seulement les lignes concernées."}], "trouble": [["Le quota est atteint en cours de route", "Reprends plus tard : demande à Claude de ne relancer que les lots non terminés."], ["Les résultats varient d'un agent à l'autre", "Mets un exemple de résultat attendu dans la consigne."]], "more": ["Enrichir toutes les fiches d'un catalogue en une nuit.", "Comparer les prix de 1 000 références chez trois fournisseurs."], "warn": "Plusieurs agents consomment ton quota très vite. Commence petit et garde un œil sur ta consommation.", "kw": "agents parallèle base de données volume masse automatisation adn enzyme"}, {"id": "jeu-traduit", "src": "v", "ico": "gamepad", "t": "Traduire et redoubler un jeu pour enfant", "pitch": "Un jeu que ton enfant adore n'existe qu'en anglais ? Claude extrait les textes et les répliques, les traduit, et refait les voix en français avec des voix de synthèse gratuites qui tournent sur ton ordinateur.", "story": "Un parent fait extraire par Claude les répliques d'un jeu, les fait traduire, puis les fait redoubler en français avec des modèles de voix gratuits et locaux, pour son enfant de 4 ans.", "lvl": 3, "diff": "Avancé", "time": "Un week-end", "cost": "Gratuit", "pre": ["s-code"], "sk": {"n": [["gamepad", "Jeu en anglais", 0, 0], ["doc", "Répliques\nextraites", 1.5, 0], ["headphones", "Traduites et\nredoublées", 3, 0], ["child", "Le jeu\nen français", 3, 1, "hi"]], "e": [[0, 1, "", ""], [1, 2, "", ""], [2, 3, "", ""]]}, "res": "Le même jeu, avec ses menus, ses dialogues et ses voix en français. Une version faite pour ton enfant, à usage familial.", "need": ["Le jeu installé sur l'ordinateur (les jeux PC sont les plus faciles à modifier)", "Claude Code", "Un ordinateur assez récent pour générer les voix"], "steps": [{"h": "Vérifie que le jeu se modifie", "p": "Certains jeux rangent leurs textes dans des fichiers lisibles, d'autres les compressent. Claude regarde et te dit ce qui est faisable.", "pr": "Ce dossier contient le jeu [nom], installé sur mon PC. Regarde comment il stocke ses textes et ses fichiers audio. Dis-moi si on peut les extraire et les remplacer, et s'il existe déjà une traduction faite par des fans."}, {"h": "Sauvegarde tout", "p": "Avant toute modification, copie le dossier complet du jeu. Si quelque chose casse, tu reviens en arrière en deux minutes."}, {"h": "Extrais et traduis", "p": "Relis le tableau avant de passer aux voix : c'est le moment de corriger le vocabulaire.", "pr": "Extrais tous les textes et la liste des répliques audio avec leur personnage. Traduis en français pour un enfant de [4] ans : phrases courtes, mots simples, même ton que l'original. Garde les noms propres. Mets tout dans un tableau que je peux relire avant la suite."}, {"h": "Choisis les voix", "p": "Claude installe un modèle de voix de synthèse libre qui tourne sur ta machine, sans internet, comme Piper. Écoute les voix françaises et attribue-en une à chaque personnage.", "pr": "Installe un modèle de synthèse vocale libre et local avec plusieurs voix françaises. Génère un échantillon de chaque voix sur la même phrase pour que je choisisse une voix par personnage : [liste des personnages]."}, {"h": "Génère et remplace", "p": "Les nouveaux fichiers doivent avoir le même format que les originaux.", "pr": "Génère toutes les répliques avec les voix choisies, au même format et à une durée proche des originales, puis remplace les fichiers dans le jeu. Remplace aussi les textes affichés."}, {"h": "Teste avec ton enfant", "p": "Joue la première partie avec lui. Note les répliques qui sonnent mal et les textes qui dépassent du cadre, puis fais-les corriger."}], "trouble": [["Le jeu plante après remplacement", "Un fichier n'a pas le bon format. Restaure la sauvegarde et demande à Claude de vérifier les formats un par un."], ["Une voix sonne robotique", "Essaie une autre voix ou ralentis un peu le débit."]], "more": ["Ajouter des sous-titres français à un dessin animé.", "Traduire un livre audio pour enfant en italien, pour garder le lien avec la famille."], "warn": "Usage familial uniquement : les textes, voix et images du jeu restent la propriété de l'éditeur. Ne publie pas la version modifiée.", "kw": "jeu enfant traduction doublage voix français synthèse vocale piper"}, {"id": "site-enfant", "src": "v", "ico": "child", "t": "Aider un enfant à créer son propre site", "pitch": "Un enfant de neuf ans peut construire son site en parlant à Claude. Il décrit, Claude construit et explique, et l'enfant apprend en posant ses questions.", "story": "Un garçon de neuf ans a construit son site personnel simplement en discutant avec Claude Code.", "lvl": 1, "diff": "Facile", "time": "1 h", "cost": "Gratuit", "pre": [], "sk": {"n": [["child", "Il décrit\nson idée", 0, 0], ["claude", "Claude construit\net explique", 1.5, 1], ["browser", "Son site", 3, 0, "hi"]], "e": [[0, 1, "", ""], [1, 2, "", ""], [2, 0, "il améliore", ""]]}, "res": "Un vrai site, avec ses pages, ses couleurs et ses passions, et un enfant qui a compris comment marche une page web, parce qu'il a posé lui-même les questions.", "need": ["Un ordinateur ou une tablette, et ton compte Claude", "Un adulte à côté de l'enfant"], "steps": [{"h": "Laisse-le choisir le sujet", "p": "Ses dinosaures, son équipe de foot, ses dessins. L'important, c'est que ce soit son projet."}, {"h": "Lance la conversation avec lui", "p": "Tape la consigne ensemble, puis laisse-le prendre la suite.", "pr": "Mon enfant de [9] ans veut créer son site sur [sujet]. Aide-le comme un professeur patient : construis le site petit à petit, et explique avec des mots simples ce que fait chaque partie. Pose-lui des questions sur ce qu'il veut. Pas de nom de famille, d'adresse ni de photo de lui sur le site."}, {"h": "Laisse-le piloter", "p": "Il demande les changements lui-même : « mets le titre en vert », « ajoute une page pour mes dessins ». Encourage-le à demander « pourquoi ça marche comme ça ? »."}, {"h": "Ajoute ses créations", "p": "Il peut joindre des photos de ses dessins avec le bouton +. Claude les range dans une galerie."}, {"h": "Partage-le si vous le souhaitez", "p": "Le site a déjà son lien, privé tant que tu ne le partages pas. Pour l'envoyer aux grands-parents, passe par le menu Partager."}], "trouble": [["Il s'ennuie au bout de dix minutes", "Propose un défi : un quiz sur son sujet, ou un jeu caché dans le site."], ["Le site devient brouillon", "Demande à Claude de tout ranger proprement en gardant ses idées."]], "more": ["Un site de famille avec les recettes de la grand-mère.", "Plus tard, passer à Claude Code pour qu'il voie le vrai code."], "warn": "Claude est réservé aux adultes : c'est toi qui tiens le compte, l'enfant construit avec toi. Rien de personnel en ligne : ni nom complet, ni école, ni adresse, ni photo de l'enfant.", "kw": "enfant site web créer apprendre programmation famille"}, {"id": "chambre-3d", "src": "v", "ico": "sofa", "t": "Vérifier en 3D qu'un meuble rentre avant de l'acheter", "pitch": "Tu donnes les mesures et quelques photos de la pièce. Claude construit une visite en 3D où tu places le nouveau lit, l'armoire ou le canapé, et tu vois tout de suite si ça passe.", "story": "Un couple prend les mesures et des photos de la chambre de sa fille. Claude en tire une visite 3D pour vérifier qu'un nouveau lit rentrera, et pour essayer aussi les cadres et l'éclairage.", "lvl": 1, "diff": "Facile", "time": "30 min", "cost": "Gratuit", "pre": [], "sk": {"n": [["ruler", "Mesures\nde la pièce", 0, 0], ["photo", "Photos", 0, 1], ["cube3d", "Visite 3D", 1.5, 0.5], ["sofa", "Le meuble\nà sa place", 3, 0.5, "hi"]], "e": [[0, 2, "", ""], [1, 2, "", ""], [2, 3, "", ""]]}, "res": "Une pièce en 3D que tu fais tourner du doigt, avec le meuble à l'échelle, l'espace libre en centimètres, et autant de dispositions que tu veux en essayer.", "need": ["Un mètre ruban", "Les dimensions du meuble (sur sa fiche produit)", "Claude, sur ordinateur ou téléphone"], "steps": [{"h": "Mesure la pièce", "p": "Longueur, largeur, hauteur sous plafond. Note la position des portes, fenêtres et radiateurs à partir d'un coin, et le sens d'ouverture de la porte. Un croquis à main levée avec les cotes suffit.", "fig": {"n": [["plan", "Ton croquis coté", 0.6, 0], ["ruler", "420 × 310 cm\nporte 83 cm", 2.4, 0]], "e": [[1, 0, "", ""]]}}, {"h": "Prends deux ou trois photos", "p": "Depuis les coins, pour que Claude voie les couleurs, le sol et les meubles qui restent."}, {"h": "Lance la construction", "p": "Joins le croquis et les photos avec le bouton +, puis colle la consigne.", "pr": "Construis une visite 3D de cette pièce que je peux faire tourner : [longueur x largeur x hauteur] cm, porte de [largeur] cm sur le mur [lequel], qui s'ouvre vers l'intérieur, fenêtre sur le mur [lequel], radiateur [position]. Voici les photos pour les couleurs. Ajoute les meubles qui restent : [liste avec dimensions]. Puis place [le nouveau meuble, avec ses dimensions] contre [quel mur] et affiche l'espace libre restant en centimètres."}, {"h": "Vérifie les passages", "p": "Demande : « la porte s'ouvre-t-elle en entier ? », « reste-t-il 60 cm pour passer ? ». Claude affiche les mesures sur la vue."}, {"h": "Essaie d'autres versions", "p": "« Mets le lit sous la fenêtre », « essaie la version 140 au lieu de 160 », « ajoute un plafonnier et un cadre au-dessus du lit »."}], "trouble": [["Les proportions semblent fausses", "Vérifie une cote et redonne-la à Claude : une seule erreur de saisie fausse tout."]], "more": ["Aménager un local : présentoirs, comptoir, passage des clients.", "Vérifier qu'un meuble passera par l'escalier et la porte d'entrée."], "warn": "Garde toujours quelques centimètres de marge : les murs ne sont jamais parfaitement droits.", "kw": "meuble lit canapé 3d aménagement chambre mesure décoration"}, {"id": "maison-3d", "src": "v", "ico": "house", "t": "Visiter ta future maison avant sa construction", "pitch": "À partir du plan de l'architecte, Claude monte les murs en 3D et tu te promènes dedans : la lumière, les volumes, le passage entre la cuisine et le salon.", "story": "Les mêmes visites 3D servent à se projeter dans une maison avant qu'elle ne soit construite, à partir de ses plans.", "lvl": 1, "diff": "Moyen", "time": "1 h", "cost": "Gratuit", "pre": [], "sk": {"n": [["plan", "Plan de\nl'architecte", 0, 0], ["claude", "Lecture\ndes cotes", 1.5, 0], ["house", "Visite 3D\nà l'échelle", 3, 0, "hi"]], "e": [[0, 1, "photo ou PDF", ""], [1, 2, "", ""]]}, "res": "Une maquette que tu parcours pièce par pièce, et des variantes testées en quelques minutes : cloison en moins, îlot central, baie vitrée plus large.", "need": ["Le plan, en PDF ou en photo bien à plat avec les cotes lisibles", "Claude, de préférence sur ordinateur"], "steps": [{"h": "Prépare le plan", "p": "Un PDF de l'architecte est idéal. Sinon, photographie le plan à plat, bien éclairé, une photo par niveau."}, {"h": "Fais d'abord lire le plan", "p": "Cette vérification évite de construire toute la maquette sur une erreur de lecture.", "pr": "Voici le plan de ma future maison. Avant de dessiner quoi que ce soit, liste les pièces avec leurs dimensions telles que tu les lis, la position des portes et des fenêtres, et l'orientation si elle est indiquée. Je vérifie, puis tu construis."}, {"h": "Construis la visite", "p": "Claude produit une maquette dans laquelle tu te déplaces.", "pr": "Les dimensions sont bonnes. Construis la maison en 3D à l'échelle, avec murs, portes et fenêtres, et laisse-moi me déplacer à l'intérieur à hauteur d'yeux. Ajoute un réglage de l'heure pour voir la lumière du soleil entrer dans les pièces, avec le nord [en haut du plan]."}, {"h": "Teste les variantes", "p": "« Ouvre la cuisine sur le salon », « élargis la baie à 3 mètres », « meuble le salon avec un canapé de 2,40 m ». Compare les versions côte à côte."}, {"h": "Rapporte tes questions à l'architecte", "p": "La visite fait apparaître des questions qu'on ne voit pas sur un plan.", "pr": "À partir de cette visite, liste les points à discuter avec mon architecte : passages étroits, pièces sombres, rangements manquants."}], "trouble": [["Claude lit mal une cote", "Corrige-la dans la conversation. Les plans dessinés à la main sont plus difficiles à lire que les PDF."]], "more": ["Simuler la rénovation d'un local commercial avant les travaux.", "Tester plusieurs teintes de sol et de murs."], "warn": "C'est un outil pour se projeter, pas un plan d'exécution : les cotes de référence restent celles de l'architecte.", "kw": "maison construction plan architecte 3d visite virtuelle travaux rénovation"}, {"id": "genealogie", "src": "v", "ico": "tree", "t": "Remonter ton arbre généalogique sur cinq générations", "pitch": "À partir d'un seul acte de naissance, Claude t'indique où chercher l'acte des parents, déchiffre l'écriture ancienne et remonte génération après génération.", "story": "Un utilisateur tchèque donne à Claude un vieil acte de naissance. De registre en registre, il retrouve cinq générations d'ancêtres qu'il ne connaissait pas.", "lvl": 1, "diff": "Facile", "time": "Quelques soirées", "cost": "Gratuit", "pre": [], "sk": {"n": [["scroll", "Un vieil acte\nde naissance", 0, 0], ["claude", "Lit l'acte et dit\noù chercher", 1.5, 0], ["globe", "Archives\nen ligne", 1.5, 1], ["tree", "5 générations", 3, 0.5, "hi"]], "e": [[0, 1, "photo", ""], [1, 2, "", "b"], [1, 3, "", ""]]}, "res": "Un arbre avec les noms, dates et lieux, chaque information reliée à l'acte qui la prouve, et les actes anciens transcrits en français moderne.", "need": ["Un acte de départ (livret de famille, acte de naissance d'un grand-parent)", "Claude, avec la recherche web si possible", "Les sites gratuits des archives départementales"], "steps": [{"h": "Pars de ce que tu as", "p": "Le livret de famille des grands-parents donne souvent les dates et lieux de naissance et de mariage, et les noms des parents. C'est ton point de départ."}, {"h": "Demande où chercher", "p": "Claude connaît l'organisation des archives et la façon de naviguer dans les registres numérisés.", "pr": "Je fais mon arbre généalogique. Point de départ : [nom, date et lieu de naissance]. Dis-moi sur quel site d'archives chercher l'acte, dans quel registre (naissances, mariages, décès), à quelle année, et comment naviguer dans le registre numérisé."}, {"h": "Fais déchiffrer les actes", "p": "Les registres anciens sont manuscrits, parfois en latin avant la Révolution. Fais une capture de l'acte et envoie-la : Claude transcrit, traduit et relève tout ce qui sert.", "pr": "Voici l'acte trouvé. Transcris-le mot à mot, traduis-le en français moderne si besoin, puis liste les informations utiles pour remonter à la génération précédente : parents, âges, professions, témoins, village d'origine."}, {"h": "Remonte génération par génération", "p": "L'acte de mariage donne les noms des parents des mariés, qui te mènent à leurs propres actes. Demande à Claude de tenir un tableau à jour à chaque trouvaille."}, {"h": "Fais dessiner l'arbre", "p": "Quand tu as tes générations, Claude les met en forme.", "pr": "Fais l'arbre de toutes les personnes trouvées, avec dates et lieux, sous forme visuelle, et la liste des sources pour chaque personne."}], "trouble": [["Je ne trouve pas l'acte", "Les registres ont des tables décennales qui listent les actes par nom : demande à Claude comment les utiliser. Pense aussi que l'orthographe des noms varie beaucoup."], ["Une branche vient de l'étranger", "Italie, Tunisie, Pologne : chaque pays a ses archives, souvent en ligne. Claude t'oriente vers les bons fonds."]], "more": ["Rédiger l'histoire de la famille à partir des actes.", "Retrouver des cousins éloignés grâce aux arbres publics (Geneanet, FamilySearch)."], "warn": "En France, les actes de naissance et de mariage ne sont librement consultables qu'au bout de 75 ans. Pour les plus récents, il faut une demande à la mairie.", "kw": "généalogie arbre ancêtres archives état civil famille actes"}, {"id": "appli-bebe", "src": "v", "ico": "apps", "t": "Refaire une appli devenue payante", "pitch": "Une appli que tu utilises tous les jours passe à l'abonnement ? Claude te construit la tienne, avec les fonctions utiles, et tes données restent chez toi.", "story": "L'appli de suivi des tétées et des biberons d'un parent est devenue payante, sans version gratuite. Il en a refait une avec Claude, puis l'a offerte gratuitement aux autres parents.", "lvl": 1, "diff": "Facile", "time": "1 h", "cost": "Gratuit", "pre": [], "sk": {"n": [["phone", "Appli devenue\npayante", 0, 0, "x"], ["claude", "Claude\nla recrée", 1.5, 0], ["apps", "Ta version,\ntes données", 3, 0, "hi"]], "e": [[0, 1, "captures", ""], [1, 2, "", ""]]}, "res": "Une appli simple et rapide, sans publicité, qui fait exactement ce dont tu as besoin, et que tu peux partager avec qui tu veux.", "need": ["Des captures d'écran de l'appli d'origine", "Claude (le compte gratuit suffit pour commencer)"], "steps": [{"h": "Fais des captures", "p": "Photographie les écrans que tu utilises vraiment, et ignore les autres."}, {"h": "Décris ton usage", "p": "Joins les captures avec le bouton +.", "pr": "Voici des captures d'une appli que j'utilise pour [usage]. Recrée une appli équivalente, simple et rapide sur téléphone, avec : [fonctions précises]. Les données restent sur le téléphone, avec un export en fichier. Ne copie ni le nom, ni le logo, ni le design de l'original : fais ton propre design."}, {"h": "Installe-la sur ton téléphone", "p": "Ouvre la page créée par Claude sur le téléphone, puis « Ajouter à l'écran d'accueil ». Elle se comporte comme une appli."}, {"h": "Améliore-la à l'usage", "p": "Au bout de quelques jours, tu sauras ce qui manque : un rappel, un graphique, une saisie à une main pendant la nuit. Demande-le."}, {"h": "Partage-la si tu veux", "p": "Le lien se partage. Pour un usage à plusieurs, comme les deux parents ou la nounou, demande un stockage partagé."}], "trouble": [["Les données disparaissent", "Les données de navigateur peuvent s'effacer. Fais régulièrement l'export, ou demande une sauvegarde automatique."]], "more": ["Une appli de suivi des travaux pour un atelier.", "Un carnet d'entretien de la voiture."], "warn": "Tu recrées un service, pas une copie : le nom, le logo, les écrans et le code de l'original restent protégés.", "kw": "appli payante abonnement bébé suivi recréer remplacer application"}, {"id": "simulateur-drone", "src": "v", "ico": "gamepad", "t": "Construire un simulateur de vol de drone", "pitch": "Avant de faire voler un vrai drone, entraîne-toi dans un simulateur fait sur mesure, avec ta manette ou ta radiocommande, dans un décor qui ressemble à ton terrain.", "story": "Un passionné de drones construit son propre simulateur pour s'entraîner au pilotage avant de faire voler l'appareil réel.", "lvl": 1, "diff": "Moyen", "time": "2 h", "cost": "Gratuit", "pre": [], "sk": {"n": [["gamepad", "Manette ou\nradiocommande", 0, 0], ["browser", "Simulateur 3D\ndans le navigateur", 1.5, 0, "hi"], ["drone", "Exercices :\ndécollage, slalom…", 3, 0]], "e": [[0, 1, "USB", ""], [1, 2, "", ""]]}, "res": "Un simulateur qui tourne dans le navigateur, avec une physique crédible, des exercices de difficulté croissante et un chronomètre. Tu arrives au premier vol avec les bons réflexes.", "need": ["Un ordinateur", "Une manette de jeu USB, ou une radiocommande qui se branche comme une manette (beaucoup de radios FPV le font)", "Claude"], "steps": [{"h": "Décris ton drone et ton but", "p": "Plus tu es précis sur le drone et le mode de vol, plus le simulateur sera fidèle.", "pr": "Construis un simulateur de vol de drone en 3D qui tourne dans le navigateur. Je vais piloter un [modèle] en mode [normal ou FPV]. Commandes à la manette USB : gaz et lacet à gauche, tangage et roulis à droite. Physique réaliste : inertie, vent léger, batterie qui se vide. Vue à la troisième personne et vue caméra embarquée."}, {"h": "Branche ta manette", "p": "Branche la manette ou la radiocommande en USB avant d'ouvrir le simulateur, puis appuie sur un bouton pour qu'il la détecte. Si un axe est inversé, dis-le à Claude.", "fig": {"n": [["gamepad", "Manche gauche :\ngaz et lacet", 0.4, 0], ["drone", "", 1.5, 0], ["gamepad", "Manche droit :\ntangage et roulis", 2.6, 0]], "e": [[0, 1, "", ""], [2, 1, "", ""]]}}, {"h": "Demande des exercices", "p": "Des exercices progressifs, comme à l'auto-école.", "pr": "Ajoute cinq exercices progressifs avec chronomètre : décollage et vol stationnaire, carré autour d'un arbre, atterrissage précis sur une cible, slalom entre des poteaux, retour au point de départ avec du vent fort."}, {"h": "Recrée ton terrain", "p": "Envoie une vue satellite ou un croquis de l'endroit où tu voleras : Claude reproduit les arbres, la maison et les obstacles."}, {"h": "Entraîne-toi un quart d'heure par jour", "p": "Les réflexes viennent vite. Quand tous les exercices passent sans crash, tu es prêt pour un premier vol réel, sur un terrain dégagé."}], "trouble": [["La manette n'est pas détectée", "Certains navigateurs attendent qu'on appuie sur un bouton après l'ouverture de la page. Essaie aussi un autre navigateur."], ["Le pilotage est trop nerveux", "Demande une courbe de réponse plus douce sur les manches."]], "more": ["Un mode chrono pour te mesurer à des amis.", "Reproduire les situations d'urgence : perte de signal, batterie faible."], "warn": "Le simulateur prépare, il ne remplace pas les obligations réelles. Selon le poids et l'équipement de ton drone, l'enregistrement et la formation se font sur le portail AlphaTango de la DGAC.", "kw": "drone simulateur pilotage entraînement manette fpv 3d"}, {"id": "podcasts", "src": "v", "ico": "headphones", "t": "Transformer 40 heures de podcasts en guide pratique", "pitch": "Des dizaines d'épisodes que tu n'auras jamais le temps d'écouter deviennent un guide dense de quelques pages, avec la source de chaque conseil.", "story": "Quelqu'un condense une quarantaine d'heures d'entretiens avec des développeurs, sur la façon de se faire embaucher, en un guide court et dense.", "lvl": 2, "diff": "Facile", "time": "1 h, plus la transcription", "cost": "Gratuit", "pre": [], "sk": {"n": [["headphones", "40 h\nd'épisodes", 0, 0], ["doc", "Transcriptions", 1.5, 0], ["claude", "Synthèse", 1.5, 1], ["book", "Guide de\nquelques pages", 3, 0.5, "hi"]], "e": [[0, 1, "", ""], [1, 2, "", ""], [2, 3, "", ""]]}, "res": "Un guide classé par thème : les idées qui reviennent, les conseils concrets, les désaccords entre invités, et un plan d'action, chaque point relié à l'épisode d'origine.", "need": ["Les épisodes : liens YouTube, fichiers audio ou flux du podcast", "Claude, et Claude Code pour transcrire en masse"], "steps": [{"h": "Récupère les transcriptions", "p": "Pour des vidéos YouTube, les sous-titres automatiques suffisent souvent. Pour des fichiers audio, Claude Code transcrit tout sur ton ordinateur avec un modèle libre comme Whisper.", "w": "code", "pr": "Ce dossier contient [nombre] épisodes de podcast en MP3. Transcris-les tous en texte avec un modèle qui tourne sur mon ordinateur, un fichier texte par épisode, avec le titre de l'épisode en en-tête."}, {"h": "Donne tout à Claude", "p": "Crée un projet et ajoute les transcriptions : chaque conversation du projet peut les consulter. Pour un très gros volume, Claude Code lit le dossier directement."}, {"h": "Demande le guide", "p": "Exige les sources : c'est ce qui rend le guide fiable.", "pr": "À partir de toutes les transcriptions, écris un guide pratique sur [sujet] : 1) les idées qui reviennent chez plusieurs invités, 2) les conseils concrets classés par thème, 3) les désaccords et qui pense quoi, 4) un plan d'action en dix points. Indique pour chaque idée l'épisode et le moment d'où elle vient. Pas de remplissage."}, {"h": "Creuse ce qui t'intéresse", "p": "Pose des questions précises : « que disent-ils des prix ? », « qui parle des premiers clients ? ». Claude répond avec les passages d'origine."}, {"h": "Fais-en un document", "p": "Demande la version finale en Word ou en PDF, pour la relire au calme ou l'imprimer."}], "trouble": [["La transcription est lente", "Demande un modèle plus petit, ou lance la transcription pendant la nuit."], ["Le guide reste général", "Exige des exemples précis et des chiffres, avec leur source."]], "more": ["Faire pareil avec des vidéos de formation de ton métier.", "Résumer les conférences d'un salon professionnel."], "warn": "Garde ce guide pour ton usage personnel : le contenu des podcasts appartient à leurs auteurs.", "kw": "podcast audio transcription synthèse guide résumé youtube whisper"}, {"id": "vieux-jeu", "src": "v", "ico": "gamepad", "t": "Faire revivre un vieux jeu", "pitch": "Un jeu de ton enfance qui ne tourne plus ? Claude Code aide à le relancer sur une machine moderne, à rafraîchir ses graphismes, voire à l'adapter à une autre plateforme.", "story": "Des agents Claude démontent d'anciens jeux pour comprendre leur fonctionnement, les modifient, et les adaptent à d'autres machines.", "lvl": 3, "diff": "Avancé", "time": "Variable", "cost": "Gratuit", "pre": ["s-code"], "sk": {"n": [["gamepad", "Ton vieux jeu", 0, 0], ["term", "Claude Code\nl'analyse", 1.5, 0], ["monitor", "Ordinateur\nmoderne", 3, 0, "hi"], ["phone", "Autre\nplateforme", 3, 1]], "e": [[0, 1, "", ""], [1, 2, "", ""], [1, 3, "", ""]]}, "res": "Le jeu qui tourne à nouveau, en plein écran, avec des réglages modernes, et peut-être des améliorations : images plus nettes, manette, sauvegarde rapide.", "need": ["Ton exemplaire du jeu (CD, disquette ou fichiers)", "Un ordinateur avec Claude Code"], "steps": [{"h": "Cherche d'abord ce qui existe", "p": "Beaucoup de jeux ont déjà des projets communautaires qui font le gros du travail.", "pr": "Je veux refaire tourner [nom du jeu, année, plateforme] sur mon PC actuel. Cherche les solutions existantes : réédition, émulateur, projet communautaire de portage ou de décompilation. Classe-les de la plus simple à la plus complexe."}, {"h": "Relance-le", "p": "Souvent, un émulateur ou un correctif suffit. Claude installe et règle la résolution, les commandes et le son."}, {"h": "Comprends comment il marche", "p": "Claude ouvre les fichiers et t'explique leur organisation.", "pr": "Ce dossier contient les fichiers du jeu. Analyse leur structure : où sont les images, les sons, les niveaux, les textes. Explique-moi ce qu'on peut modifier facilement."}, {"h": "Améliore-le", "p": "Images agrandies proprement, manette moderne, traduction : une amélioration à la fois, et une sauvegarde avant chaque modification."}, {"h": "Adapte-le à une autre plateforme", "p": "Le portage complet est un gros chantier. Claude s'appuie de préférence sur les projets communautaires existants plutôt que de tout refaire."}], "trouble": [["Le jeu plante au lancement", "Les vieux jeux supportent mal les processeurs rapides et les écrans larges. Claude connaît les correctifs courants."]], "more": ["Créer de nouveaux niveaux pour un jeu que tu adorais.", "Faire découvrir tes jeux d'enfance à tes enfants."], "warn": "Garde tout ça pour ton exemplaire et ton usage personnel. Ne télécharge pas de copies piratées et ne redistribue pas le jeu modifié.", "kw": "jeu rétro vieux émulateur décompiler portage moderniser nostalgie"}, {"id": "jeu-anniversaire", "src": "v", "ico": "gift", "t": "Offrir un jeu vidéo personnalisé", "pitch": "Pour un anniversaire ou un départ, un petit jeu où le héros a les manies, les blagues et les passions de la personne. Fait en une soirée, envoyé par un lien.", "story": "Un jeu sur mesure, fabriqué en une soirée, à offrir pour un anniversaire.", "lvl": 1, "diff": "Facile", "time": "1 h", "cost": "Gratuit", "pre": [], "sk": {"n": [["user", "Ses passions,\nses manies", 0, 0], ["claude", "Claude\ncode le jeu", 1.5, 0], ["gamepad", "Son jeu", 3, 0], ["gift", "Envoyé\npar un lien", 3, 1, "hi"]], "e": [[0, 1, "", ""], [1, 2, "", ""], [2, 3, "", ""]]}, "res": "Un vrai petit jeu jouable sur téléphone et ordinateur, avec un héros qui lui ressemble, ses références, et ton message à la fin. Un cadeau dont on se souvient.", "need": ["Cinq détails sur la personne", "Claude"], "steps": [{"h": "Rassemble les ingrédients", "p": "Ses passions, ses expressions, un souvenir commun, ce qu'elle déteste, son plat préféré. Ce sont eux qui font rire."}, {"h": "Commande le jeu", "p": "Claude le construit et l'affiche à côté de la conversation, prêt à jouer.", "pr": "Crée un petit jeu jouable au clavier et au doigt pour [prénom], à l'occasion de [occasion]. Le héros lui ressemble : [détails]. Il doit attraper [ce qu'il aime] et éviter [ce qu'il déteste]. Trois niveaux de plus en plus durs, une musique entraînante, et à la fin le message : « [ton message] »."}, {"h": "Teste et peaufine", "p": "Joue toi-même. Trop dur ? Trop facile ? Ajoute une blague à chaque fin de niveau, ou un boss final qui représente son plus grand défi du moment."}, {"h": "Offre-le", "p": "Envoie le lien le jour J, ou affiche le jeu sur la télé pendant la fête."}], "trouble": [["Le jeu rame sur téléphone", "Demande une version allégée pour mobile."]], "more": ["Un jeu de piste pour une chasse au trésor d'anniversaire.", "Un quiz sur la famille pour une réunion."], "warn": "Évite les moqueries qui pourraient blesser : un jeu offert doit faire rire tout le monde, à commencer par la personne.", "kw": "jeu cadeau anniversaire personnalisé surprise fête"}, {"id": "idee-steam", "src": "v", "ico": "map", "t": "Trouver l'idée que personne n'a eue", "pitch": "Claude place des milliers de produits existants sur une carte, selon leur ressemblance. Les zones vides de la carte, ce sont les idées qui manquent.", "story": "Un créateur cartographie environ 150 000 jeux de la plateforme Steam et demande à Claude où sont les trous. Il en sort l'idée d'un jeu coopératif autour d'une usine.", "lvl": 3, "diff": "Avancé", "time": "Une soirée", "cost": "Gratuit", "pre": ["s-code"], "sk": {"n": [["sheet", "150 000\ndescriptions", 0, 0], ["term", "Claude Code\nles compare", 1.5, 0], ["map", "Carte des\nressemblances", 3, 0], ["bulb", "La zone vide :\nton idée", 3, 1, "hi"]], "e": [[0, 1, "", ""], [1, 2, "", ""], [2, 3, "", ""]]}, "res": "Une carte interactive où chaque point est un produit, regroupé avec ses semblables, et une liste des zones peu occupées avec des idées concrètes pour chacune.", "need": ["Une grande liste de produits ou de services avec leur description", "Claude Code"], "steps": [{"h": "Trouve les données", "p": "Des listes publiques existent pour beaucoup de domaines : jeux, applis, commerces, produits.", "pr": "Je veux cartographier [les jeux Steam, les applis d'un domaine, les commerces de ma région]. Trouve une source de données publique avec le nom et la description de chaque élément, télécharge-la et nettoie-la."}, {"h": "Fais construire la carte", "p": "Claude transforme chaque description en coordonnées de sens, puis dessine la carte.", "pr": "Transforme chaque description en représentation numérique de son sens, puis projette tout sur une carte en deux dimensions où les éléments proches se ressemblent. Regroupe les familles et donne-leur un nom. Affiche une carte interactive : au survol d'un point, son nom."}, {"h": "Cherche les trous", "p": "Les zones vides entre deux familles populaires sont les plus intéressantes.", "pr": "Repère les zones de la carte peu peuplées entre des familles très populaires. Pour chacune, explique ce qui manque et propose trois idées concrètes de produit."}, {"h": "Vérifie à la main", "p": "Une zone est parfois vide pour une bonne raison : personne n'en veut. Fais chercher par Claude si des produits similaires ont existé et pourquoi ils ont échoué."}], "trouble": [["La carte est illisible", "Demande moins de points (un échantillon) ou des couleurs par famille."]], "more": ["Cartographier les services des commerces de ton métier dans ta région, pour trouver ce que personne ne propose.", "Cartographier les avis clients d'un secteur pour voir les plaintes que personne ne règle."], "warn": "Respecte les conditions d'utilisation des sites dont tu récupères les données.", "kw": "idée innovation marché carte steam créneau concurrence embeddings"}, {"id": "photo-nuit", "src": "v", "ico": "camera", "t": "Laisser Claude photographier toute la nuit", "pitch": "Un appareil photo ou une webcam pilotés par un programme prennent des centaines de photos pendant la nuit. Au matin, Claude a trié, choisi les meilleures et monté un accéléré.", "story": "La photographie automatique de nuit : un appareil qui travaille seul pendant des heures, et une sélection prête au réveil.", "lvl": 3, "diff": "Moyen", "time": "1 h de réglage", "cost": "Gratuit si tu as le matériel", "pre": ["s-code"], "sk": {"n": [["camera", "Appareil photo\nou webcam", 0, 0], ["moon", "Toute la nuit", 1.5, 0], ["photo", "800 photos", 3, 0], ["claude", "Les meilleures\n+ un accéléré", 3, 1, "hi"]], "e": [[0, 1, "", ""], [1, 2, "", ""], [2, 3, "tri", ""]]}, "res": "Une vidéo accélérée du ciel étoilé, d'un chantier ou de ton jardin, et une sélection des plus belles images, sans avoir passé la nuit debout. En mode piège photo, tu découvres quels animaux traversent le jardin.", "need": ["Un appareil photo pilotable par USB, ou une webcam", "Un ordinateur ou un Raspberry Pi qui reste allumé", "Un trépied et une alimentation secteur", "Claude Code"], "steps": [{"h": "Choisis ton sujet", "p": "Le ciel étoilé, les animaux du jardin, une fleur qui s'ouvre, un chantier. Le sujet décide du rythme : une photo toutes les 20 secondes pour les étoiles, une photo à chaque mouvement pour les animaux."}, {"h": "Fais piloter l'appareil", "p": "Beaucoup d'appareils photo se pilotent avec l'outil libre gphoto2. Sinon, une webcam fait l'affaire.", "pr": "Mon appareil photo [modèle] est branché en USB. Vérifie qu'il peut être piloté par l'ordinateur. Écris un programme qui prend une photo toutes les [20] secondes de [22 h] à [6 h], range les images dans un dossier daté, et me prévient s'il s'arrête."}, {"h": "Fais un essai de dix minutes", "p": "Vérifie la mise au point, l'exposition, et que l'alimentation tient."}, {"h": "Laisse tourner la nuit", "p": "Désactive la mise en veille de l'ordinateur et protège l'appareil de l'humidité."}, {"h": "Au réveil, trie", "p": "Claude fait le tri, puis le montage avec l'outil libre ffmpeg.", "pr": "Voici les photos de la nuit. Écarte les floues et les vides, sélectionne les dix plus belles en expliquant pourquoi, et monte une vidéo accélérée de 30 secondes avec toutes les bonnes images."}], "trouble": [["Les photos sont toutes noires", "Allonge le temps de pose ou monte la sensibilité : Claude peut régler l'appareil pour toi."], ["L'appareil s'arrête au milieu de la nuit", "C'est la batterie ou la carte mémoire. Passe sur secteur et enregistre directement sur l'ordinateur."]], "more": ["Un piège photo pour savoir qui vient manger dans le jardin.", "Suivre des travaux jour après jour, toujours sous le même angle."], "warn": "Si l'appareil filme la rue ou chez les voisins, tu enregistres des personnes : cadre uniquement chez toi.", "kw": "photo nuit timelapse accéléré appareil photo webcam astrophotographie piège photo"}, {"id": "rencontre", "src": "v", "ico": "heart", "t": "Trier les profils d'une appli de rencontre", "pitch": "Claude t'aide à préciser ce que tu cherches, à repérer les profils compatibles à partir de captures d'écran, et à écrire des premiers messages qui ne sonnent pas copiés-collés.", "story": "Un utilisateur relie Claude à son téléphone Android et à son appli de rencontre pour automatiser le tri des profils, puis relit lui-même les correspondances retenues.", "lvl": 1, "diff": "Facile", "time": "20 min", "cost": "Gratuit", "pre": [], "sk": {"n": [["phone", "Captures\nde profils", 0, 0], ["claude", "Tes critères\nappliqués", 1.5, 0], ["heart", "Profils\ncompatibles", 3, 0, "hi"], ["pen", "Premier message\nsur mesure", 3, 1]], "e": [[0, 1, "", ""], [1, 2, "", ""], [2, 3, "", ""]]}, "res": "Moins de temps à faire défiler, des profils qui correspondent vraiment à ce que tu cherches, et des premiers messages qui partent d'un vrai détail du profil.", "need": ["Ton appli de rencontre", "Claude sur ton téléphone"], "steps": [{"h": "Clarifie ce que tu cherches", "p": "Une question à la fois, pour aller au fond.", "pr": "Aide-moi à définir ce que je cherche sur une appli de rencontre. Pose-moi une question à la fois sur mes priorités, ce qui est rédhibitoire et ce qui est un bonus. À la fin, résume mes critères en dix lignes."}, {"h": "Envoie des captures", "p": "Fais des captures d'écran de quelques profils et envoie-les. Claude les compare à tes critères.", "pr": "Voici des captures de profils. Pour chacun, dis-moi en deux lignes ce qui correspond à mes critères, ce qui ne correspond pas, et un détail du profil qui pourrait lancer la conversation."}, {"h": "Écris un premier message", "p": "Pars d'un vrai détail du profil, c'est ce qui fait la différence.", "pr": "Écris trois premiers messages différents pour ce profil, à partir de ce détail : [détail]. Ton : humour léger et sincère, aucune phrase toute faite, deux lignes maximum."}, {"h": "Garde la main", "p": "Tu choisis, tu likes et tu envoies toi-même. C'est ton nom et ta voix."}], "trouble": [["Les messages sonnent faux", "Donne à Claude trois messages que tu as écrits toi-même et qui ont marché : il prendra ton ton."]], "more": ["Retravailler ta propre description et choisir tes photos avec Claude."], "warn": "Automatiser les likes ou les messages enfreint les règles de la plupart des applis de rencontre et peut faire bannir ton compte. Les captures contiennent des données personnelles d'autres personnes : ne les garde pas plus que nécessaire.", "kw": "rencontre profil message appli dating tri"}, {"id": "photo-doc", "src": "p", "ico": "receipt", "t": "Faire lire une photo, un scan ou une facture", "pitch": "Une facture, un courrier manuscrit, une étiquette, une capture d'écran : tu prends la photo, Claude lit et en tire ce que tu demandes.", "lvl": 1, "diff": "Facile", "time": "2 min", "cost": "Gratuit", "pre": [], "sk": {"n": [["phone", "Une photo", 0, 0], ["claude", "Claude lit", 1.5, 0], ["sheet", "Tableau, résumé,\ncalculs vérifiés", 3, 0, "hi"]], "e": [[0, 1, "", ""], [1, 2, "", ""]]}, "res": "Les informations du document, propres et rangées : un tableau, un résumé, une réponse rédigée, un total vérifié.", "need": ["Claude sur téléphone ou ordinateur"], "steps": [{"h": "Prends une bonne photo", "p": "Document à plat, bien éclairé, sans reflet, cadré en entier. Une photo nette vaut mieux que trois floues."}, {"h": "Joins-la", "p": "Sur téléphone, touche le bouton + puis l'appareil photo. Sur ordinateur, glisse le fichier dans la conversation."}, {"h": "Dis ce que tu veux en tirer", "p": "Exemple avec une facture fournisseur :", "pr": "Voici la photo d'une facture. Sors-moi dans un tableau : fournisseur, date, numéro, chaque ligne avec quantité et prix unitaire, total hors taxes, TVA, total TTC. Vérifie les calculs et signale toute erreur."}, {"h": "Récupère le résultat", "p": "Copie le tableau, ou demande-le en fichier Excel pour ta comptabilité."}], "trouble": [["Claude lit mal un chiffre", "Reprends la photo de plus près, ou corrige-le dans la conversation."]], "more": ["Photographier l'étiquette d'un produit pour retrouver sa référence chez un fournisseur.", "Envoyer la capture d'un message d'erreur pour savoir quoi faire.", "Transformer une pile de tickets en note de frais."], "warn": "Masque les numéros de carte ou de compte bancaire avant d'envoyer une photo.", "kw": "photo scan facture ticket lire document manuscrit étiquette ocr"}, {"id": "chiffres", "src": "p", "ico": "chart", "t": "Faire parler tes chiffres", "pitch": "Tu déposes un export de caisse, un relevé ou un tableau. Claude calcule, compare et dessine les graphiques, avec un vrai programme, pas de tête.", "lvl": 1, "diff": "Facile", "time": "15 min", "cost": "Gratuit", "pre": [], "sk": {"n": [["sheet", "Export Excel\nou CSV", 0, 0], ["claude", "Calculs\net graphiques", 1.5, 0], ["chart", "Ce qui marche,\nce qui coince", 3, 0, "hi"]], "e": [[0, 1, "", ""], [1, 2, "", ""]]}, "res": "Tes meilleurs produits, tes jours forts, tes mois creux, l'évolution sur l'année, et trois décisions concrètes à prendre.", "need": ["Un export de tes données (logiciel de caisse, banque, tableur)", "Claude"], "steps": [{"h": "Exporte tes données", "p": "Dans ton logiciel de caisse ou ta banque, cherche « Exporter » en Excel ou CSV. Une année complète donne les meilleures comparaisons."}, {"h": "Pose ta questio ièces", "p": "Facture, devis signé, contrat, échanges de mails. Le devis est souvent la clé : sauf accord de ta part, le prix ne devrait pas le dépasser."}, {"h": "Fais décortiquer la facture", "p": "Joins tous les documents, puis :", "pr": "Voici une facture de [type de prestataire] et le devis initial. Analyse chaque ligne : doublons, prestations facturées deux fois sous des noms différents, écarts avec le devis, tarifs anormaux, erreurs de calcul ou de TVA. Classe les problèmes du plus solide au plus fragile."}, {"h": "Rédige la réclamation", "p": "Garde seulement les points solides.", "pr": "Rédige une lettre de réclamation pour contester ces points : [points retenus]. Ton ferme et courtois, références précises aux lignes, montant contesté, demande de facture rectifiée sous 15 jours. Prépare aussi la version à envoyer en recommandé avec accusé de réception."}, {"h": "Prévois la suite", "p": "Sans réponse, beaucoup de secteurs ont un médiateur gratuit : énergie, communications électroniques, automobile. Claude t'indique lequel saisir et prépare le dossier."}], "trouble": [["Le professionnel refuse tout", "Demande à Claude les recours possibles dans ton cas, y compris le conciliateur de justice, gratuit lui aussi."]], "more": ["Vérifier les factures d'énergie d'un an.", "Contrôler une note de clinique avec le relevé de ta mutuelle."], "warn": "Claude n'est pas avocat. Pour un gros montant, fais valider la démarche par un professionnel ou une association de consommateurs.", "kw": "facture contester réclamation litige médiateur garage énergie opérateur erreur"}, {"id": "contrat", "src": "p", "ico": "law", "t": "Lire un contrat ou un courrier officiel", "pitch": "Bail, contrat fournisseur, courrier des impôts ou de l'URSSAF : Claude traduit en français courant, repère ce qui t'engage et te dit quoi faire, et pour quand.", "lvl": 1, "diff": "Facile", "time": "20 min", "cost": "Gratuit", "pre": [], "sk": {"n": [["doc", "Contrat ou\ncourrier", 0, 0], ["claude", "Explica fient, et la marche à suivre.", "need": ["Claude sur ton téléphone"], "steps": [{"h": "Ne clique sur rien", "p": "Pas de lien, pas de pièce jointe, et ne rappelle pas le numéro indiqué."}, {"h": "Fais une capture", "p": "Avec l'adresse ou le numéro de l'expéditeur bien visible."}, {"h": "Demande l'avis", "p": "Joins la capture, puis :", "pr": "J'ai reçu ce message. Est-ce probablement une arnaque ? Examine l'expéditeur, les liens, le ton, l'urgence et ce qu'on me demande. Donne ton avis en une phrase, puis les indices, puis ce que je dois faire."}, {"h": "Vérifie par un autre canal", "p": "En cas de doute, contacte l'organisme avec son numéro habituel, jamais celui du message. Transfère les SMS frauduleux au 33700."}], "trouble": [["J'ai déjà cliqué ou payé", "Appelle ta banque tout de suite pour faire opposition, change tes mots de passe depuis un autre appareil, et va sur cybermalveillance.gouv.fr pour être guidé."]], "more": ["Vérifier un faux client qui insiste pour payer d'une façon inhabituelle.", "Vérifier une annonce trop belle avant d'acheter."], "warn": "Aucun organisme sérieux ne demande un code reçu par SMS, un mot de passe ou un virement urgent par message.", "kw": "arnaque escroquerie phishing sms faux mail fraude hameçonnage"}, {"id": "avis", "src": "p", "ico": "star", "t": "Répondre à tes avis clients", "pitch": "Une réponse personnalisée à chaque avis, bon ou mauvais, en deux minutes au lieu de vingt.", "lvl": 1, "diff": "Facile", "time": "10 min", "cost": "Gratuit", "pre": [], "sk": {"n": [["star", "Avis Google", 0, 0], ["claude", "Réponses\npersonnalisées", 1.5, 0], ["user", "Clients\nqui reviennent", 3, 0, "hi"]], "e": [[0, 1, "", ""], [1, 2, "", ""]]}, "res": "Des réponses chaleureuses, toutes différentes, qui reprennent un détail de chaque avis et montrent que tu lis tes clients.", "need": ["Tes avis, copiés depuis ta fiche Google", "Claude"], "steps": [{"h": "Copie les avis", "p": "Depuis ta fiche d'établissement Google, copie les avis du mois age principal doit se lire à trois mètres. Propose deux mises en page différentes."}, {"h": "Retouche", "p": "« Plus gros », « moins de texte », « mets le prix en rouge ». Claude refait la mise en page."}, {"h": "Exporte et imprime", "p": "Demande la version PDF, ou, si Canva est relié dans Personnaliser puis Connecteurs, fais créer l'affiche directement dans ton compte Canva pour la retoucher toi-même."}], "trouble": [["Les couleurs sortent ternes à l'impression", "Demande une version en couleurs plus contrastées pour l'impression."]], "more": ["Décliner l'affiche en publication carrée pour les réseaux sociaux.", "Faire des étiquettes de prix assorties."], "warn": "N'utilise que des images et des logos dont tu as les droits.", "kw": "affiche flyer visuel promotion vitrine canva impression"}, {"id": "impression-3d", "src": "p", "ico": "printer3d", "t": "Dessiner une pièce pour ton imprimante 3D", "pitch": "Tu décris une pièce avec ses mesures. Claude Code écrit le modèle 3D et te donne le fichier prêt à imprimer, avec l'orientation conseillée.", "lvl": 3, "diff": "Moyen", "time": "30 min par pièce", "cost": "Le filament", "pre": ["s-code"], "sk": {"n": [["ruler", "Tes mesures", 0, 0], ["term", "Claude Code\nmodélise", 1.5, 0], ["cube3d", "Fichier STL", 3, 0], ["printer3d", "Impression", 3, 1, "hi"]], "e": [[0, 1, "", ""], [1, 2, "", ""], [2, 3, "", ""]]}, "res": "Une pièce sur mesure : support, cale, boîtier, crochet, adaptateur. Tu peux la modifier en une phrase et la réimprimer.", "need": ["Un pied à coulisse", "Une imprimante 3D et son logiciel de découpe (Bambu Studio, OrcaSlicer, PrusaSlicer ou Cura)", "Claude Code"], "steps": [{"h": "Mesure précisément", "p": "Au pied à coulisse, en millimètres. Note aussi ce que la pièce doit supporter ou tenir."}, {"h": "Décris la pièce", "p": "Claude écrit le modèle en code, ce qui permet de le modifier facilement ensuite.", "pr": "Dessine une pièce à imprimer en 3D : [description]. Dimensions : [mesures en mm]. Elle doit [fonction, contraintes de solidité]. Produis un fichier STL, montre-moi une image du résultat sous trois angles, et indique l'orientation d'impression conseillée."}, {"h": "Vérifie l'aperçu", "p": "Regarde les images. Corrige en parlant : « le trou doit faire 6 mm », « arrondis les angles », « ajoute deux trous de vis »."}, {"h": "Imprime un essai rapide", "p": "Pour une pièce qui s'emboîte, imprime d'abord une petite partie ou une version en remplissage faible : il faut souvent ajuster de quelques dixièmes de millimètre."}, {"h": "Imprime la version finale", "p": "Ouvre le STL dans ton logiciel de découpe, choisis le matériau (PLA pour l'intérieur, PETG pour la chaleur ou l'extérieur) et lance l'impression."}], "trouble": [["La pièce ne s'emboîte pas", "Demande un jeu de 0,2 à 0,3 mm sur les parties qui s'emboîtent."], ["La pièce casse", "Change l'orientation d'impression ou épaissis les parois : Claude t'explique où sont les points faibles."]], "more": ["Un boîtier sur mesure pour un montage électronique.", "Des présentoirs ou des supports pour ton atelier."], "warn": "Pas de pièces de sécurité imprimées (fixations de charge, pièces de véhicule) : le plastique imprimé n'a pas la résistance d'une pièce industrielle.", "kw": "impression 3d stl pièce imprimante bambu modèle filament openscad"}, {"id": "appli-metier", "src": "p", "ico": "apps", "t": "Créer une appli pour ton métier", "pitch": "Prise de commande, suivi des dépôts, étiquettes, tickets : Claude Code construit l'appli qui colle à ta façon de travailler, sur téléphone, tablette ou ordinateur.", "lvl": 3, "diff": "Moyen", "time": "Une journée, puis des retouches", "cost": "Gratuit", "pre": ["s-code"], "sk": {"n": [["user", "Ta façon\nde travailler", 0, 0], ["term", "Claude Code\nconstruit", 1.5, 0], ["phone", "Ton appli", 3, 0, "hi"], ["printer", "Tickets,\nétiquettes", 3, 1]], "e": [[0, 1, "", ""], [1, 2, "", ""], [2, 3, "", ""]]}, "res": "Un outil fait pour toi, que tu fais évoluer en parlant : un écran de plus, un champ de moins, une impression de ticket.", "need": ["Une description de ta journée de travail", "Claude Code", "Le matériel qui doit s'y connecter (imprimante, lecteur, tablette)"], "steps": [{"h": "Décris ta journée", "p": "Qui fait quoi, dans quel ordre, avec quelles informations. C'est la matière première de l'appli."}, {"h": "Demande une maquette d'abord", "p": "Valide les écrans avant le développement.", "pr": "Je veux une appli pour [ton activité]. Voici comment je travaille aujourd'hui : [déroulé d'une journée]. L'appli doit permettre de [fonctions voulues]. Elle tournera sur [téléphone Android, tablette, ordinateur]. Montre-moi d'abord une maquette des écrans, pose-moi tes questions, puis construis-la étape par étape."}, {"h": "Commence par une seule fonction", "p": "Une fonction qui marche parfaitement vaut mieux que dix à moitié. Teste-la avec trois cas réels."}, {"h": "Branche le matériel", "p": "Imprimante à tickets, lecteur de codes, tablette : Claude sait les faire dialoguer avec l'appli. Fais un essai avec chaque appareil."}, {"h": "Installe-la pour de bon", "p": "Demande comment l'installer sur ton appareil, et comment sauvegarder les données chaque jour."}], "trouble": [["L'appli devient compliquée", "Demande à Claude de simplifier : chaque écran doit servir à une seule chose."]], "more": ["Un suivi des clients avec rappel par SMS quand la commande est prête.", "Une fiche de prix qui calcule automatiquement selon la marque et le modèle."], "warn": "Les données de tes clients restent sous ta responsabilité : sauvegarde-les, et ne garde que ce qui est utile.", "kw": "application métier commerce android tablette tickets commandes suivi sur mesure"}, {"id": "sante", "src": "p", "ico": "heart", "t": "Suivre ta santé et ton sport", "pitch": "Pas, sommeil, poids, glycémie, séances : Claude rassemble les données de ta montre, de ta balance ou de ton capteur et te montre les tendances, avec un programme adapté.", "lvl": 1, "diff": "Facile", "time": "30 min", "cost": "Gratuit", "pre": [], "sk": {"n": [["phone", "Montre, balance,\ncapteur", 0, 0], ["claude", "Tendances", 1.5, 0], ["chart", "Ton bilan\ndu mois", 3, 0, "hi"], ["heart", "Programme\nadapté", 3, 1]], "e": [[0, 1, "export", ""], [1, 2, "", ""], [2, 3, "", ""]]}, "res": "Un bilan clair de tes tendances sur plusieurs semaines, les liens entre sommeil, activité et forme, et un programme d'entraînement qui tient compte de ton matériel.", "need": ["Les données exportées de ton appli santé, de ta montre ou de ton capteur", "Claude"], "steps": [{"h": "Exporte tes données", "p": "L'appli Santé de l'iPhone, Google Fit, l'appli de ta montre ou de ton capteur de glycémie proposent un export. Demande à Claude où le trouver pour ton appareil."}, {"h": "Demande un bilan", "p": "Joins le fichier exporté.", "pr": "Voici mes données de [santé ou sport] des [trois] derniers mois. Montre les tendances en graphiques : [sommeil, pas, poids, glycémie]. Cherche des liens entre elles, par exemple entre sommeil et activité. Dis-moi ce qui s'améliore et ce qui se dégrade, sans jargon."}, {"h": "Fais-toi un programme", "p": "Donne ton matériel et tes contraintes.", "pr": "Fais-moi un programme d'entraînement de [8] semaines avec ce matériel : [matériel]. [3] séances par semaine de [45] minutes, objectif [objectif]. Progression semaine par semaine."}, {"h": "Fais le point chaque mois", "p": "Une tâche planifiée peut te préparer le bilan chaque mois, à partir du nouvel export."}], "trouble": [["Le fichier exporté est énorme", "Demande à Claude de ne garder que les colonnes utiles."]], "more": ["Préparer une synthèse pour ton médecin avant une consultation."], "warn": "Claude n'est pas médecin. Pour une maladie comme le diabète, les réglages de traitement se décident avec ton équipe soignante.", "kw": "santé sport montre glycémie sommeil poids entraînement programme fitness"}, {"id": "memoire", "src": "p", "ico": "book", "t": "Que Claude se souvienne de toi", "pitch": "Projets, mémoire et compétences : trois façons de ne plus tout réexpliquer à chaque conversation.", "lvl": 1, "diff": "Facile", "time": "15 min", "cost": "Gratuit", "pre": [], "sk": {"n": [["folder", "Projets :\ntes documents", 0, 0], ["user", "Mémoire :\nqui tu es", 1.5, 0], ["gear", "Compétences :\ntes méthodes", 3, 0], ["claude", "Claude te\nconnaît déjà", 1.5, 1, "hi"]], "e": [[0, 3, "", ""], [1, 3, "", ""], [2, 3, "", ""]]}, "res": "Des réponses qui tiennent compte de ton métier, de tes documents et de ta façon de faire, dès la première phrase.", "need": ["Claude"], "steps": [{"h": "Crée un projet par sujet", "p": "Dans le menu, Projets, puis Nouveau projet. Ajoute tes documents (tarifs, modèles, présentation de l'activité) et écris les instructions : rôle, ton, règles. Chaque conversation du projet les connaît.", "pr": "Tu m'aides à gérer [ton activité]. Tu réponds en français, de façon courte et directe. Tu t'appuies d'abord sur les documents du projet. Quand une information manque, tu poses la question au lieu de deviner."}, {"h": "Règle la mémoire", "p": "Dans les Paramètres, active la mémoire à partir des discussions. Tu peux dire « retiens que… », « oublie que… », ou demander « que sais-tu de moi ? »."}, {"h": "Enregistre tes méthodes en compétences", "p": "Fais un travail une fois avec Claude jusqu'au bon résultat, puis demande-lui d'en faire une compétence. La fois suivante, une phrase suffit.", "pr": "Le résultat qu'on vient d'obtenir me convient. Transforme cette méthode en compétence réutilisable : structure, ton, mentions obligatoires, mise en page. La prochaine fois, je veux juste te donner [les informations qui changent]."}, {"h": "Retrouve et gère tout", "p": "Les compétences se trouvent dans Personnaliser, puis Compétences. Les projets, dans le menu Projets."}], "trouble": [["Claude a retenu une information fausse", "Dis-le simplement : « oublie ceci, retiens plutôt cela »."]], "more": ["Un projet par client important, avec ses documents.", "Une compéten
