<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><style>:root{color-scheme:light}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head><body>
<title>Claude en main</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
@font-face{font-family:"Bricolage Grotesque";src:url("fonts/bricolage.woff2") format("woff2"),url("fonts/bricolage.ttf") format("truetype");font-weight:200 800;font-display:swap}
@font-face{font-family:"Instrument Sans";src:url("fonts/instrument.woff2") format("woff2"),url("fonts/instrument.ttf") format("truetype");font-weight:400 700;font-display:swap}
</style>
<style>
/* Layout : appli à quatre onglets (Accueil, Outils, Formation, Atelier).
   Barre d'onglets fixée en bas sur téléphone, rail à gauche sur grand écran.
   Rouge et acier d'un couteau suisse ; listes groupées, fiches à lire, atelier en deux colonnes. */
:root{
  --bg:#EEF0F3; --surface:#FFFFFF; --sunken:#E3E6EB; --ink:#14181F; --muted:#586172; --line:#D5DAE1;
  --accent:#D4212B; --accent-ink:#B8141E; --on-accent:#FFFFFF; --accent-soft:#FBE7E8;
  --steel:#BCC3CD; --steel-hi:#E2E6EB; --steel-lo:#8A94A2;
  --ok:#1B7F52; --on-ok:#FFFFFF; --ok-soft:#DFF3E9; --warn:#8F5508; --warn-soft:#FBF0DC;
  --display:"Bricolage Grotesque","Inter Display","Inter",system-ui,sans-serif;
  --body:"Instrument Sans","Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#12171E; --surface:#1B222C; --sunken:#0C1016; --ink:#EEF1F5; --muted:#A0AAB9; --line:#2D3643;
  --accent:#D62B35; --accent-ink:#FF8A90; --on-accent:#FFFFFF; --accent-soft:#3A1C21;
  --steel:#77828F; --steel-hi:#A6B0BD; --steel-lo:#4F5967;
  --ok:#5BD19A; --on-ok:#0C1016; --ok-soft:#163526; --warn:#F0B55C; --warn-soft:#3A2B10; color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#12171E; --surface:#1B222C; --sunken:#0C1016; --ink:#EEF1F5; --muted:#A0AAB9; --line:#2D3643;
  --accent:#D62B35; --accent-ink:#FF8A90; --on-accent:#FFFFFF; --accent-soft:#3A1C21;
  --steel:#77828F; --steel-hi:#A6B0BD; --steel-lo:#4F5967;
  --ok:#5BD19A; --on-ok:#0C1016; --ok-soft:#163526; --warn:#F0B55C; --warn-soft:#3A2B10; color-scheme:dark }

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--display);margin:0;line-height:1.1;text-wrap:balance;letter-spacing:-.015em}
h1{font-size:clamp(1.9rem,6vw,2.7rem);font-weight:800}
h2{font-size:1.3rem;font-weight:700}
p{margin:0}
a{color:inherit}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent-ink);outline-offset:2px}
.ic{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.ic.on{fill:currentColor}
.ic.sm{width:18px;height:18px}

/* ossature */
main{max-width:880px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px 108px;display:flex;flex-direction:column;gap:28px;outline:none}
main > *{animation:rise .26s ease}
@keyframes rise{from{transform:translateY(8px)}}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;background:var(--surface);border-top:1px solid var(--line);padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
.brand{display:none}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 4px;border-radius:12px;color:var(--muted);font-size:.72rem;font-weight:600;text-decoration:none}
.tab[aria-current="page"]{color:var(--accent-ink)}
@media (min-width:960px){
  .shell{display:grid;grid-template-columns:232px minmax(0,1fr)}
  .nav{position:sticky;top:0;bottom:auto;align-self:start;height:100vh;flex-direction:column;gap:4px;border-top:0;border-right:1px solid var(--line);padding:24px 14px}
  .brand{display:flex;align-items:center;gap:10px;font-family:var(--display);font-weight:800;font-size:1.15rem;text-decoration:none;padding:4px 10px 22px}
  .tab{flex:none;flex-direction:row;gap:12px;padding:11px 12px;font-size:.96rem}
  .tab[aria-current="page"]{background:var(--accent-soft)}
  main{padding-block:40px 72px}
}
.stack{display:flex;flex-direction:column;gap:12px;min-width:0}
.sec-h{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.sec-h a{font-size:.9rem;font-weight:600;color:var(--accent-ink);text-decoration:none;white-space:nowrap}
.lede{color:var(--muted);font-size:1.05rem;max-width:58ch}
.label{font-size:.76rem;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.hint{color:var(--muted);font-size:.9rem}

/* accueil */
.hero{display:flex;flex-wrap:wrap;align-items:center;gap:6px 32px}
.hero-txt{flex:1 1 340px;min-width:0;display:flex;flex-direction:column;gap:14px}
.brandline{display:flex;align-items:center;gap:8px;font-family:var(--display);font-weight:800;font-size:1.05rem;margin-bottom:-14px}
.knife{flex:0 1 270px;width:100%;max-width:210px;order:-1}
@media (min-width:720px){.knife{order:0;max-width:270px}}
@media (min-width:960px){.brandline{display:none}}
.knife .bl{fill:var(--steel);stroke:var(--steel-lo);stroke-width:1.5;stroke-linejoin:round;transform:rotate(var(--a));animation:fan 1s cubic-bezier(.2,.8,.2,1) backwards;animation-delay:var(--d)}
.knife .hd{fill:var(--accent)}
.knife .rv{fill:var(--steel-hi);stroke:var(--steel-lo);stroke-width:1.5}
.knife .rg{fill:none;stroke:var(--steel-lo);stroke-width:3}
@keyframes fan{from{transform:rotate(6deg)}}
.search{display:flex;align-items:center;gap:10px;background:var(--surface);border:1.5px solid var(--line);border-radius:16px;padding:0 16px;height:56px;color:var(--muted)}
.search:focus-within{border-color:var(--accent)}
.search input{flex:1;min-width:0;border:0;background:transparent;outline:0;height:100%;color:var(--ink);font-size:1.02rem}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.scroller{overflow-x:auto;scrollbar-width:none}
.scroller .chips{flex-wrap:nowrap;width:max-content}
@media (min-width:720px){.scroller .chips{flex-wrap:wrap;width:auto}}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 14px;font-size:.9rem;font-weight:500;white-space:nowrap;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
.chip[aria-pressed="true"],.chip[aria-current="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.resume{display:flex;flex-wrap:wrap;align-items:center;gap:14px 16px;background:var(--ink);color:var(--bg);border-radius:22px;padding:18px 20px}
.resume .rt{flex:1 1 200px;min-width:0;display:flex;flex-direction:column;gap:3px}
.resume .label{color:inherit;opacity:.7}
.resume h2{font-size:1.15rem;letter-spacing:0;line-height:1.25}
.ring{width:54px;height:54px;flex:none}
.ring circle{fill:none;stroke-width:6}
.ring .tr{stroke:currentColor;opacity:.22}
.ring .pr{stroke:var(--accent);stroke-linecap:round;transform:rotate(-90deg);transform-origin:50% 50%}
.ring text{fill:currentColor;font-family:var(--body);font-size:13px;font-weight:700;text-anchor:middle}
.cats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (min-width:620px){.cats{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (min-width:1180px){.cats{grid-template-columns:repeat(4,minmax(0,1fr))}}
.cat{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:5px;text-decoration:none;min-width:0;transition:transform .15s,border-color .15s}
.cat:hover{border-color:var(--accent);transform:translateY(-2px)}
.cat .row-ic{background:var(--accent-soft);color:var(--accent-ink);margin-bottom:6px}
.cat b{font-family:var(--display);font-size:1.03rem;font-weight:700;line-height:1.2}
.cat span{color:var(--muted);font-size:.85rem;line-height:1.35}
.cat em{font-style:normal;font-size:.78rem;font-weight:700;color:var(--muted);margin-top:auto;padding-top:8px}
.cat.all{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.cat.all .row-ic{background:var(--on-accent);color:var(--accent)}
.cat.all span,.cat.all em{color:inherit;opacity:.85}
.about{color:var(--muted);font-size:.85rem;max-width:70ch}

/* listes */
.list{background:var(--surface);border:1px solid var(--line);border-radius:18px;overflow:hidden}
.row{display:flex;align-items:center;gap:14px;padding:13px 16px;text-decoration:none;border-top:1px solid var(--line);min-width:0}
.row:first-child{border-top:0}
.row:hover{background:var(--bg)}
.row-ic{width:40px;height:40px;border-radius:12px;background:var(--sunken);display:grid;place-items:center;flex:none}
.row-tx{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.row-tx b{font-weight:600;line-height:1.3}
.row-sub{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:.85rem}
.row-meta{display:flex;align-items:center;gap:6px;color:var(--steel-lo);flex:none}
.row-meta .fav{color:var(--warn)}
.tick{width:24px;height:24px;border-radius:50%;background:var(--ok);color:var(--on-ok);display:grid;place-items:center}
.tick .ic{width:15px;height:15px;stroke-width:2.6}
.bars{display:inline-flex;align-items:flex-end;gap:2px;height:14px;flex:none}
.bars i{width:4px;border-radius:1px;background:var(--steel)}
.bars i:nth-child(1){height:6px}.bars i:nth-child(2){height:10px}.bars i:nth-child(3){height:14px}
.b1 i:nth-child(-n+1),.b2 i:nth-child(-n+2),.b3 i:nth-child(-n+3){background:var(--accent)}
.group h2{display:flex;align-items:center;gap:10px;font-size:1.12rem}
.empty{color:var(--muted);padding:28px 0;text-align:center}

/* boutons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 18px;border-radius:14px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-weight:600;text-decoration:none;white-space:nowrap}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.ok{background:var(--ok);border-color:var(--ok);color:var(--on-ok)}
.btn:active{transform:scale(.98)}
.back{display:inline-flex;align-items:center;gap:6px;color:var(--muted);text-decoration:none;font-weight:600;font-size:.92rem;align-self:flex-start}

/* fiche outil */
.th{display:flex;flex-direction:column;gap:12px}
.badges{display:flex;flex-wrap:wrap;gap:8px}
.badge{display:inline-flex;align-items:center;gap:7px;padding:5px 11px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-size:.82rem;font-weight:600}
.badge.ok{background:var(--ok-soft);border-color:transparent;color:var(--ok)}
details.need{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:0 16px}
details.need summary{cursor:pointer;font-weight:600;padding:13px 0;list-style:none;display:flex;justify-content:space-between;align-items:center;gap:10px}
details.need summary::-webkit-details-marker{display:none}
details.need[open] summary .ic{transform:rotate(90deg)}
details.need p{padding:0 0 14px;color:var(--muted)}
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.step{width:100%;display:flex;gap:12px;align-items:flex-start;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:13px 14px;line-height:1.45}
.step .box{width:26px;height:26px;border-radius:8px;border:1.5px solid var(--steel-lo);display:grid;place-items:center;flex:none;font-size:.82rem;font-weight:700;color:var(--muted)}
.step .box .ic{width:16px;height:16px;stroke-width:2.6}
.step[aria-pressed="true"]{border-color:transparent;background:var(--ok-soft)}
.step[aria-pressed="true"] .box{background:var(--ok);border-color:var(--ok);color:var(--on-ok)}
.consigne,.quiz,.ap{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:18px;display:flex;flex-direction:column;gap:14px;min-width:0}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field input,.field textarea{width:100%;border:1.5px solid var(--line);border-radius:12px;background:var(--bg);padding:11px 12px;min-height:46px;resize:vertical}
.field input:focus,.field textarea:focus{outline:0;border-color:var(--accent)}
.preview{background:var(--bg);border-radius:14px;padding:16px;font-size:1.02rem;line-height:1.6;white-space:pre-wrap;overflow-wrap:anywhere}
.preview mark{background:var(--accent-soft);color:var(--accent-ink);border-radius:5px;padding:1px 4px;font-weight:600}
.preview .ph{border-bottom:2px dashed var(--steel-lo);color:var(--muted)}
.preview.void{color:var(--muted)}
.actions{display:flex;flex-wrap:wrap;gap:10px}
.note{background:var(--warn-soft);border-radius:14px;padding:14px 16px}
.note b{color:var(--warn)}

/* formation */
.prog{display:flex;align-items:center;gap:12px}
.pbar{flex:1;height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.pbar i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .4s}
.prog span{font-size:.88rem;font-weight:600;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.mod-h{display:flex;gap:12px;align-items:flex-start}
.mod-n{font-family:var(--display);font-weight:800;font-size:1.7rem;line-height:1;color:var(--accent-ink);width:26px;flex:none;font-variant-numeric:tabular-nums}
.mod-t{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.mod-t p{color:var(--muted);font-size:.92rem}
.mod-c{font-size:.85rem;font-weight:600;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.ldot{width:28px;height:28px;border-radius:50%;border:1.5px solid var(--steel-lo);display:grid;place-items:center;font-size:.8rem;font-weight:700;color:var(--muted);flex:none}
.ldot.done{background:var(--ok);border-color:var(--ok);color:var(--on-ok)}
.ldot .ic{width:15px;height:15px;stroke-width:2.6}
.prose{display:flex;flex-direction:column;gap:14px;max-width:62ch;font-size:1.06rem;line-height:1.65}
.prose ul{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:8px}
.ba{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.ba > div{border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:8px;min-width:0}
.ba-b{background:var(--sunken);color:var(--muted)}
.ba-a{background:var(--ok-soft)}
.ba-a .label{color:var(--ok)}
.todo{background:var(--accent-soft);border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:10px;align-items:flex-start}
.todo .label{color:var(--accent-ink)}
.quiz h2{font-size:1.15rem;line-height:1.3;letter-spacing:0}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{text-align:left;padding:13px 14px;border-radius:14px;border:1.5px solid var(--line);background:var(--bg);line-height:1.4}
.opt.good{border-color:var(--ok);background:var(--ok-soft);font-weight:600}
.opt.bad{opacity:.5;text-decoration:line-through}
.fb b{color:var(--ok)}
.fb.no b{color:var(--warn)}
.pager{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}

/* atelier */
.atelier{display:grid;grid-template-columns:minmax(0,1fr);gap:20px}
@media (min-width:1180px){.atelier{grid-template-columns:minmax(0,1fr) minmax(0,1fr);align-items:start}.ap{position:sticky;top:24px}}
.af{display:flex;flex-direction:column;gap:14px;min-width:0}
.meter-top{display:flex;justify-content:space-between;gap:10px;font-weight:700}
.segs{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;margin-top:8px}
.segs i{height:8px;border-radius:99px;background:var(--line)}
.segs i.on{background:var(--accent)}
.checks{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:.85rem;color:var(--muted);margin-top:8px}
.checks .on{color:var(--ok);font-weight:600}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-weight:600;font-size:.92rem;z-index:40;max-width:calc(100% - 32px);text-align:center}
@media (min-width:960px){.toast{bottom:28px}}
@media (prefers-reduced-motion: reduce){ *,*::before,*::after{animation:none!important;transition:none!important} }
</style>
<script>try{if(window.Android&&Android.isNight)document.documentElement.setAttribute("data-theme",Android.isNight()?"dark":"light")}catch(e){}</script>

<script>
const DATA = {"levels": [{"id": 1, "name": "Sans installation", "short": "Navigateur ou téléphone", "setup": "Ouvre claude.ai dans ton navigateur ou l'appli Claude sur ton téléphone. Un compte gratuit suffit pour la plupart de ces outils. Tu écris ta demande, tu joins tes fichiers avec le bouton +, et tu lis la réponse."}, {"id": 2, "name": "Sur ordinateur", "short": "Appli bureau ou extension Chrome", "setup": "Ces outils demandent ton ordinateur. L'appli bureau (claude.ai/download, Mac ou Windows) laisse Claude accéder à tes dossiers et à tes logiciels. L'extension Chrome lui permet de naviguer à ta place. Un abonnement payant est nécessaire."}, {"id": 3, "name": "Claude Code", "short": "Claude construit pour toi", "setup": "Dans l'appli bureau, ouvre l'onglet Code (abonnement payant). Crée une session, choisis un dossier vide, puis décris ce que tu veux en français courant. Claude écrit le programme, le lance et corrige ses erreurs. Il demande ton accord avant chaque action sensible."}], "cats": [{"id": "bases", "name": "Les bases", "icon": "play", "blurb": "Régler Claude une fois pour toutes"}, {"id": "ecrire", "name": "Écrire", "icon": "mail", "blurb": "Mails, messages, publications"}, {"id": "documents", "name": "Documents", "icon": "file", "blurb": "Lire, résumer, produire des fichiers"}, {"id": "chiffres", "name": "Chiffres", "icon": "chart", "blurb": "Analyser, comparer, suivre"}, {"id": "savoir", "name": "Chercher et apprendre", "icon": "cap", "blurb": "Enquêter, vérifier, se former"}, {"id": "creer", "name": "Créer", "icon": "spark", "blurb": "Sites, visuels, 3D"}, {"id": "automatiser", "name": "Automatiser", "icon": "bolt", "blurb": "Faire travailler Claude sans toi"}, {"id": "entreprise", "name": "Entreprise", "icon": "case", "blurb": "Négocier, décider, s'équiper"}, {"id": "maison", "name": "Maison et bricolage", "icon": "home", "blurb": "Réseau, domotique, objets"}, {"id": "securite", "name": "Sécurité", "icon": "shield", "blurb": "Arnaques et appareils sous contrôle"}, {"id": "quotidien", "name": "Vie quotidienne", "icon": "sun", "blurb": "Voyage, cuisine, famille, santé"}], "tools": [{"id": 32, "cat": "bases", "lvl": 1, "t": "Créer un projet pour ne plus te répéter", "pitch": "Un projet est un classeur où Claude garde tes documents et tes consignes. Chaque nouvelle conversation démarre en connaissant déjà le contexte.", "steps": ["Dans le menu de gauche, clique sur Projets, puis sur Nouveau projet en haut à droite.", "Donne un nom et une description.", "Dans la zone de connaissances à droite, clique sur + et ajoute tes fichiers : tarifs, modèles de courrier, présentation de l'activité.", "Clique sur Définir les instructions du projet, colle le texte ci-dessous et enregistre."], "prompt": "Tu m'aides à gérer [ton activité]. Tu réponds en français, de façon courte et directe. Tu t'appuies d'abord sur les documents du projet. Quand une information manque, tu poses la question au lieu de deviner.", "note": "Disponible sur tous les forfaits. Le compte gratuit est limité à cinq projets.", "open": false, "where": "Ce texte se colle dans les instructions du projet, pas dans une conversation.", "kw": "classeur dossier contexte instructions connaissances"}, {"id": 33, "cat": "bases", "lvl": 1, "t": "Régler la mémoire et tes préférences", "pitch": "Claude peut retenir qui tu es et comment tu aimes qu'on te réponde, d'une conversation à l'autre.", "steps": ["Ouvre les Paramètres et cherche la section consacrée à la mémoire. Active la génération de mémoire à partir des discussions.", "Dans tes préférences personnelles, écris en quelques lignes ton métier et le style de réponse que tu veux.", "Pour corriger un souvenir, dis-le simplement dans une conversation : « oublie ceci », « retiens plutôt cela »."], "prompt": "Retiens ceci pour la suite : je suis [ton métier], je m'adresse à [type de clients], et je veux des réponses [courtes, détaillées, sans listes]. Dis-moi ensuite ce que tu as retenu sur moi.", "kw": "souvenir retenir profil personnalisation style"}, {"id": 38, "cat": "bases", "lvl": 1, "t": "Brancher tes mails, ton agenda et tes dossiers", "pitch": "Avec les connecteurs, Claude lit et agit directement dans tes outils : Gmail, Google Agenda, Drive, Canva et beaucoup d'autres.", "steps": ["Ouvre Personnaliser, puis Connecteurs.", "Choisis l'outil à relier et connecte-toi à ton compte quand la fenêtre s'ouvre.", "De retour dans une conversation, demande simplement ce que tu veux. Claude utilise le connecteur tout seul."], "prompt": "Regarde mes mails non lus de la semaine. Classe-les en trois groupes : à traiter aujourd'hui, peut attendre, inutile. Pour ceux du premier groupe, prépare un brouillon de réponse que je validerai.", "note": "Claude te demande ton accord avant d'envoyer un message ou de modifier quoi que ce soit.", "kw": "gmail outlook drive calendrier connecteur boîte mail"}, {"id": 42, "cat": "bases", "lvl": 1, "t": "Apprendre ta méthode à Claude", "pitch": "Une compétence est une procédure enregistrée que Claude suit à chaque fois : ta façon de faire un devis, de répondre à un client, de mettre en page un document.", "steps": ["Fais le travail une fois avec Claude, jusqu'à obtenir exactement le résultat voulu.", "Colle la consigne ci-dessous dans la même conversation.", "Relis la proposition et enregistre-la.", "Retrouve et active tes compétences dans Personnaliser, puis Compétences."], "prompt": "Le résultat qu'on vient d'obtenir me convient. Transforme cette méthode en compétence réutilisable : la structure, le ton, les mentions obligatoires, la mise en page. La prochaine fois, je veux juste te donner [les informations qui changent à chaque fois].", "note": "Il faut que la création de fichiers soit activée dans Paramètres, section Capacités.", "where": "Colle-la dans la conversation où tu viens de faire le travail.", "open": false, "kw": "skill procédure modèle habitude répétitif"}, {"id": 43, "cat": "bases", "lvl": 1, "t": "Parler à Claude au lieu d'écrire", "pitch": "Le mode vocal transforme Claude en interlocuteur. Pratique les mains prises, à l'atelier ou en marchant.", "steps": ["Sur téléphone, ouvre l'appli et touche l'icône en forme d'onde sonore à côté du micro.", "Choisis une voix et parle normalement.", "Sur ordinateur, la même icône se trouve en bas à droite de la zone de saisie.", "Touche Stop pour revenir au texte. Toute la conversation reste écrite."], "prompt": "Je vais te raconter ma journée en vrac. À la fin, fais-moi la liste de ce que je dois faire demain, par ordre de priorité.", "note": "Disponible sur tous les forfaits, encore en version bêta.", "open": false, "where": "À dire à voix haute, en mode vocal.", "kw": "voix micro oral dicter mains libres"}, {"id": 51, "cat": "ecrire", "lvl": 1, "t": "Rédiger un message délicat", "pitch": "Relance d'impayé, refus, excuse, mauvaise nouvelle : Claude propose plusieurs approches et tu choisis celle qui te ressemble.", "steps": ["Explique la situation en quelques lignes : qui, quoi, ce que tu veux obtenir.", "Précise la relation : client fidèle, fournisseur, salarié, voisin.", "Demande plusieurs versions avec des stratégies différentes.", "Choisis, ajuste un mot ou deux, et envoie toi-même."], "prompt": "Je dois écrire à [qui, et notre relation] pour [la situation]. Je veux obtenir [le résultat voulu], sans abîmer la relation. Propose trois versions courtes : une ferme, une conciliante, une entre les deux. Dis-moi ce que chacune risque de provoquer.", "kw": "mail relance impayé refus excuse lettre réclamation"}, {"id": 44, "cat": "ecrire", "lvl": 1, "t": "Faire écrire Claude avec ta voix", "pitch": "Mails, publications, courriers : Claude prend ton ton à partir de tes propres textes.", "steps": ["Rassemble cinq à dix textes que tu as écrits toi-même et dont tu es content.", "Colle-les et demande à Claude de décrire ton style.", "Corrige sa description si elle sonne faux.", "Demande ensuite tes brouillons « dans mon style »."], "prompt": "Voici des messages que j'ai écrits : [colle tes textes]. Décris mon style en dix lignes : longueur des phrases, niveau de langue, tics, ce que je ne dis jamais. Ensuite, rédige dans ce style une réponse à ce message : [message reçu]", "kw": "style ton personnel imiter brouillon"}, {"id": 46, "cat": "ecrire", "lvl": 1, "t": "Répondre aux avis clients", "pitch": "Une réponse personnalisée à chaque avis, bon ou mauvais, en deux minutes au lieu de vingt.", "steps": ["Copie les avis depuis ta fiche Google.", "Colle-les avec la consigne.", "Relis, ajuste un mot ou deux, et publie toi-même."], "prompt": "Voici les avis reçus ce mois-ci sur [ton commerce] : [colle les avis]. Rédige une réponse pour chacun : courte, chaleureuse, qui reprend un détail précis de l'avis. Pour les avis négatifs, reconnais le problème sans te justifier et propose de revenir. Aucune réponse ne doit ressembler à une autre.", "kw": "google avis étoiles réputation commentaire"}, {"id": 53, "cat": "ecrire", "lvl": 1, "t": "Traduire un message avec le bon ton", "pitch": "Claude traduit le sens et le ton, pas seulement les mots. Il adapte le niveau de politesse au pays et à la personne.", "steps": ["Colle ton message et indique la langue voulue.", "Dis à qui tu écris : un client, un ami, une administration.", "Demande une retraduction en français pour vérifier que le sens est le bon."], "prompt": "Traduis ce message en [langue] pour [destinataire et contexte]. Garde un ton [cordial, direct, formel]. Ensuite, retraduis ta version en français mot à mot pour que je vérifie, et signale les tournures qui ne passent pas dans cette langue. Mon message : [ton message]", "kw": "traduction anglais espagnol italien langue étrangère"}, {"id": 68, "cat": "ecrire", "lvl": 1, "t": "Préparer un mois de publications", "pitch": "Instagram, Facebook, fiche Google : Claude prépare un calendrier d'idées et rédige chaque publication.", "steps": ["Décris ton activité, ta clientèle et ce que tu veux mettre en avant ce mois-ci.", "Colle deux ou trois publications que tu as aimées, les tiennes ou celles d'autres commerces.", "Demande le calendrier, puis fais rédiger les publications une semaine à la fois.", "Prends tes propres photos : les vraies images de ton travail marchent mieux que tout le reste."], "prompt": "Je tiens [ton activité] à [ta ville]. Ma clientèle : [description]. Prépare un calendrier de douze publications pour le mois prochain sur [réseau]. Pour chacune : l'idée, la photo à prendre, le texte en trois lignes maximum, sans mots creux. Alterne coulisses du métier, conseils et offres.", "kw": "instagram facebook réseaux sociaux post communication"}, {"id": 2, "cat": "ecrire", "lvl": 3, "t": "Dicter au lieu de taper, sans fautes", "pitch": "Tu appuies sur une touche, tu parles, et ton texte apparaît propre et corrigé là où se trouve ton curseur.", "steps": ["Ouvre une session Claude Code dans un dossier vide.", "Colle la consigne et laisse Claude construire le petit programme.", "Autorise l'accès au micro quand ton ordinateur le demande.", "Essaie dans un mail. Si le ton ou la ponctuation ne te va pas, dis à Claude ce qu'il faut changer."], "prompt": "Construis-moi un petit outil de dictée pour mon ordinateur [Windows ou Mac]. Quand je maintiens une touche, il enregistre ma voix. Quand je relâche, il transcrit, corrige l'orthographe et la ponctuation, puis colle le texte là où est mon curseur. Explique-moi comment le lancer au démarrage.", "note": "Sans rien construire : le mode vocal de l'appli Claude et la dictée de ton téléphone font déjà une bonne partie du travail.", "kw": "dictée voix orthographe taper clavier"}, {"id": 36, "cat": "documents", "lvl": 1, "t": "Faire lire une photo, un scan ou une facture", "pitch": "Une photo de facture, un courrier manuscrit, une capture d'écran : Claude lit et en tire ce que tu demandes.", "steps": ["Prends la photo bien à plat, avec de la lumière.", "Joins-la avec le bouton + ou depuis l'appareil photo de l'appli mobile.", "Dis ce que tu veux en sortir."], "prompt": "Voici la photo d'une facture. Sors-moi dans un tableau : fournisseur, date, numéro, chaque ligne avec quantité et prix unitaire, total hors taxes, TVA, total TTC. Signale toute erreur de calcul.", "kw": "photo scan ticket reçu note de frais manuscrit capture"}, {"id": 52, "cat": "documents", "lvl": 1, "t": "Résumer un long document", "pitch": "Rapport de cent pages, conditions générales, notice : Claude en tire l'essentiel et répond à tes questions avec le numéro de page.", "steps": ["Joins le document avec le bouton +.", "Dis à quoi le résumé va te servir et la longueur voulue.", "Pose ensuite tes questions. Demande toujours la page pour pouvoir vérifier."], "prompt": "Résume ce document en dix lignes pour [qui, et pour quelle décision]. Sépare ce qui est important de ce qui est secondaire. Ensuite, liste les cinq points qui me concernent directement en tant que [ta position], avec le numéro de page de chacun.", "kw": "synthèse pdf rapport lecture conditions générales"}, {"id": 35, "cat": "documents", "lvl": 1, "t": "Obtenir un vrai fichier Word, Excel, PowerPoint ou PDF", "pitch": "Claude ne se contente pas d'écrire du texte. Il fabrique le fichier, prêt à télécharger et à envoyer.", "steps": ["Dans Paramètres, section Capacités, active la création et la modification de fichiers.", "Demande le document en nommant le format voulu.", "Télécharge le fichier depuis la conversation.", "Pour une correction, dis ce qu'il faut changer. Claude refait le fichier."], "prompt": "Crée un fichier [Excel, Word, PDF] pour [à quoi il sert]. Il doit contenir [contenu, colonnes ou rubriques]. Mets-le en page proprement, prêt à envoyer.", "kw": "docx xlsx pptx fichier télécharger tableur devis"}, {"id": 48, "cat": "documents", "lvl": 1, "t": "Monter un diaporama", "pitch": "Tu donnes le sujet et le public. Claude construit les diapositives, textes et mise en page compris.", "steps": ["Indique le sujet, le public et la durée de la présentation.", "Joins tes documents sources si tu en as.", "Claude crée le diaporama. Tu modifies les textes directement dedans.", "Télécharge-le en PowerPoint ou en PDF."], "prompt": "Prépare une présentation de dix diapositives sur [sujet] pour [public], à tenir en [quinze] minutes. Une idée par diapositive, très peu de texte, des chiffres quand il y en a. Ajoute des notes pour l'orateur.", "kw": "powerpoint slides présentation réunion"}, {"id": 58, "cat": "documents", "lvl": 1, "t": "Remplir, fusionner ou découper un PDF", "pitch": "Claude remplit un formulaire à partir de tes informations, assemble plusieurs PDF en un seul ou en extrait quelques pages.", "steps": ["Vérifie que la création de fichiers est activée dans Paramètres, section Capacités.", "Joins le ou les PDF.", "Dis précisément ce que tu veux : remplir, fusionner dans tel ordre, garder les pages 3 à 7.", "Télécharge le résultat et relis les champs remplis avant de signer."], "prompt": "Voici un formulaire PDF. Remplis-le avec ces informations : [tes informations]. Laisse vides les champs pour lesquels tu n'as rien et fais-m'en la liste. Rends-moi le PDF rempli.", "kw": "cerfa formulaire assembler pages extraire"}, {"id": 45, "cat": "documents", "lvl": 1, "t": "Lire un contrat avant de signer", "pitch": "Bail, contrat fournisseur, conditions générales : Claude repère les clauses qui te lient et celles qui manquent.", "steps": ["Joins le contrat en PDF ou en photos.", "Colle la consigne en précisant de quel côté tu es.", "Pose tes questions sur les passages qu'il signale.", "Demande un mail de demande de modification pour les points à renégocier."], "prompt": "Voici un contrat de [type de contrat] que je m'apprête à signer en tant que [ta position]. Explique-le-moi simplement. Liste les clauses à mon désavantage, les engagements de durée, les pénalités, les conditions de sortie, et ce qui devrait y figurer mais n'y est pas.", "note": "Claude n'est pas avocat. Pour un engagement lourd, fais valider ses remarques par un professionnel.", "kw": "bail clause juridique engagement résiliation"}, {"id": 57, "cat": "documents", "lvl": 1, "t": "Décoder un courrier administratif", "pitch": "Impôts, URSSAF, assurance, syndic : Claude traduit le courrier en français courant et te dit quoi faire, pour quand.", "steps": ["Prends le courrier en photo, recto et verso.", "Joins les photos et colle la consigne.", "Demande un brouillon de réponse si le courrier en attend une.", "En cas de doute sur un montant ou un délai, appelle l'organisme : le numéro figure sur le courrier."], "prompt": "Voici un courrier que j'ai reçu. Explique-moi en langage simple : qui m'écrit, pourquoi, ce qu'on me demande, pour quelle date, et ce que je risque si je ne fais rien. Donne-moi ensuite la liste des choses à faire dans l'ordre. Si une réponse est attendue, prépare-la.", "note": "Pour un litige ou une somme importante, fais confirmer par ton comptable ou par l'organisme lui-même.", "kw": "impôts urssaf lettre administration assurance syndic"}, {"id": 37, "cat": "chiffres", "lvl": 1, "t": "Faire parler tes chiffres", "pitch": "Tu déposes un export de caisse ou un relevé. Claude calcule, compare et dessine les graphiques.", "steps": ["Exporte tes données en Excel ou en CSV depuis ton logiciel.", "Joins le fichier à la conversation.", "Pose ta question comme tu la poserais à un comptable.", "Demande le résultat en graphique ou en tableau à télécharger."], "prompt": "Voici mes ventes des [douze] derniers mois. Dis-moi quels sont mes cinq produits ou services les plus rentables, les jours et heures les plus forts, et les mois creux. Montre l'évolution en graphique et propose trois décisions à prendre.", "note": "Claude fait les calculs avec un vrai programme, pas de tête. Demande-lui de montrer comment il a compté si un chiffre t'étonne.", "kw": "ventes caisse statistiques graphique analyse csv"}, {"id": 54, "cat": "chiffres", "lvl": 1, "t": "Comparer des devis", "pitch": "Trois devis, trois présentations différentes. Claude les met dans le même tableau et montre ce que chacun oublie.", "steps": ["Joins tous les devis, en PDF ou en photo.", "Colle la consigne.", "Regarde les lignes présentes chez l'un et absentes chez l'autre : c'est là que se cachent les écarts.", "Demande les questions à poser à chaque fournisseur avant de choisir."], "prompt": "Voici plusieurs devis pour [la prestation]. Mets-les dans un seul tableau, ligne par ligne, pour que je compare à périmètre égal. Signale ce qui est inclus chez l'un et pas chez l'autre, les délais, les garanties et les conditions de paiement. Termine par les questions à poser à chacun.", "kw": "devis comparaison fournisseur prix offre"}, {"id": 71, "cat": "chiffres", "lvl": 1, "t": "Tenir un tableau de suivi", "pitch": "Commandes, stock, réparations en cours, dépenses : Claude crée le tableau avec les bonnes colonnes et les formules déjà en place.", "steps": ["Décris ce que tu veux suivre et les informations à noter pour chaque ligne.", "Claude crée le tableau. Tu le remplis directement.", "Demande les totaux, les filtres ou les couleurs d'alerte dont tu as besoin.", "Télécharge-le en Excel si tu préfères travailler dans ton tableur."], "prompt": "Crée un tableau pour suivre [ce que tu veux suivre]. Colonnes : [liste des colonnes]. Ajoute un total par [mois, client, catégorie], une couleur d'alerte quand [condition], et dix lignes d'exemple que je remplacerai.", "kw": "tableur stock commandes suivi budget dépenses"}, {"id": 62, "cat": "chiffres", "lvl": 1, "t": "Suivre ton activité sur un tableau de bord", "pitch": "Tes chiffres clés sur une seule page : ventes, panier moyen, meilleurs jours. Tu la rouvres quand tu veux.", "steps": ["Exporte tes données depuis ton logiciel de caisse ou ton tableur.", "Joins le fichier et dis quels chiffres comptent pour toi.", "Claude crée une page avec les indicateurs et les graphiques.", "Le mois suivant, donne le nouveau fichier et demande la mise à jour."], "prompt": "Voici mes données de [ventes, rendez-vous, commandes]. Crée un tableau de bord sur une page avec : le chiffre du mois et son évolution, [deuxième indicateur], [troisième indicateur], et un graphique par semaine. Lisible sur téléphone.", "kw": "indicateurs kpi pilotage graphique dashboard"}, {"id": 34, "cat": "savoir", "lvl": 1, "paid": true, "t": "Lancer une recherche approfondie", "pitch": "Au lieu d'une réponse rapide, Claude consulte des dizaines de sources et rend un rapport complet avec les liens.", "steps": ["Vérifie que la recherche web est activée.", "Clique sur le bouton + en bas à gauche de la zone de saisie, puis sur Recherche.", "Pose ta question avec le plus de contexte possible.", "Laisse tourner, puis lis le rapport et clique sur les sources qui t'intéressent."], "prompt": "Fais une étude complète sur [sujet] : état du marché en France, principaux acteurs, prix pratiqués, réglementation, tendances des deux dernières années. Termine par ce que cela change concrètement pour [ta situation].", "note": "Une recherche approfondie consomme ton quota plus vite qu'une conversation normale.", "kw": "étude de marché rapport sources enquête veille"}, {"id": 59, "cat": "savoir", "lvl": 1, "t": "Vérifier une information", "pitch": "Une rumeur, un chiffre vu sur les réseaux, une promesse commerciale : Claude cherche les sources et te dit ce qui tient debout.", "steps": ["Colle l'affirmation telle que tu l'as lue, avec le lien si tu l'as.", "Vérifie que la recherche web est activée.", "Lis les sources qu'il cite. Privilégie les sites officiels et les médias reconnus.", "Si les sources se contredisent, demande-lui d'expliquer pourquoi."], "prompt": "J'ai lu ceci : « [l'affirmation] ». Cherche si c'est vrai. Donne-moi les sources les plus fiables pour et contre, la date de chaque information, et ta conclusion : confirmé, faux, ou impossible à trancher.", "kw": "rumeur fake vrai faux source fiable"}, {"id": 26, "cat": "savoir", "lvl": 1, "t": "Te faire fabriquer un cours sur mesure", "pitch": "Claude crée un petit site de cours rien que pour toi, sur n'importe quel sujet, à ton niveau.", "steps": ["Dis ce que tu veux savoir faire à la fin, et ton niveau de départ.", "Colle la consigne. Claude crée un site avec les leçons dans l'ordre.", "Avance leçon par leçon et pose tes questions dans la conversation.", "Demande un quiz à la fin de chaque chapitre."], "prompt": "Je veux apprendre à [objectif concret]. Je pars de [zéro, ou ton niveau]. Crée-moi un site de cours en huit leçons courtes, avec pour chacune : ce que je vais savoir faire, l'explication simple, un exercice pratique et la liste du matériel. Vingt minutes par leçon maximum.", "kw": "formation leçon apprendre tutoriel débutant"}, {"id": 50, "cat": "savoir", "lvl": 1, "t": "Réviser avec des quiz", "pitch": "Claude transforme n'importe quel document en questions à choix multiples ou en cartes mémoire.", "steps": ["Joins le document à apprendre, ou donne simplement le sujet.", "Demande un quiz en précisant le nombre de questions.", "Réponds. Claude explique chaque erreur.", "Demande une deuxième série sur ce que tu as raté."], "prompt": "Fais-moi un quiz de dix questions sur [sujet ou document joint]. Difficulté progressive. Après mes réponses, explique mes erreurs et repose-moi autrement les questions ratées.", "kw": "révision examen mémoriser questions permis"}, {"id": 27, "cat": "savoir", "lvl": 1, "t": "Transformer des heures de podcasts en guide", "pitch": "Quarante heures d'écoute deviennent un guide de vingt pages avec l'essentiel.", "steps": ["Ouvre NotebookLM (gratuit, de Google) et ajoute les liens des épisodes ou les fichiers audio.", "Demande-lui la transcription ou un résumé détaillé de chaque épisode et copie le texte.", "Colle ces textes dans Claude, ou joins-les en fichiers.", "Colle la consigne et récupère ton guide."], "prompt": "Voici les transcriptions de plusieurs épisodes de podcast sur [sujet]. Fais-en un guide pratique : les idées qui reviennent, les conseils concrets classés par thème, les désaccords entre invités, et un plan d'action en dix points. Indique pour chaque idée l'épisode d'où elle vient.", "kw": "audio émission vidéo youtube transcription synthèse"}, {"id": 66, "cat": "savoir", "lvl": 1, "t": "T'entraîner à parler une langue", "pitch": "Claude tient la conversation à voix haute dans la langue de ton choix, à ton niveau, et corrige tes fautes à la fin.", "steps": ["Ouvre le mode vocal sur ton téléphone.", "Dis la langue, ton niveau et la situation à jouer : au restaurant, avec un client, à l'aéroport.", "Parle. Ne t'arrête pas pour les fautes.", "Demande à la fin la liste de tes erreurs et les bonnes tournures."], "prompt": "Parlons en [langue]. Mon niveau est [débutant, moyen, bon]. Joue [le rôle, par exemple un client étranger]. Parle lentement, ne passe au français que si je suis bloqué. Quand je dis « bilan », donne-moi mes cinq erreurs principales et la bonne formule.", "open": false, "where": "À dire à voix haute, en mode vocal.", "kw": "anglais espagnol conversation oral accent"}, {"id": 18, "cat": "savoir", "lvl": 3, "t": "Chercher une exoplanète dans les données de la NASA", "pitch": "La NASA publie gratuitement les mesures de ses télescopes. Claude Code les télécharge et cherche la petite baisse de lumière qui trahit une planète.", "steps": ["Ouvre Claude Code dans un dossier vide.", "Colle la consigne et laisse-le télécharger un premier jeu de données.", "Demande-lui de t'expliquer chaque graphique comme à un débutant."], "prompt": "Je veux apprendre à chercher des exoplanètes avec les données publiques de la NASA (mission TESS). Télécharge les mesures de luminosité d'une étoile connue pour avoir une planète, montre-moi le graphique, et explique ce qu'on y voit. Ensuite, applique la même méthode à dix étoiles non étudiées.", "kw": "astronomie science espace données publiques"}, {"id": 21, "cat": "creer", "lvl": 1, "t": "Créer un site web sans rien connaître", "pitch": "Tu décris ton site, Claude le construit sous tes yeux. Un enfant de neuf ans y arrive.", "steps": ["Décris le site en trois phrases : le sujet, les pages, l'ambiance.", "Claude le construit et l'affiche à côté de la conversation.", "Demande les changements en langage courant : « le titre plus gros », « ajoute une page contact ».", "Partage le lien quand tu es content."], "prompt": "Crée un site sur [sujet]. Trois pages : accueil, [deuxième page], contact. Ambiance [joyeuse, sobre, élégante]. Mets de vrais textes, pas du remplissage. Pose-moi deux questions si tu as besoin de précisions.", "kw": "site internet page vitrine web"}, {"id": 47, "cat": "creer", "lvl": 1, "t": "Fabriquer un outil et le partager par un lien", "pitch": "Un calculateur de devis, un formulaire, une liste à cocher : Claude crée une page qui fonctionne et que tu envoies à qui tu veux.", "steps": ["Décris l'outil : ce qu'on y saisit, ce qu'il affiche.", "Claude le publie sous forme de page avec sa propre adresse.", "Teste-le sur ton téléphone.", "Partage le lien. La page reste privée tant que tu ne la partages pas."], "prompt": "Crée une page avec un calculateur de [ce qu'il calcule] pour [ton activité]. On choisit [les choix possibles], et le total se met à jour tout seul. Voici mes tarifs : [tes tarifs]. Lisible sur téléphone.", "kw": "calculateur formulaire simulateur page partage"}, {"id": 55, "cat": "creer", "lvl": 1, "t": "Créer une affiche ou un flyer", "pitch": "Promotion, horaires d'été, ouverture exceptionnelle : Claude compose l'affiche, tu ajustes et tu imprimes.", "steps": ["Donne le texte exact à afficher, le format (A4, A5, écran) et l'ambiance voulue.", "Joins ton logo si tu en as un.", "Claude compose l'affiche. Demande les retouches : plus gros, autre couleur, moins de texte.", "Télécharge-la en PDF pour l'imprimeur ou ton imprimante."], "prompt": "Crée une affiche [format] pour [événement ou offre]. Texte à faire figurer : [texte exact]. Ambiance : [sobre, festive, élégante]. Le message principal doit se lire à trois mètres. Propose deux mises en page différentes.", "note": "Si tu utilises Canva, relie-le dans Personnaliser, Connecteurs : Claude peut créer le visuel directement dans ton compte.", "kw": "affiche flyer visuel promotion vitrine canva"}, {"id": 56, "cat": "creer", "lvl": 1, "t": "Dessiner un schéma", "pitch": "Un processus, une organisation, un plan d'atelier : Claude transforme ton explication en schéma clair.", "steps": ["Explique avec tes mots ce que tu veux montrer, dans l'ordre où ça se passe.", "Claude dessine le schéma dans la conversation.", "Corrige : « l'étape 3 vient avant la 2 », « ajoute une flèche de retour ».", "Demande une version à imprimer ou à glisser dans un document."], "prompt": "Fais un schéma de [processus ou organisation]. Voici comment ça se passe : [explication en vrac]. Je veux des cases, des flèches et très peu de texte, compréhensible par un nouvel employé en trente secondes.", "kw": "diagramme organigramme processus plan dessin"}, {"id": 29, "cat": "creer", "lvl": 1, "t": "Offrir un petit jeu personnalisé", "pitch": "Un jeu où le héros porte le prénom de ton ami, avec ses blagues et ses manies. Fait en une soirée, pour un anniversaire ou un départ.", "steps": ["Note cinq détails sur la personne : passions, expressions, souvenirs communs.", "Colle la consigne.", "Joue, puis demande les réglages : plus facile, plus long, autre décor.", "Envoie le lien le jour J."], "prompt": "Crée un petit jeu jouable au clavier et au doigt pour [prénom], à l'occasion de [occasion]. Le héros lui ressemble : [détails sur la personne]. Il doit ramasser [ce qu'il aime] et éviter [ce qu'il déteste]. Trois niveaux, un message personnel à la fin.", "kw": "anniversaire cadeau jeu surprise"}, {"id": 22, "cat": "creer", "lvl": 1, "t": "Voir un meuble chez toi en 3D avant d'acheter", "pitch": "Tu donnes les mesures de la pièce et du meuble. Claude dessine le tout en trois dimensions et tu tournes autour.", "steps": ["Mesure la pièce : longueur, largeur, hauteur, emplacement des portes et fenêtres.", "Copie les dimensions du meuble depuis la fiche produit.", "Colle la consigne et fais pivoter la vue avec la souris ou le doigt.", "Demande de déplacer le meuble ou d'essayer une autre taille."], "prompt": "Dessine ma pièce en 3D, que je puisse faire tourner. Dimensions : [longueur x largeur x hauteur] cm. Porte et fenêtre : [emplacements]. Place [le meuble et ses dimensions] contre [quel mur]. Indique l'espace de passage restant de chaque côté, en centimètres.", "kw": "aménagement décoration lit canapé plan mesure"}, {"id": 23, "cat": "creer", "lvl": 1, "t": "Visiter une maison avant sa construction", "pitch": "À partir d'un plan, Claude monte les murs en 3D et te laisse te promener dedans.", "steps": ["Prends ton plan en photo bien à plat, avec les cotes lisibles, et joins-le.", "Colle la consigne.", "Vérifie que les pièces correspondent au plan et signale les erreurs.", "Demande des variantes : cloison en moins, cuisine ouverte."], "prompt": "Voici le plan de ma future maison. Reconstruis-la en 3D à l'échelle, avec les murs, portes et fenêtres, et laisse-moi m'y déplacer comme dans une visite. Commence par me lister les pièces et leurs dimensions telles que tu les lis, pour que je confirme avant que tu dessines.", "note": "C'est une aide pour se projeter. Elle ne remplace pas les plans de l'architecte.", "kw": "plan architecte travaux rénovation visite virtuelle"}, {"id": 49, "cat": "creer", "lvl": 3, "t": "Dessiner un objet pour ton imprimante 3D", "pitch": "Tu décris une pièce avec ses mesures. Claude Code produit le fichier prêt à imprimer.", "steps": ["Mesure précisément ce dont tu as besoin, au pied à coulisse si possible.", "Ouvre Claude Code dans un dossier vide et colle la consigne.", "Claude écrit le modèle et te montre un aperçu.", "Récupère le fichier STL, ouvre-le dans le logiciel de ton imprimante et lance l'impression."], "prompt": "Dessine une pièce à imprimer en 3D : [description]. Dimensions : [mesures en mm]. Elle doit [fonction, contrainte de solidité]. Produis un fichier STL, montre-moi une image du résultat sous trois angles, et indique l'orientation d'impression conseillée.", "note": "Pour une pièce qui s'emboîte, imprime d'abord un essai rapide : il faut souvent ajuster de quelques dixièmes de millimètre.", "kw": "stl impression 3d pièce support modèle"}, {"id": 20, "cat": "creer", "lvl": 3, "t": "Traduire un jeu, une vidéo ou un logiciel", "pitch": "Un jeu entier, des sous-titres, un site ou une notice : Claude Code traduit tous les fichiers d'un coup en gardant le ton.", "steps": ["Mets les fichiers à traduire dans un dossier.", "Ouvre Claude Code sur ce dossier et colle la consigne.", "Relis un échantillon et corrige le ton une fois. Claude applique la correction partout.", "Pour les voix, Claude prépare le texte. Le doublage audio passe par un service de synthèse vocale à part."], "prompt": "Ce dossier contient les textes d'un [jeu, logiciel, vidéo] en [langue d'origine]. Traduis tout en français naturel, en gardant le ton d'origine et la longueur des phrases quand elles s'affichent à l'écran. Fais d'abord un lexique des termes récurrents et montre-le-moi avant de traduire le reste.", "kw": "sous-titres localisation doublage notice"}, {"id": 31, "cat": "creer", "lvl": 3, "t": "Filmer en accéléré avec ta webcam", "pitch": "La webcam prend une photo à intervalle régulier pendant des heures, puis Claude choisit les meilleures et monte un accéléré.", "steps": ["Place la webcam devant ce que tu veux suivre : le ciel, une plante, un chantier.", "Dans Claude Code, colle la consigne.", "Laisse l'ordinateur allumé, veille désactivée.", "À la fin, demande le montage."], "prompt": "Prends une photo avec ma webcam toutes les [5] minutes pendant [8] heures et range-les dans un dossier daté. À la fin, sélectionne les dix plus intéressantes en expliquant ton choix, et assemble toutes les images en une vidéo accélérée de trente secondes.", "kw": "timelapse photo nuit chantier vidéo"}, {"id": 39, "cat": "automatiser", "lvl": 1, "paid": true, "t": "Programmer une tâche qui se répète", "pitch": "Une tâche planifiée tourne toute seule : chaque heure, chaque jour, chaque semaine ou les jours ouvrés.", "steps": ["Dans une conversation, décris la tâche et sa fréquence.", "Réponds aux questions de Claude.", "Vérifie le nom, l'horaire et les instructions proposés, puis clique sur Planifier.", "Retrouve tes tâches dans la rubrique Planifié du menu pour les modifier ou les arrêter."], "prompt": "Tous les [jour et heure], [ce que Claude doit faire] et envoie-moi le résultat sous forme de [tableau, résumé, fichier].", "note": "La plupart des tâches tournent dans le nuage, ordinateur éteint. Celles qui touchent à tes fichiers locaux ont besoin que l'ordinateur soit allumé.", "kw": "récurrent automatique chaque semaine veille rappel"}, {"id": 6, "cat": "automatiser", "lvl": 1, "paid": true, "t": "Recevoir tes mails et l'actu résumés chaque matin", "pitch": "Chaque matin, une page t'attend avec les mails qui comptent et les nouvelles de ton secteur. Tu la lis au café.", "steps": ["Relie ta boîte mail à Claude : Personnaliser, puis Connecteurs.", "Dans une conversation, colle la consigne.", "Claude te propose un nom, un horaire et des instructions. Vérifie et clique sur Planifier.", "Le lendemain, ouvre le résultat et ajuste : plus court, autres sujets, autre heure."], "prompt": "Tous les jours à [heure], sauf le dimanche, prépare-moi une page de synthèse : les mails reçus depuis la veille qui demandent une réponse de ma part (expéditeur, sujet, ce qu'on attend de moi), puis cinq nouvelles sur [ton secteur] et [ta ville]. Une seule page, lisible en deux minutes.", "kw": "synthèse matin mails actualité revue de presse"}, {"id": 40, "cat": "automatiser", "lvl": 2, "paid": true, "t": "Laisser Claude naviguer sur le web à ta place", "pitch": "L'extension Claude dans Chrome clique, remplit les formulaires et passe d'un onglet à l'autre pendant que tu fais autre chose.", "steps": ["Ouvre Google Chrome, va sur le Chrome Web Store et cherche Claude.", "Clique sur Ajouter à Chrome.", "Clique sur l'icône Claude dans la barre d'outils. Un panneau s'ouvre sur le côté.", "Décris la tâche et autorise les sites concernés quand il le demande."], "prompt": "Va sur le site de [fournisseur ou service], avec ma session déjà ouverte, et télécharge [ce que tu veux récupérer] des [trois] derniers mois. Dis-moi le total.", "note": "Chrome uniquement. Ne le laisse pas seul sur ta banque ou sur un paiement : reste devant l'écran pour ces sites-là.", "open": false, "where": "Colle-la dans le panneau Claude de Chrome.", "kw": "navigateur chrome formulaire factures site internet"}, {"id": 41, "cat": "automatiser", "lvl": 2, "paid": true, "t": "Confier ton ordinateur à Claude", "pitch": "Claude voit ton écran, déplace la souris et tape au clavier dans tes logiciels, comme une personne assise à ta place.", "steps": ["Ouvre l'appli bureau et laisse-la tourner.", "Demande une tâche dans un de tes logiciels. Claude te propose d'activer le contrôle de l'ordinateur.", "Accepte, puis choisis les applications qu'il a le droit d'utiliser.", "Regarde-le faire les premières fois. Tu peux l'arrêter à tout moment."], "prompt": "Ouvre mon logiciel [nom du logiciel], va dans [menu ou écran], et exporte [ce que tu veux] du mois dernier au format Excel dans mon dossier Documents.", "note": "C'est plus lent qu'un connecteur. À utiliser quand aucun connecteur n'existe pour le logiciel.", "where": "Colle-la dans l'appli Claude sur ton ordinateur.", "kw": "souris clavier logiciel piloter écran"}, {"id": 61, "cat": "automatiser", "lvl": 2, "paid": true, "t": "Ranger un dossier en désordre", "pitch": "Des centaines de fichiers aux noms incompréhensibles. Claude les trie, les renomme et les classe dans des sous-dossiers.", "steps": ["Ouvre l'appli bureau et donne à Claude l'accès au dossier concerné, et à lui seul.", "Colle la consigne. Claude regarde le contenu et te propose un plan de rangement.", "Valide le plan avant qu'il ne déplace quoi que ce soit.", "Pour supprimer des fichiers, il te demande une autorisation à part. Accepte seulement si tu as vérifié la liste."], "prompt": "Regarde le contenu de ce dossier. Propose-moi un rangement : sous-dossiers par [année, client, type], et des noms de fichiers clairs sur le modèle [date - sujet]. Montre-moi le plan et la liste des doublons avant de toucher à quoi que ce soit. Ne supprime rien.", "note": "Fais une copie du dossier avant un grand rangement.", "where": "Colle-la dans l'appli Claude sur ton ordinateur.", "kw": "fichiers trier renommer classer doublons téléchargements"}, {"id": 19, "cat": "automatiser", "lvl": 3, "t": "Lancer plusieurs Claude en parallèle", "pitch": "Un gros travail découpé entre plusieurs agents qui avancent en même temps : cinquante fiches à rédiger, vingt concurrents à étudier.", "steps": ["Choisis un travail qui se découpe en morceaux indépendants.", "Dans Claude Code, demande explicitement d'utiliser des agents en parallèle.", "Demande un tableau final qui regroupe tous les résultats.", "Vérifie toi-même quelques lignes au hasard."], "prompt": "J'ai [nombre] éléments à traiter : [liste ou fichier]. Pour chacun, il faut [travail à faire]. Répartis le travail entre plusieurs agents qui avancent en parallèle, puis rassemble tout dans un seul tableau. Vérifie un échantillon avant de me rendre le résultat.", "note": "Plusieurs agents consomment ton quota d'utilisation beaucoup plus vite.", "kw": "agents équipe gros volume lot masse"}, {"id": 11, "cat": "entreprise", "lvl": 1, "t": "Préparer une négociation", "pitch": "Claude joue ton fournisseur, ton bailleur ou ton banquier, sans te ménager. Tu t'entraînes avant le vrai rendez-vous.", "steps": ["Décris la situation : qui est en face, ce que tu veux obtenir, ta limite.", "Demande à Claude de jouer l'autre partie, durement.", "Joue l'échange en entier, par écrit ou à la voix.", "Demande ensuite un débrief : où tu as cédé trop vite, quels arguments ont porté."], "prompt": "Je vais négocier [quoi] avec [qui]. Mon objectif : [objectif]. Ma limite : [limite]. Joue le rôle de la personne en face, coriace et réaliste. Ne me facilite pas la tâche. Quand je dis « stop », sors du rôle et dis-moi ce que j'ai bien fait, ce que j'ai raté, et les trois phrases que j'aurais dû dire.", "kw": "négocier loyer prix fournisseur banque entraînement"}, {"id": 64, "cat": "entreprise", "lvl": 1, "t": "Faire démolir ton idée avant de la lancer", "pitch": "Claude joue le contradicteur. Il cherche les failles de ton projet, de ton devis ou de ton plan avant que la réalité s'en charge.", "steps": ["Expose ton idée, ton texte ou ton plan en entier.", "Demande-lui explicitement de critiquer, sans ménagement.", "Réponds à ses objections. Celles que tu ne sais pas contrer sont les vraies.", "Demande une version améliorée qui tient compte des critiques retenues."], "prompt": "Voici mon projet : [description]. Ne me dis pas ce qui est bien. Joue le rôle d'un associé sceptique : trouve les dix failles les plus sérieuses, classe-les de la plus grave à la moins grave, et pour chacune dis ce qu'il faudrait vérifier ou changer.", "kw": "critique avis projet risque avocat du diable relecture"}, {"id": 63, "cat": "entreprise", "lvl": 1, "t": "Trouver un nom, un slogan, une idée", "pitch": "Claude ne se fatigue pas. Il aligne quarante pistes, tu en gardes trois, il les creuse.", "steps": ["Décris ce que tu cherches à nommer et à qui ça s'adresse.", "Donne des exemples que tu aimes et que tu n'aimes pas.", "Demande beaucoup de propositions, classées par famille.", "Garde tes préférées et demande des variantes. Vérifie toi-même que le nom est libre (INPI, nom de domaine)."], "prompt": "Je cherche [un nom, un slogan, une idée d'offre] pour [quoi]. Cible : [clientèle]. J'aime ce genre : [exemples aimés]. Je n'aime pas : [exemples rejetés]. Propose quarante pistes classées en cinq familles de style différent, puis dis-moi tes cinq préférées et pourquoi.", "kw": "brainstorm marque nom slogan offre idées"}, {"id": 17, "cat": "entreprise", "lvl": 1, "t": "Travailler seul avec la force d'une équipe", "pitch": "Claude tient tour à tour les postes que tu n'as pas : commercial, juriste, graphiste, comptable.", "steps": ["Crée un projet et décris-y ton activité une fois pour toutes.", "Ouvre une conversation par rôle.", "Donne à chacun une mission précise et demande un livrable, pas un avis.", "Fais relire le travail de l'un par l'autre."], "prompt": "Tu es mon [rôle, par exemple directeur commercial] pour la semaine. Mon activité : [description]. Mon objectif : [objectif chiffré]. Propose un plan en cinq actions, rédige les messages à envoyer, et dis-moi ce que tu as besoin de savoir pour être plus précis.", "kw": "indépendant solo rôle assistant commercial stratégie"}, {"id": 10, "cat": "entreprise", "lvl": 1, "t": "Remplacer un abonnement par ton propre outil", "pitch": "Beaucoup de logiciels payés chaque mois font une seule chose simple. Claude peut te fabriquer cette chose.", "steps": ["Fais la liste de tes abonnements et note, pour chacun, la seule fonction que tu utilises vraiment.", "Choisis le plus simple et colle la consigne.", "Claude crée l'outil sous forme de page que tu ouvres quand tu veux.", "Utilise-le une semaine en parallèle avant de résilier."], "prompt": "Je paie [nom de l'outil] [prix] par mois et je m'en sers uniquement pour [fonction précise]. Fabrique-moi un outil qui fait exactement ça, rien de plus, sous forme de page que je peux rouvrir. Dis-moi honnêtement ce que je perds par rapport à l'original.", "note": "Pour un outil qui doit stocker beaucoup de données ou servir à plusieurs personnes, passe par Claude Code.", "kw": "économie logiciel abonnement résilier saas"}, {"id": 65, "cat": "entreprise", "lvl": 3, "t": "Créer une appli pour ton métier", "pitch": "Prise de commande, suivi de dépôts, étiquettes, tickets : Claude Code construit l'appli qui colle à ta façon de travailler.", "steps": ["Décris une journée type : qui fait quoi, dans quel ordre, avec quelles informations.", "Ouvre Claude Code dans un dossier vide et colle la consigne.", "Demande une maquette des écrans avant le vrai développement.", "Teste avec trois cas réels, fais corriger, puis demande comment l'installer sur ton téléphone ou ta tablette."], "prompt": "Je veux une appli pour [ton activité]. Voici comment je travaille aujourd'hui : [déroulé d'une journée]. L'appli doit permettre de [fonctions voulues]. Elle tournera sur [téléphone Android, tablette, ordinateur]. Montre-moi d'abord une maquette des écrans, pose-moi tes questions, puis construis-la étape par étape.", "note": "Commence par une seule fonction qui marche bien. Tu ajouteras le reste ensuite.", "kw": "application android logiciel sur mesure caisse tickets"}, {"id": 25, "cat": "entreprise", "lvl": 3, "t": "Refaire une appli payante pour ton usage", "pitch": "Une appli vendue cher fait parfois trois choses simples. Claude Code peut t'écrire un outil qui rend le même service.", "steps": ["Décris ce que l'appli fait pour toi, écran par écran, avec tes mots.", "Ouvre Claude Code et colle la consigne.", "Teste avec tes vraies données et fais corriger.", "Demande comment l'installer sur ton téléphone ou ton ordinateur."], "prompt": "Je veux un outil personnel qui me rend le même service que [type d'appli] : [fonctions utilisées]. Construis-le pour [ordinateur ou téléphone], avec une interface à toi. Commence par me montrer une maquette avant de tout coder.", "note": "Tu reproduis un service, pas un produit. Le nom, le logo, les écrans et le code de l'original restent protégés.", "kw": "alternative logiciel payant clone outil personnel"}, {"id": 30, "cat": "entreprise", "lvl": 3, "t": "Trouver une idée que personne n'a eue", "pitch": "Claude range des milliers d'idées existantes par ressemblance, comme sur une carte, puis cherche les zones vides. C'est là que se trouvent les idées neuves.", "steps": ["Rassemble une grande liste de ce qui existe déjà dans ton domaine.", "Dans Claude Code, colle la consigne avec cette liste.", "Regarde les zones vides qu'il identifie et demande dix idées pour chacune."], "prompt": "Voici une liste de [produits, services, jeux] existants avec leur description : [liste ou fichier]. Classe-les par ressemblance, montre-moi la carte obtenue, et repère les zones où il n'existe presque rien. Propose dix idées originales qui tombent dans ces zones, en expliquant pourquoi personne ne l'a fait.", "note": "Version rapide sans Claude Code : colle cinquante exemples dans une conversation et demande ce qui manque.", "kw": "innovation créneau marché concurrence nouveauté"}, {"id": 5, "cat": "maison", "lvl": 3, "t": "Accélérer ton Wi-Fi", "pitch": "Claude mesure ton réseau, trouve ce qui le freine et te dit quoi changer sur ta box.", "steps": ["Ouvre Claude Code sur un ordinateur connecté en Wi-Fi.", "Colle la consigne. Claude lance des mesures de débit et regarde les réseaux voisins.", "Applique ses réglages dans l'interface de ta box (canal, bande 5 GHz, emplacement).", "Demande une nouvelle mesure pour comparer avant et après."], "prompt": "Mon Wi-Fi est lent. Fais un diagnostic complet depuis cet ordinateur : débit réel, force du signal, canal utilisé, réseaux voisins qui gênent. Donne-moi ensuite la liste des réglages à changer sur ma box [modèle de box], du plus efficace au moins efficace, avec le chemin exact dans les menus.", "note": "Le gain dépend de ton point de départ. Si ta ligne elle-même est lente, aucun réglage ne la rendra rapide.", "kw": "internet box débit réseau lent connexion"}, {"id": 1, "cat": "maison", "lvl": 3, "t": "Supprimer les pubs sur la télé", "pitch": "Un petit boîtier branché sur ta box filtre les publicités pour tous les appareils de la maison, télé comprise.", "steps": ["Procure-toi un Raspberry Pi (environ 50 €) et branche-le sur ta box avec un câble réseau.", "Ouvre une session Claude Code sur ton ordinateur et colle la consigne.", "Claude te guide pour installer un filtre de pubs (Pi-hole ou AdGuard Home) puis pour régler ta box afin que tout le trafic passe par lui.", "Teste sur la télé. Si un service ne marche plus, dis-le à Claude, il ajoute une exception."], "prompt": "Je veux bloquer les publicités sur tous les appareils de ma maison, surtout ma télé connectée. J'ai un Raspberry Pi branché sur ma box. Guide-moi pas à pas pour installer un filtre de pubs réseau, en m'expliquant chaque commande avant de la lancer. Ma box est une [marque et modèle].", "note": "Ce filtre ne retire pas les pubs intégrées directement dans les vidéos YouTube.", "kw": "publicité télévision bloqueur raspberry pi-hole"}, {"id": 12, "cat": "maison", "lvl": 3, "t": "Piloter toute la maison depuis une seule appli", "pitch": "Lumières, volets, chauffage, caméras : chaque marque a son appli. Claude les réunit dans une seule.", "steps": ["Liste tous tes appareils connectés avec leur marque.", "Installe un centre de pilotage gratuit comme Home Assistant sur un Raspberry Pi, guidé par Claude Code.", "Demande à Claude de relier chaque appareil, un par un.", "Fais créer tes scénarios : « je pars », « je rentre », « bonne nuit »."], "prompt": "Voici mes appareils connectés : [liste avec les marques]. Je veux tout piloter depuis une seule appli. Guide-moi pour installer Home Assistant sur un Raspberry Pi, relie mes appareils un par un, puis crée un écran d'accueil simple avec trois boutons de scénario : départ, retour, nuit.", "kw": "domotique maison connectée lumières volets chauffage"}, {"id": 3, "cat": "maison", "lvl": 3, "t": "Refaire l'appli de ta clim, en mieux", "pitch": "L'appli du fabricant est lente ou mal faite ? Claude en écrit une à ton goût qui pilote le même appareil.", "steps": ["Note la marque et le modèle exact de ton appareil, et vérifie qu'il est connecté au Wi-Fi.", "Ouvre Claude Code et colle la consigne.", "Claude cherche comment l'appareil se pilote, puis te propose une petite appli avec seulement les boutons qui te servent.", "Teste chaque bouton un par un et fais corriger ce qui ne répond pas."], "prompt": "J'ai [type d'appareil, marque, modèle] connecté en Wi-Fi. L'appli officielle ne me plaît pas. Cherche comment cet appareil se pilote sur mon réseau, puis construis-moi une appli très simple avec : [les fonctions dont tu te sers].", "note": "Tous les appareils ne se laissent pas piloter. Claude te le dira après ses premières recherches.", "kw": "climatiseur chauffage appareil connecté télécommande"}, {"id": 8, "cat": "maison", "lvl": 3, "t": "Recycler une vieille tablette en tableau de bord", "pitch": "La tablette qui dort dans un tiroir devient un écran mural : heure, météo, agenda, lumières.", "steps": ["Liste ce que tu veux voir sur l'écran et les appareils connectés que tu possèdes.", "Demande à Claude Code de créer une page web plein écran avec ces blocs.", "Ouvre l'adresse de la page sur la tablette et ajoute-la à l'écran d'accueil.", "Fixe la tablette au mur avec son chargeur."], "prompt": "Crée une page web plein écran pour une vieille tablette accrochée au mur. Elle doit afficher : l'heure, la météo de [ville], mes rendez-vous du jour, et des gros boutons pour [lumières, chauffage]. Lisible à trois mètres, compatible avec un ancien navigateur.", "note": "Sans domotique, la version horloge, météo et agenda se fait en dix minutes avec une simple page.", "kw": "ipad tablette écran mural horloge météo"}, {"id": 9, "cat": "maison", "lvl": 3, "t": "Perdre un tic grâce à ta webcam", "pitch": "La webcam repère le geste que tu veux arrêter (te ronger les ongles, te toucher le visage) et te prévient par un son.", "steps": ["Ouvre Claude Code et colle la consigne en décrivant ton geste.", "Autorise la webcam quand le programme démarre.", "Règle la sensibilité avec Claude jusqu'à ce qu'il sonne au bon moment, ni trop ni trop peu."], "prompt": "Écris un petit programme qui utilise ma webcam pour détecter quand [le geste à repérer]. À chaque fois, joue un bip discret et compte le nombre de fois dans la journée. Tout doit rester sur mon ordinateur, aucune image envoyée ailleurs.", "note": "Demande toujours que les images restent sur ta machine.", "kw": "habitude ongles posture caméra détection"}, {"id": 4, "cat": "maison", "lvl": 3, "t": "Personnaliser ta liseuse", "pitch": "Certaines liseuses peuvent être modifiées pour changer l'écran de veille, les polices ou le lecteur. Claude vérifie d'abord si la tienne s'y prête.", "steps": ["Relève le modèle et la version du logiciel dans les réglages de ta liseuse.", "Demande à Claude si la modification est possible sur cette version précise, et quels sont les risques.", "Si tu décides d'y aller, sauvegarde tes livres d'abord et suis les étapes une par une avec Claude Code."], "prompt": "J'ai une liseuse [marque et modèle], version logicielle [numéro]. Je veux savoir si je peux la personnaliser (écran de veille, polices, lecteur alternatif). Dis-moi d'abord si c'est faisable sur cette version, ce que je risque, et ce que je perds côté garantie. N'entame rien avant mon accord.", "note": "Tu peux bloquer définitivement l'appareil et tu perds la garantie. À faire seulement sur une liseuse qui t'appartient et que tu acceptes de sacrifier.", "kw": "kindle kobo liseuse ebook modifier"}, {"id": 7, "cat": "maison", "lvl": 3, "t": "Programmer la ronde d'un drone", "pitch": "Un drone qui suit un parcours autour de ton terrain, prend des photos et signale ce qui bouge.", "steps": ["Vérifie que ton modèle accepte d'être piloté par programme. Tous ne le permettent pas.", "Demande à Claude Code d'écrire le programme de ronde et l'analyse des images.", "Fais les premiers essais sur terrain dégagé, à basse altitude."], "prompt": "J'ai un drone [marque et modèle]. Dis-moi s'il peut être piloté par un programme. Si oui, écris un programme qui lui fait suivre un parcours défini autour de mon terrain, prend une photo à chaque point, et m'alerte si une personne apparaît sur une image.", "note": "En France, le vol de drone est très encadré : pas de survol de la voie publique ni des voisins, zones interdites en ville. Vérifie sur Géoportail avant de décoller.", "kw": "drone dji surveillance terrain photo aérienne"}, {"id": 28, "cat": "maison", "lvl": 3, "t": "Comprendre un vieux programme sans mode d'emploi", "pitch": "Un ancien logiciel que plus personne ne maintient : Claude Code l'analyse, explique ce qu'il fait et t'aide à récupérer tes données.", "steps": ["Mets le programme ou ses fichiers dans un dossier.", "Ouvre Claude Code sur ce dossier et colle la consigne.", "Demande un mode d'emploi écrit de ce qu'il a compris."], "prompt": "Ce dossier contient un ancien programme que j'utilise et dont je n'ai plus la documentation. Analyse-le et explique-moi ce qu'il fait, quels fichiers il lit et écrit, et comment récupérer mes données dans un format moderne.", "note": "Reste sur des programmes qui t'appartiennent ou qui sont libres. Démonter un logiciel du commerce est interdit par la plupart des licences.", "kw": "ancien logiciel données récupération migration"}, {"id": 69, "cat": "securite", "lvl": 1, "t": "Reconnaître une arnaque", "pitch": "Un mail de ta banque, un SMS de livraison, une offre trop belle : Claude repère les signes d'une tentative d'escroquerie.", "steps": ["Ne clique sur aucun lien du message.", "Fais une capture d'écran ou copie le texte, avec l'adresse de l'expéditeur.", "Colle le tout dans Claude avec la consigne.", "En cas de doute, contacte l'organisme par son numéro habituel, jamais par celui du message."], "prompt": "J'ai reçu ce message. Dis-moi s'il s'agit probablement d'une arnaque. Examine l'adresse de l'expéditeur, les liens, le ton, les fautes, l'urgence demandée. Donne ton avis en une phrase, puis les indices qui t'y mènent, et ce que je dois faire maintenant. Le message : [colle le message]", "note": "Si tu as déjà cliqué ou donné des informations, appelle ta banque tout de suite et change tes mots de passe.", "kw": "phishing hameçonnage fraude sms faux mail escroquerie"}, {"id": 13, "cat": "securite", "lvl": 3, "t": "Trouver ce qui ralentit ou infecte ton ordinateur", "pitch": "Claude Code passe en revue ce qui tourne sur ta machine et débusque les programmes indésirables, y compris ceux qui se cachent.", "steps": ["Ouvre Claude Code sur l'ordinateur qui pose problème.", "Colle la consigne. Claude regarde les programmes actifs, ceux qui se lancent au démarrage et ce qui consomme le plus.", "Lis son rapport avant de supprimer quoi que ce soit.", "Valide les suppressions une par une."], "prompt": "Mon ordinateur chauffe et rame sans raison. Fais un contrôle complet : programmes qui tournent en ce moment, ceux qui démarrent tout seuls, ce qui consomme le processeur et le réseau. Signale-moi tout ce qui est suspect ou inconnu, explique pourquoi, et ne supprime rien sans mon accord.", "note": "Claude aide au diagnostic. Garde un antivirus à jour à côté.", "kw": "virus lent ordinateur malware nettoyage mac windows"}, {"id": 14, "cat": "securite", "lvl": 3, "t": "Nettoyer un appareil Android bavard", "pitch": "Autoradio, box télé, tablette bon marché : certains appareils envoient des données sans prévenir. Claude Code trouve les applis en cause.", "steps": ["Branche l'appareil à ton ordinateur avec un câble USB et active le mode développeur.", "Demande à Claude Code de lister les applis installées et leurs autorisations.", "Fais retirer ou désactiver celles qui n'ont rien à faire là.", "Pour un téléphone, l'outil gratuit MVT d'Amnesty International recherche les logiciels espions connus. Claude peut le faire tourner pour toi."], "prompt": "J'ai branché un appareil Android [type et marque] en USB. Liste toutes les applis installées, y compris celles du fabricant, avec leurs autorisations et les serveurs qu'elles contactent. Classe-les en trois groupes : normales, inutiles, suspectes. Propose quoi désactiver, sans rien toucher avant mon accord.", "kw": "android espion données applis autorisations téléphone"}, {"id": 15, "cat": "securite", "lvl": 3, "t": "Inspecter le réseau d'une location de vacances", "pitch": "En voyage, Claude Code liste les appareils connectés au Wi-Fi du logement et repère ceux qui ressemblent à une caméra.", "steps": ["Connecte ton ordinateur au Wi-Fi du logement.", "Ouvre Claude Code et colle la consigne.", "Regarde la liste. Tout appareil identifié comme caméra mérite une question à l'hôte."], "prompt": "Je suis dans une location de vacances. Liste tous les appareils connectés à ce réseau Wi-Fi, avec leur fabricant et leur type probable. Signale ceux qui pourraient être une caméra ou un micro.", "note": "Une caméra qui enregistre sans Wi-Fi n'apparaîtra pas. C'est un contrôle utile, pas une garantie. Fais aussi le tour de la pièce avec la lampe du téléphone.", "kw": "hôtel airbnb caméra cachée wifi voyage"}, {"id": 60, "cat": "quotidien", "lvl": 1, "t": "Organiser un voyage", "pitch": "Claude bâtit l'itinéraire jour par jour, avec les distances, la météo et ce qui vaut le détour.", "steps": ["Donne les dates, la destination, qui voyage et ton budget.", "Dis ce que tu aimes et ce que tu fuis : musées, plages, marche, foule.", "Claude propose un programme jour par jour avec une carte.", "Fais ajuster le rythme, puis demande la liste de ce qu'il faut réserver à l'avance."], "prompt": "Organise [nombre] jours à [destination], [dates], pour [qui voyage]. Budget : [montant] hors transport. On aime [ce que vous aimez], on évite [ce que vous fuyez]. Propose un programme jour par jour sans courir, avec les temps de trajet, une adresse pour déjeuner, et ce qu'il faut réserver dès maintenant.", "note": "Vérifie toi-même horaires et prix avant de réserver : ils changent vite.", "kw": "vacances itinéraire week-end séjour programme"}, {"id": 67, "cat": "quotidien", "lvl": 1, "t": "Cuisiner avec ce qu'il y a dans le frigo", "pitch": "Une photo du frigo ouvert, et Claude propose trois repas faisables tout de suite.", "steps": ["Prends en photo l'intérieur du frigo et du placard.", "Joins les photos et dis pour combien de personnes tu cuisines.", "Choisis une recette. Claude ajuste les quantités.", "Demande la liste de courses pour compléter la semaine."], "prompt": "Voici ce que j'ai dans mon frigo et mes placards. Propose trois plats pour [nombre] personnes, prêts en moins de [30] minutes, sans rien acheter. Pour celui que je choisis, donne la recette pas à pas avec les quantités.", "note": "Précise toujours les allergies et les régimes des convives.", "kw": "recette repas cuisine dîner courses"}, {"id": 24, "cat": "quotidien", "lvl": 1, "t": "Remonter ton arbre généalogique", "pitch": "Les archives d'état civil sont en ligne et gratuites. Claude sait où chercher et comment lire les actes anciens.", "steps": ["Note ce que tu sais : noms, dates et lieux de naissance de tes grands-parents.", "Colle la consigne. Si ton forfait l'inclut, active la recherche approfondie (bouton +, puis Recherche).", "Quand Claude t'indique un registre, ouvre-le, fais une capture de l'acte et renvoie-la-lui. Il déchiffre l'écriture.", "Répète génération après génération et demande l'arbre en image à la fin."], "prompt": "Je veux remonter mon arbre généalogique. Point de départ : [nom, date et lieu de naissance d'un grand-parent]. Dis-moi sur quel site d'archives chercher l'acte, dans quel registre et à quelle page probable. Je t'enverrai des photos des actes, tu les liras et tu me diras où chercher la génération d'avant.", "note": "Les actes de moins de 75 ans ne sont en général pas consultables en ligne. Pour une branche étrangère, les archives du pays concerné fonctionnent autrement et Claude t'orientera.", "kw": "famille ancêtres archives état civil généalogie"}, {"id": 16, "cat": "quotidien", "lvl": 1, "t": "Faire le tour d'un dossier médical complexe", "pitch": "Claude lit tes comptes rendus, explique le diagnostic avec des mots simples et prépare tes questions pour le médecin.", "steps": ["Rassemble les comptes rendus et anal
