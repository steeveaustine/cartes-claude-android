<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><style>:root{color-scheme:light}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head><body>
<title>Claude en main</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
@font-face{font-family:"Bricolage Grotesque";src:url("fonts/bricolage.woff2") format("woff2"),url("fonts/bricolage.ttf") format("truetype");font-weight:200 800;font-display:swap}
@font-face{font-family:"Instrument Sans";src:url("fonts/instrument.woff2") format("woff2"),url("fonts/instrument.ttf") format("truetype");font-weight:400 700;font-display:swap}
@font-face{font-family:"Caveat";src:url("fonts/caveat.woff2") format("woff2"),url("fonts/caveat.ttf") format("truetype");font-weight:400 700;font-display:swap}
</style>
<style>
/* Layout : catalogue d'idées illustrées. Accueil = grille de fiches avec croquis ; tuto = lecture pas à pas.
   Barre d'onglets en bas sur téléphone, rail à gauche sur grand écran. Croquis au crayon sur papier quadrillé. */
:root{
  --bg:#EEF0F3; --surface:#FFFFFF; --sunken:#E3E6EB; --ink:#14181F; --muted:#586172; --line:#D5DAE1;
  --accent:#D4212B; --accent-ink:#B8141E; --on-accent:#FFFFFF; --accent-soft:#FBE7E8;
  --steel:#BCC3CD; --steel-lo:#8A94A2;
  --ok:#1B7F52; --on-ok:#FFFFFF; --ok-soft:#DFF3E9; --warn:#8F5508; --warn-soft:#FBF0DC;
  --paper:#F7FAFD; --grid:#DDE7F3; --graphite:#2A3140; --pen:#1F4FB8; --sk-red:#D4212B; --blob:#E3EBF6; --blob-hot:#FAD5D8;
  --term:#151A22; --term-ink:#E8ECF2; --term-dim:#8C97A8;
  --display:"Bricolage Grotesque","Inter",system-ui,sans-serif;
  --body:"Instrument Sans","Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --hand:"Caveat","Segoe Print","Bradley Hand",cursive;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,"Roboto Mono",monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#12171E; --surface:#1B222C; --sunken:#0D1117; --ink:#EEF1F5; --muted:#A0AAB9; --line:#2D3643;
  --accent:#D62B35; --accent-ink:#FF8A90; --on-accent:#FFFFFF; --accent-soft:#3A1C21;
  --steel:#77828F; --steel-lo:#5F6A78;
  --ok:#5BD19A; --on-ok:#0C1016; --ok-soft:#163526; --warn:#F0B55C; --warn-soft:#3A2B10;
  --paper:#161D27; --grid:#222C3A; --graphite:#D5DCE6; --pen:#93B6FF; --sk-red:#FF6C74; --blob:#212B3A; --blob-hot:#3D1F26;
  --term:#0B0F14; --term-ink:#E8ECF2; --term-dim:#7D889A; color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#12171E; --surface:#1B222C; --sunken:#0D1117; --ink:#EEF1F5; --muted:#A0AAB9; --line:#2D3643;
  --accent:#D62B35; --accent-ink:#FF8A90; --on-accent:#FFFFFF; --accent-soft:#3A1C21;
  --steel:#77828F; --steel-lo:#5F6A78;
  --ok:#5BD19A; --on-ok:#0C1016; --ok-soft:#163526; --warn:#F0B55C; --warn-soft:#3A2B10;
  --paper:#161D27; --grid:#222C3A; --graphite:#D5DCE6; --pen:#93B6FF; --sk-red:#FF6C74; --blob:#212B3A; --blob-hot:#3D1F26;
  --term:#0B0F14; --term-ink:#E8ECF2; --term-dim:#7D889A; color-scheme:dark }

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--display);margin:0;line-height:1.12;text-wrap:balance;letter-spacing:-.015em}
h1{font-size:clamp(1.85rem,6vw,2.6rem);font-weight:800}
h2{font-size:1.28rem;font-weight:700}
h3{font-size:1.08rem;font-weight:700;letter-spacing:-.005em}
p{margin:0}
a{color:inherit}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent-ink);outline-offset:2px}
.ic{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.ic.on{fill:currentColor}
.ic.sm{width:18px;height:18px}

/* ossature */
main{max-width:1060px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px 108px;display:flex;flex-direction:column;gap:26px;outline:none}
main > *{animation:rise .24s ease}
@keyframes rise{from{transform:translateY(8px)}}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;background:var(--surface);border-top:1px solid var(--line);padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
.brand{display:none}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 4px;border-radius:12px;color:var(--muted);font-size:.74rem;font-weight:600;text-decoration:none}
.tab[aria-current="page"]{color:var(--accent-ink)}
@media (min-width:960px){
  .shell{display:grid;grid-template-columns:228px minmax(0,1fr)}
  .nav{position:sticky;top:0;bottom:auto;align-self:start;height:100vh;flex-direction:column;gap:4px;border-top:0;border-right:1px solid var(--line);padding:24px 14px}
  .brand{display:flex;align-items:center;gap:10px;font-family:var(--display);font-weight:800;font-size:1.15rem;text-decoration:none;padding:4px 10px 22px}
  .tab{flex:none;flex-direction:row;gap:12px;padding:11px 12px;font-size:.96rem}
  .tab[aria-current="page"]{background:var(--accent-soft)}
  main{padding-block:38px 72px}
  .brandline{display:none!important}
}
.stack{display:flex;flex-direction:column;gap:12px;min-width:0}
.sec-h{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.sec-h .count{font-size:.88rem;font-weight:600;color:var(--muted)}
.lede{color:var(--muted);font-size:1.06rem;max-width:60ch}
.label{font-size:.76rem;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;gap:6px}
.hint{color:var(--muted);font-size:.9rem}
.brandline{display:flex;align-items:center;gap:8px;font-family:var(--display);font-weight:800;font-size:1.05rem}

/* accueil */
.hero{display:flex;flex-direction:column;gap:12px}
.search{display:flex;align-items:center;gap:10px;background:var(--surface);border:1.5px solid var(--line);border-radius:16px;padding:0 16px;height:54px;color:var(--muted)}
.search:focus-within{border-color:var(--accent)}
.search input{flex:1;min-width:0;border:0;background:transparent;outline:0;height:100%;color:var(--ink);font-size:1.02rem}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 13px;font-size:.88rem;font-weight:500;white-space:nowrap;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.pre-chips .chip{white-space:normal;text-align:left;line-height:1.35}
.chip.sep{border:0;background:none;padding:0 2px;width:1px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
@media (min-width:620px){.grid{grid-template-columns:repeat(auto-fill,minmax(188px,1fr));gap:14px}}
.card{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:18px;overflow:hidden;display:flex;flex-direction:column;text-decoration:none;min-width:0;transition:transform .15s,border-color .15s}
.card:hover{transform:translateY(-2px);border-color:var(--accent)}
.thumb{position:relative;display:block;aspect-ratio:4/3;border-bottom:1px solid var(--line)}
.thumb svg{width:100%;height:100%;display:block}
.paper{background-color:var(--paper);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:16px 16px;background-position:-1px -1px}
.ct{display:flex;flex-direction:column;gap:6px;padding:11px 12px 13px;min-width:0}
.ct b{font-weight:600;font-size:.95rem;line-height:1.3}
.meta{display:flex;align-items:center;gap:7px;color:var(--muted);font-size:.8rem}
.cdone,.cfav{position:absolute;top:8px;right:8px;width:26px;height:26px;border-radius:50%;display:grid;place-items:center}
.cdone{background:var(--ok);color:var(--on-ok)}
.cdone .ic{width:15px;height:15px;stroke-width:2.6}
.cfav{background:var(--surface);color:var(--warn);border:1px solid var(--line)}
.cfav .ic{width:15px;height:15px}
.cprog{position:absolute;left:0;right:0;top:0;height:4px;background:transparent}
.cprog i{display:block;height:100%;background:var(--accent)}
.bars{display:inline-flex;align-items:flex-end;gap:2px;height:13px;flex:none}
.bars i{width:4px;border-radius:1px;background:var(--steel)}
.bars i:nth-child(1){height:5px}.bars i:nth-child(2){height:9px}.bars i:nth-child(3){height:13px}
.b1 i:nth-child(-n+1),.b2 i:nth-child(-n+2),.b3 i:nth-child(-n+3){background:var(--accent)}
.empty{color:var(--muted);padding:24px 0;text-align:center}
.about{color:var(--muted);font-size:.84rem;max-width:70ch}

/* boutons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 16px;border-radius:13px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-weight:600;text-decoration:none;white-space:nowrap}
.btn.sm{min-height:38px;padding:0 13px;font-size:.9rem;border-radius:11px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.ok{background:var(--ok);border-color:var(--ok);color:var(--on-ok)}
.btn:active{transform:scale(.98)}
.back{display:inline-flex;align-items:center;gap:6px;color:var(--muted);text-decoration:none;font-weight:600;font-size:.92rem;align-self:flex-start}
.actions{display:flex;flex-wrap:wrap;gap:10px}

/* croquis */
.skc{margin:0;border-radius:20px;border:1px solid var(--line);overflow:hidden;display:flex;flex-direction:column}
.skc .label{padding:12px 16px 0}
.skc svg{display:block;width:100%;height:auto}
.skc.sm{max-width:560px;border-radius:16px}
.skv .ink *{fill:none;stroke:var(--graphite);stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.skv .ink .f{fill:var(--graphite);stroke:none}
.skv .ink .r{fill:var(--sk-red);stroke:var(--sk-red)}
.skv .ink .rs{stroke:var(--sk-red)}
.skv .ink .ed{stroke-width:2.2}
.skv .ink .ed.red{stroke:var(--sk-red)}
.skv .ink .dash{stroke-dasharray:7 7}
.skv .ink .xx{stroke:var(--sk-red);stroke-width:4}
.skv .ink .hl{stroke:var(--sk-red);stroke-width:2.6}
.skv .bl{fill:var(--blob)}
.skv .bl.hot{fill:var(--blob-hot)}
.skv text{font-family:var(--hand);fill:var(--pen);font-weight:600}
.skv .nl{font-size:23px}
.skv .el{font-size:20px;fill:var(--sk-red)}
.skv .sl{font-size:25px;fill:var(--graphite)}
.skv .sl.hot{fill:var(--sk-red)}
.skv .tx{font-size:26px;fill:var(--sk-red);font-weight:700}

/* tuto */
.read{display:flex;flex-direction:column;gap:26px;max-width:780px;width:100%;margin:0 auto}
.th{display:flex;flex-direction:column;gap:12px}
.badges{display:flex;flex-wrap:wrap;gap:8px}
.badge{display:inline-flex;align-items:center;gap:7px;padding:5px 11px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-size:.8rem;font-weight:600}
.badge.vid{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.badge.ok{background:var(--ok-soft);border-color:transparent;color:var(--ok)}
.facts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:0}
.facts div{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:11px 13px;min-width:0}
.facts dt{font-size:.72rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.facts dd{margin:3px 0 0;font-weight:600;font-size:.95rem;line-height:1.3}
.story{background:var(--ink);color:var(--bg);border-radius:20px;padding:18px 20px;display:flex;flex-direction:column;gap:8px}
.story .label{color:inherit;opacity:.75}
.story p:last-child{font-size:1.02rem;line-height:1.6}
.prose{font-size:1.04rem;line-height:1.65;max-width:64ch}
.need{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.nd{width:100%;display:flex;gap:12px;align-items:flex-start;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;line-height:1.45}
.box{width:24px;height:24px;border-radius:7px;border:1.5px solid var(--steel-lo);display:grid;place-items:center;flex:none;color:transparent}
.box .ic{width:15px;height:15px;stroke-width:2.8}
.nd[aria-pressed="true"]{background:var(--ok-soft);border-color:transparent}
.nd[aria-pressed="true"] .box{background:var(--ok);border-color:var(--ok);color:var(--on-ok)}
.pbar{height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.pbar i{display:block;height:100%;width:0;background:var(--accent);border-radius:99px;transition:width .35s}
.stps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:14px}
.stp{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.stp-h{display:flex;gap:12px;align-items:center}
.num{width:34px;height:34px;border-radius:50%;background:var(--ink);color:var(--bg);display:grid;place-items:center;font-family:var(--display);font-weight:800;flex:none;font-variant-numeric:tabular-nums}
.num .ic{width:17px;height:17px;stroke-width:2.8}
.stp.done .num{background:var(--ok);color:var(--on-ok)}
.stp-b{display:flex;flex-direction:column;gap:12px;min-width:0}
.stp-b > p{line-height:1.62}
.done-btn{align-self:flex-start;display:inline-flex;align-items:center;gap:7px;border:1px dashed var(--steel-lo);background:none;border-radius:10px;padding:7px 12px;font-size:.87rem;font-weight:600;color:var(--muted)}
.done-btn[aria-pressed="true"]{border-style:solid;border-color:var(--ok);color:var(--ok);background:var(--ok-soft)}

/* fenêtres de consigne */
.pw{border-radius:16px;border:1px solid var(--line);overflow:hidden;background:var(--bg);min-width:0}
.pw-bar{display:flex;align-items:center;gap:9px;padding:9px 12px;background:var(--sunken);font-size:.82rem;min-width:0}
.pw-bar b{font-weight:700;white-space:nowrap}
.pw-bar span:last-child{color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.dots{display:inline-flex;gap:5px;flex:none}
.dots i{width:9px;height:9px;border-radius:50%;background:var(--steel)}
.dots i:first-child{background:var(--accent)}
.pw-body{display:flex;gap:10px;padding:14px;align-items:flex-start}
.pw-text{white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.6;font-size:.98rem;flex:1;min-width:0}
.pw-text mark{background:var(--accent-soft);color:var(--accent-ink);border-radius:5px;padding:0 4px;font-weight:600}
.pw-text .ph{border-bottom:2px dashed var(--steel-lo);color:var(--muted)}
.caret,.plus{flex:none;font-weight:700;color:var(--accent);font-family:var(--mono)}
.plus{width:24px;height:24px;border-radius:50%;border:1.5px solid var(--steel-lo);color:var(--muted);display:grid;place-items:center;font-family:var(--body);line-height:1}
.pw-code{background:var(--term);border-color:var(--term)}
.pw-code .pw-bar{background:#232A35;color:var(--term-ink)}
.pw-code .pw-bar span:last-child{color:var(--term-dim)}
.pw-code .pw-text{color:var(--term-ink);font-family:var(--mono);font-size:.88rem;line-height:1.65}
.pw-code .pw-text .ph{color:var(--term-dim);border-color:var(--term-dim)}
.pw-code .pw-text mark{background:#4A2328;color:#FFB3B8}
.pw-code .pw-act{border-color:#2A323E}
.pw-code .pw-act .btn:not(.primary){background:#232A35;border-color:#2F3846;color:var(--term-ink)}
.pw-code .pw-fields{background:#1B212B;border-color:#2A323E}
.pw-code .pw-fields .label{color:var(--term-dim)}
.pw-code .field input,.pw-code .field textarea{background:var(--term);border-color:#2F3846;color:var(--term-ink)}
.pw-act{display:flex;flex-wrap:wrap;gap:8px;padding:0 14px 14px}
.pw-fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;padding:14px;border-top:1px solid var(--line);background:var(--surface)}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field input,.field textarea{width:100%;border:1.5px solid var(--line);border-radius:11px;background:var(--bg);padding:10px 11px;min-height:44px;resize:vertical}
.field input:focus,.field textarea:focus{outline:0;border-color:var(--accent)}
.cmd{border-radius:14px;background:var(--term);color:var(--term-ink);overflow:hidden}
.cmd-bar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:7px 8px 7px 13px;font-size:.78rem;color:var(--term-dim);font-weight:600}
.cmd-bar button{border:0;background:#232A35;color:var(--term-ink);border-radius:8px;padding:5px 10px;font-size:.8rem;font-weight:600}
.cmd pre{margin:0;padding:2px 14px 13px;font-family:var(--mono);font-size:.84rem;line-height:1.6;overflow-x:auto;white-space:pre}

/* aide */
.qa{display:flex;flex-direction:column;gap:8px}
.qa details{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:0 14px}
.qa summary{cursor:pointer;font-weight:600;padding:13px 0;list-style:none;display:flex;justify-content:space-between;gap:10px;align-items:center}
.qa summary::-webkit-details-marker{display:none}
.qa details[open] summary .ic{transform:rotate(90deg)}
.qa details p{padding:0 0 14px;color:var(--muted);line-height:1.55}
.more{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.more li{display:flex;gap:10px;align-items:flex-start;line-height:1.5}
.more li .ic{color:var(--accent);margin-top:2px}
.note{background:var(--warn-soft);border-radius:16px;padding:14px 16px;line-height:1.55}
.note b{color:var(--warn)}
.pager{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pg{display:flex;flex-direction:column;gap:4px;padding:13px 14px;border-radius:16px;border:1px solid var(--line);background:var(--surface);text-decoration:none;min-width:0}
.pg span{font-size:.76rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;gap:4px}
.pg b{font-weight:600;line-height:1.3;font-size:.94rem}
.pg.nx{text-align:right;align-items:flex-end;grid-column:2}
.lv3{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}
.lv3 div{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:8px}
.lv3 h3{display:flex;align-items:center;gap:9px}
.lv3 p{color:var(--muted);font-size:.93rem;line-height:1.5}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-weight:600;font-size:.92rem;z-index:40;max-width:calc(100% - 32px);text-align:center}
@media (min-width:960px){.toast{bottom:28px}}
@media (prefers-reduced-motion: reduce){ *,*::before,*::after{animation:none!important;transition:none!important} }
</style>
<script>try{if(window.Android&&Android.isNight)document.documentElement.setAttribute("data-theme",Android.isNight()?"dark":"light")}catch(e){}</script>

<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <filter id="rough" x="-5%" y="-5%" width="110%" height="110%"><feTurbulence type="fractalNoise" baseFrequency="0.032" numOctaves="2" seed="4"/><feDisplacementMap in="SourceGraphic" scale="2.6" xChannelSelector="R" yChannelSelector="G"/></filter>
</defs></svg>
<div class="shell">
  <nav class="nav" id="nav" aria-label="Navigation principale"></nav>
  <main id="view" tabindex="-1"></main>
</div>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

<script>
const DATA = {"levels": [{"id": 1, "name": "Sans rien installer", "setup": "Le site claude.ai ou l'appli Claude sur ton téléphone suffisent. Tu écris, tu joins tes fichiers avec le bouton +, tu lis la réponse. La plupart de ces idées marchent avec le compte gratuit."}, {"id": 2, "name": "Sur ordinateur", "setup": "Il faut l'appli Claude pour ordinateur ou l'extension Chrome, et un abonnement payant. Claude accède alors à tes dossiers, à tes logiciels ou à ton navigateur."}, {"id": 3, "name": "Claude Code", "setup": "Claude écrit et lance des programmes pour toi, depuis l'onglet Code de l'appli pour ordinateur, avec un abonnement payant. Pas besoin de savoir coder : tu décris, il construit, tu valides chaque action."}], "tutos": [{"id": "tele", "src": "v", "ico": "tv", "t": "Débarrasser ta télé de ses pubs et en faire un écran utile", "pitch": "Claude Code se branche sur ta télé Android, coupe les applis inutiles et les pubs de l'accueil, puis installe un écran de veille maison avec l'heure, l'agenda et la météo.", "story": "Une personne donne à Claude la fiche d'une télé bourrée de publicités et lui demande de la nettoyer. Claude retire les logiciels superflus et remplace l'interface par un écran de veille sobre, avec calendrier et météo. Quelqu'un d'autre a refait la même chose sur la télé de ses parents.", "lvl": 3, "diff": "Moyen", "time": "1 à 2 h", "cost": "Gratuit", "pre": ["s-code", "s-adb"], "sk": {"n": [["term", "Claude Code\nsur ton ordi", 0, 0], ["tv", "Ta télé Android", 2, 0], ["trash", "Pubs et applis\ndésactivées", 1, 1], ["calendar", "Veille : heure,\nagenda, météo", 3, 1, "hi"]], "e": [[0, 1, "ADB par le Wi-Fi", "d"], [1, 2, "", ""], [1, 3, "", ""]]}, "res": "Une télé qui démarre sur un accueil propre, sans bandeau publicitaire, et qui affiche en veille l'heure, tes rendez-vous du jour et la météo au lieu de diaporamas de pub.", "need": ["Une télé sous Android TV ou Google TV (Sony, Philips, TCL, Hisense, Xiaomi…), ou un boîtier Chromecast avec Google TV", "Un ordinateur sur le même Wi-Fi, avec Claude Code", "La marque et le modèle exact de la télé", "Une bonne heure devant toi"], "steps": [{"h": "Vérifie que ta télé s'y prête", "p": ["Ce tuto marche avec Android TV et Google TV. Va dans Paramètres, Système, À propos : si tu lis « Android TV OS », c'est bon.", "Les Samsung (Tizen) et les LG (webOS) ne s'ouvrent pas de cette façon. Pour elles, le plus simple est de brancher un boîtier Google TV et de faire le tuto dessus."]}, {"h": "Active le mode développeur", "p": ["Dans Paramètres, Système, À propos, descends jusqu'à « Build » et clique dessus sept fois de suite avec la télécommande. Un message annonce que tu es développeur.", "Reviens en arrière : un menu « Options pour les développeurs » est apparu. Active « Débogage USB » et, s'il existe, « Débogage réseau »."], "fig": {"scr": "tv", "l": ["Paramètres", "Système", "À propos", "Build   ← 7 clics"], "hl": 3}}, {"h": "Note l'adresse de la télé", "p": "Dans Paramètres, Réseau, ouvre ta connexion Wi-Fi. L'adresse IP ressemble à 192.168.1.42. Garde-la sous la main."}, {"h": "Laisse Claude faire l'inventaire", "p": "Ouvre Claude Code dans un dossier vide et colle la consigne. Claude se connecte : sur la télé, une fenêtre demande l'autorisation, choisis « Toujours autoriser ». Il liste ensuite tout ce qui est installé, sans rien toucher.", "cmd": "adb connect 192.168.1.42:5555\nadb shell pm list packages", "pr": "Ma télé est une [marque et modèle] sous Android TV, à l'adresse [adresse IP], débogage activé. Connecte-toi avec ADB. Liste toutes les applis installées et classe-les en trois groupes : indispensables au système, utiles pour moi, pubs et logiciels superflus. Je regarde [Netflix, YouTube, la TNT] : garde ce qu'il faut pour ça. Ne désactive rien avant mon feu vert, et utilise uniquement la désactivation réversible, jamais la suppression."}, {"h": "Valide le grand ménage", "p": "Relis la liste des superflus et retire ce que tu veux garder. Claude désactive le reste. Une appli désactivée ne tourne plus et disparaît de l'accueil, mais revient d'une seule commande. Redémarre la télé pour vérifier que tout marche.", "cmd": "adb shell pm disable-user --user 0 nom.de.l.appli"}, {"h": "Remplace l'accueil plein de pubs", "p": "Les pubs de l'écran d'accueil viennent du lanceur d'origine. Demande à Claude d'installer un lanceur sans publicité, comme Projectivy Launcher depuis le Play Store, et de le régler comme accueil par défaut."}, {"h": "Fabrique ton écran de veille", "p": "C'est la partie la plus sympa. Claude écrit une petite appli d'écran de veille, l'installe et la règle comme veille par défaut.", "cmd": "adb shell settings put secure screensaver_components mon.ecran/.Veille", "pr": "Crée une application d'écran de veille pour Android TV qui affiche en grand l'heure, la date, la météo de [ta ville] et mes rendez-vous du jour depuis [Google Agenda ou un lien de calendrier]. Style sobre, fond sombre, lisible à quatre mètres, aucune publicité. Installe-la sur la télé et règle-la comme écran de veille par défaut. Explique-moi comment revenir à l'écran de veille d'origine."}], "trouble": [["La télé refuse la connexion", "Vérifie que l'ordinateur et la télé sont sur le même Wi-Fi et que le débogage réseau est activé. Regarde l'écran de la télé : une fenêtre attend souvent ton autorisation."], ["Une appli utile a disparu", "Demande à Claude de la réactiver : les applis désactivées ne sont pas supprimées."], ["Les pubs reviennent après une mise à jour", "Les mises à jour du fabricant réactivent parfois des applis. Garde le dossier de Claude Code et redemande-lui le ménage."]], "more": ["Faire pareil sur la télé de tes parents, avec leur accord.", "Ajouter à l'écran de veille le prochain bus, des photos de famille ou le chiffre du jour de ta boutique.", "Couper aussi les applis qui envoient tes habitudes de visionnage au fabricant."], "warn": "Désactive, ne supprime jamais. Une appli système supprimée peut empêcher la télé de démarrer. Avec la désactivation, tout reste réversible.", "kw": "télévision publicité bloatware android tv google tv adb écran de veille lanceur"}, {"id": "dictee", "src": "v", "ico": "mic", "t": "Fabriquer ton propre micro de dictée", "pitch": "Un petit boîtier avec un bouton : tu appuies, tu parles, et ton texte s'écrit tout seul sur l'ordinateur, propre et ponctué. Claude choisit les pièces, dessine le circuit, écrit le programme et le boîtier à imprimer.", "story": "La vidéo montre un micro de dictée construit de zéro. Claude a choisi les composants, conçu le circuit, écrit le micrologiciel et produit le fichier du boîtier, prêt pour l'imprimante 3D.", "lvl": 3, "diff": "Avancé", "time": "Un week-end", "cost": "≈ 25 € de pièces", "pre": ["s-code"], "sk": {"n": [["mic", "Micro + bouton\n(carte ESP32)", 0, 0, "hi"], ["laptop", "Ton ordi", 1.6, 0], ["doc", "Texte propre\nsous ton curseur", 3, 0], ["printer3d", "Boîtier\nimprimé en 3D", 0, 1]], "e": [[0, 1, "ta voix", "d"], [1, 2, "transcrit", ""], [3, 0, "", ""]]}, "res": "Un objet à toi, posé sur le bureau. Tu maintiens le bouton, tu dictes ton mail, tu relâches : le texte apparaît là où clignote ton curseur, ponctué et sans fautes. La transcription peut se faire entièrement sur ton ordinateur, sans envoyer ta voix sur internet.", "need": ["Une carte ESP32-S3 (par exemple Seeed XIAO ESP32S3), environ 10 €", "Un micro numérique I2S INMP441, environ 3 €", "Un bouton poussoir et quelques fils", "Une petite batterie LiPo si tu le veux sans fil", "Un fer à souder, ou des fils à pince pour un premier essai", "Une imprimante 3D ou un service d'impression en ligne", "Claude Code sur ton ordinateur"], "steps": [{"h": "Fais dessiner le projet avant d'acheter", "p": "Commence par un plan complet. Claude propose la liste des pièces avec leurs références, le schéma de câblage et la répartition du travail entre le boîtier et l'ordinateur. Fais-le corriger jusqu'à ce qu'il te convienne, puis commande.", "pr": "Je veux fabriquer un micro de dictée de bureau. Je maintiens un bouton, je parle, je relâche, et le texte transcrit s'écrit à l'emplacement du curseur sur mon ordinateur [Windows ou Mac]. Propose une liste de pièces précise et bon marché (ESP32-S3, micro I2S), un schéma de câblage, et l'architecture logicielle : ce qui tourne sur le boîtier, ce qui tourne sur l'ordinateur. La transcription doit se faire en local si possible. Pose-moi tes questions avant de figer le plan."}, {"h": "Câble sur la table", "p": ["Avant de souder, fais un essai avec des fils à pince ou une plaque d'essai. Le micro a cinq broches utiles : l'alimentation, la masse et trois fils de données. Le bouton se branche entre une broche de la carte et la masse.", "Suis le schéma de Claude broche par broche, et prends une photo de ton montage : tu pourras la lui envoyer en cas de souci."], "fig": {"n": [["chip", "ESP32-S3", 0.4, 0], ["mic", "Micro INMP441", 2.6, 0], ["button", "Bouton", 2.6, 1]], "e": [[1, 0, "3,3 V, GND\nSCK, WS, SD", ""], [2, 0, "broche + GND", ""]]}}, {"h": "Laisse Claude écrire et installer le programme", "p": "Branche la carte en USB. Claude Code écrit le programme du boîtier, l'installe lui-même sur la carte, puis vérifie que le son arrive. S'il te demande de maintenir le petit bouton « BOOT » de la carte pendant le transfert, fais-le : c'est normal la première fois.", "pr": "La carte ESP32-S3 est branchée en USB et câblée comme dans ton schéma. Écris le programme du boîtier, installe-le sur la carte, et vérifie que tu reçois le son du micro. Ensuite, écris le programme côté ordinateur : il reçoit le son quand j'appuie sur le bouton, le transcrit en français avec un modèle qui tourne sur ma machine, corrige la ponctuation, puis tape le texte à l'endroit du curseur. Teste toute la chaîne avec moi."}, {"h": "Teste et règle", "p": "Dicte une phrase dans un document vide. Si des mots sautent, rapproche le micro ou demande à Claude d'ajuster le volume d'enregistrement. Si la ponctuation ne te va pas, dis ce que tu veux, par exemple « mets un point quand je fais une pause »."}, {"h": "Fais dessiner le boîtier", "p": "Mesure la carte, le micro et le bouton au pied à coulisse, ou donne leurs références à Claude. Il produit le modèle 3D avec les trous au bon endroit, puis les fichiers STL à imprimer.", "pr": "Dessine un boîtier imprimable en 3D pour ce montage : carte [dimensions], micro [dimensions], bouton de [diamètre] mm sur le dessus, trou pour le câble USB-C, grille devant le micro. Deux pièces qui s'emboîtent sans vis. Exporte un fichier STL par pièce, montre-moi un aperçu, et indique l'orientation d'impression conseillée."}, {"h": "Imprime et assemble", "p": "Ouvre les fichiers STL dans le logiciel de ton imprimante (Bambu Studio, PrusaSlicer, OrcaSlicer ou Cura), imprime en PLA, puis range l'électronique dedans. Si le bouton force, demande à Claude d'élargir le trou de 0,3 mm et réimprime seulement cette pièce."}, {"h": "Lance-le au démarrage", "p": "Demande enfin à Claude de lancer automatiquement le programme de l'ordinateur à l'allumage. Ton micro est prêt dès que tu t'assois."}], "trouble": [["La carte n'est pas reconnue en USB", "Change de câble : beaucoup de câbles USB-C ne font que charger. Prends un câble qui transmet les données."], ["Le son grésille", "Raccourcis les fils du micro et vérifie la masse. Envoie une photo du montage à Claude."], ["La transcription est lente", "Demande un modèle plus petit, ou une transcription en ligne si la confidentialité ne te gêne pas."]], "more": ["Une petite LED qui s'allume pendant l'écoute.", "Un second bouton qui envoie la dictée directement à Claude, comme une question.", "Une version sans fil, sur batterie, en Bluetooth."], "warn": "Une batterie LiPo se manipule avec soin : jamais de court-circuit, jamais une batterie gonflée, et pas de charge sans surveillance.", "kw": "dictée micro esp32 firmware boîtier impression 3d voix transcription whisper bouton"}, {"id": "clim", "src": "v", "ico": "ac", "t": "Piloter ta clim à ta façon", "pitch": "Une télécommande intelligente fabriquée pour quelques euros, ou une appli refaite selon tes goûts : ta clim se règle depuis le téléphone, suit la vraie température de la pièce et obéit à des horaires.", "story": "La vidéo évoque des personnes qui ont refait l'interface de leur climatiseur simplement en décrivant à Claude ce qu'elles voulaient.", "lvl": 3, "diff": "Moyen", "time": "2 à 3 h", "cost": "≈ 15 € (30 € sans soudure)", "pre": ["s-code"], "sk": {"n": [["phone", "Ton téléphone", 0, 0], ["chip", "Boîtier ESP32\n+ LED infrarouge", 1.5, 0], ["ac", "Ta clim", 3, 0, "hi"], ["thermo", "Capteur de\ntempérature", 1.5, 1]], "e": [[0, 1, "Wi-Fi", "d"], [1, 2, "infrarouge", "d"], [3, 1, "mesure", ""]]}, "res": "Ton climatiseur, même ancien, se commande depuis ton téléphone. Il s'allume avant ton arrivée, s'éteint quand la pièce est assez fraîche, et tu as enfin de gros boutons clairs au lieu des menus de la télécommande.", "need": ["Ta clim et sa télécommande infrarouge", "Version bricolage : une carte ESP32 (≈ 6 €), une LED infrarouge, un récepteur infrarouge, une résistance, un transistor et un capteur de température (≈ 5 €)", "Version sans soudure : une télécommande infrarouge Wi-Fi du commerce (type Broadlink, ≈ 30 €)", "Claude Code sur ton ordinateur"], "steps": [{"h": "Choisis ta version", "p": "Si ta clim a déjà le Wi-Fi et une appli, Claude peut parfois la piloter directement : donne-lui la marque et le modèle. Sinon, on passe par l'infrarouge, comme la télécommande d'origine. Cette méthode marche avec presque toutes les clims.", "pr": "Ma clim est une [marque et modèle], télécommande [référence au dos]. Dis-moi si elle peut se piloter directement par le Wi-Fi sur mon réseau local. Sinon, propose le montage infrarouge le plus simple avec une carte ESP32 et un capteur de température, avec la liste des pièces et le schéma."}, {"h": "Monte le boîtier", "p": "La LED infrarouge joue le rôle de la télécommande, le récepteur sert à apprendre ses signaux, et le capteur mesure la vraie température de la pièce. Suis le schéma de Claude, puis place le boîtier face à la clim, à deux ou trois mètres.", "fig": {"n": [["chip", "ESP32", 1.5, 0.5], ["remote", "LED infrarouge", 0, 0], ["search", "Récepteur\n(pour apprendre)", 0, 1], ["thermo", "Capteur", 3, 0.5]], "e": [[0, 1, "", ""], [0, 2, "", ""], [0, 3, "", ""]]}}, {"h": "Fais apprendre la télécommande", "p": "Claude installe un programme d'apprentissage. Tu appuies sur chaque bouton de la vraie télécommande en visant le récepteur : marche, arrêt, 22 degrés, mode froid. Pour beaucoup de marques, Claude reconnaît le protocole et l'étape va très vite.", "pr": "La carte est branchée en USB. Installe un programme qui lit les signaux infrarouges de ma télécommande et identifie le protocole de ma clim. Je vais appuyer sur les boutons un par un quand tu me le diras."}, {"h": "Dessine ton appli idéale", "p": "Décris l'écran que tu veux, sans te limiter. Claude construit la page de commande, servie par le boîtier lui-même et accessible depuis ton téléphone.", "pr": "Construis l'interface de ma clim, servie par l'ESP32 sur mon réseau : un grand bouton marche-arrêt, la température de la pièce mesurée par le capteur, la consigne de 18 à 28 °C, trois modes (froid, chauffage, ventilation) et un planning sur la semaine. Coupe automatiquement si la pièce descend sous [24] °C. Lisible sur téléphone, fonctionne sans internet."}, {"h": "Mets l'icône sur ton téléphone", "p": "Ouvre l'adresse du boîtier dans le navigateur du téléphone, puis « Ajouter à l'écran d'accueil ». Tu as une vraie icône, comme une appli."}, {"h": "Relie-la à la maison connectée (option)", "p": "Si tu utilises Home Assistant, Claude peut y déclarer la clim. Tu la commandes alors à la voix, depuis une tablette murale ou avec des scénarios."}], "trouble": [["La clim ne réagit pas", "Rapproche le boîtier et vise bien : l'infrarouge ne traverse pas les obstacles. Pour vérifier que la LED s'allume, filme-la avec l'appareil photo du téléphone, qui la voit en violet."], ["La température affichée est fausse", "Éloigne le capteur de la carte, qui chauffe un peu."], ["Le boîtier ne trouve pas le Wi-Fi", "Beaucoup de cartes ne gèrent que le 2,4 GHz. Vérifie que ta box le diffuse."]], "more": ["Couper la clim quand une fenêtre s'ouvre, avec un capteur d'ouverture.", "Allumer la clim de la boutique dix minutes avant l'ouverture.", "Suivre la consommation avec une prise connectée."], "warn": "Ne démonte pas l'unité de la clim et ne touche jamais au 230 V : tout ce tuto passe par l'infrarouge, de l'extérieur.", "kw": "climatisation climatiseur télécommande infrarouge esp32 home assistant température chauffage"}, {"id": "kindle", "src": "v", "ico": "kindle", "t": "Transformer ta Kindle en tableau de bord", "pitch": "Une Kindle débridée devient un petit écran d'encre posé sur le buffet : météo, agenda, liste de courses, rafraîchis tout seuls. Elle lit toujours tes livres, avec un lecteur plus libre.", "story": "Une Kindle est débridée, débarrassée de l'interface d'Amazon et transformée en tableau de bord pour la maison.", "lvl": 3, "diff": "Avancé", "time": "2 h", "cost": "Gratuit si tu as la Kindle", "pre": ["s-code"], "sk": {"n": [["pi", "Ton ordi ou\nun Raspberry Pi", 0, 0], ["photo", "Image du jour :\nmétéo, agenda", 1.5, 0], ["kindle", "Ta Kindle\nlibérée", 3, 0, "hi"], ["book", "KOReader\npour lire", 3, 1]], "e": [[0, 1, "fabrique", ""], [1, 2, "toutes les 30 min", "d"], [2, 3, "", ""]]}, "res": "Un écran qui consomme presque rien, lisible en plein soleil, qui affiche ce que tu veux et se met à jour seul. La batterie tient des jours, voire des semaines, selon la fréquence de mise à jour.", "need": ["Une Kindle dont la version logicielle peut être débridée (on vérifie à l'étape 1)", "Un câble USB et un ordinateur", "Un ordinateur ou un Raspberry Pi allumé en permanence pour fabriquer l'image", "Claude Code, et un peu de patience"], "steps": [{"h": "Note ta version et coupe les mises à jour", "p": "Sur la Kindle, ouvre Paramètres, Options de l'appareil, Infos sur l'appareil. Note la version du logiciel et le modèle. Passe tout de suite en mode avion : une mise à jour automatique peut fermer la porte au débridage.", "fig": {"scr": "kindle", "l": ["Paramètres", "Options de l'appareil", "Infos sur l'appareil", "Version : 5.18.x"], "hl": 3}}, {"h": "Trouve la méthode qui correspond", "p": "Les méthodes de débridage changent avec les versions. Le site communautaire kindlemodding.org tient la liste à jour et propose un assistant qui te dit laquelle utiliser. Par exemple, la méthode AdBreak vise les versions 5.18.1 à 5.18.5.0.1. Demande à Claude de lire le guide avec toi.", "pr": "Ma Kindle est un [modèle], version [numéro]. Va sur kindlemodding.org, trouve la méthode de débridage compatible, et explique-moi chaque étape en français simple, avec les risques. Ne fais rien sur la liseuse sans mon accord."}, {"h": "Débride en suivant le guide à la lettre", "p": "Branche la Kindle à l'ordinateur. Selon la méthode, il faut copier des fichiers dans un dossier précis, puis déclencher le script depuis la liseuse. Claude prépare les fichiers et vérifie que tout est au bon endroit. Prends ton temps : c'est l'étape où une erreur coûte cher."}, {"h": "Installe le lanceur et un vrai lecteur", "p": "Une fois libérée, la Kindle accepte des extensions. On installe d'abord le lanceur KUAL, puis KOReader, un lecteur libre qui lit aussi les PDF et les EPUB."}, {"h": "Fabrique ton tableau de bord", "p": "Le principe est simple : un petit programme, sur ton ordinateur ou un Raspberry Pi, fabrique une image en niveaux de gris avec ce que tu veux voir. La Kindle la récupère et l'affiche à intervalles réguliers.", "pr": "Ma Kindle débridée a un écran de [résolution, par exemple 1072 x 1448]. Écris un programme qui fabrique toutes les 30 minutes une image en niveaux de gris à cette taille : date, météo de [ta ville] sur la journée, mes rendez-vous du jour depuis [agenda], et [ma liste de courses]. Gros caractères, contrastes forts. Puis écris le script côté Kindle qui récupère l'image sur mon réseau et l'affiche, en laissant la liseuse en veille entre deux mises à jour pour économiser la batterie."}, {"h": "Pose-la et oublie-la", "p": "Un petit support ou un cadre photo suffit. Laisse-la branchée si tu veux un rafraîchissement très fréquent ; sinon, la batterie tient longtemps."}], "trouble": [["La méthode ne marche pas", "Vérifie la version exacte : un chiffre de différence change tout. Si ta version n'est pas encore débridable, garde la Kindle en mode avion et attends une nouvelle méthode."], ["L'image est floue ou décalée", "Donne à Claude la résolution exacte de ton modèle."], ["La batterie fond", "Espace les mises à jour, ou laisse la Kindle branchée."]], "more": ["Afficher le planning et les rendez-vous clients du jour.", "Synchroniser tes lectures avec ta propre bibliothèque, sans passer par Amazon.", "Afficher un mot d'italien par jour."], "warn": "Débrider une Kindle fait perdre la garantie et peut, en cas d'erreur, la rendre inutilisable. Fais-le sur une liseuse que tu acceptes de risquer.", "kw": "kindle liseuse jailbreak débrider koreader tableau de bord encre amazon"}, {"id": "wifi", "src": "v", "ico": "wifi", "t": "Rendre ton Wi-Fi beaucoup plus rapide", "pitch": "Claude Code mesure ton réseau depuis l'ordinateur, repère ce qui le freine et te dit exactement quoi changer sur ta box. Dans la vidéo, le débit est multiplié par huit.", "story": "Une personne demande à Claude Code de diagnostiquer son réseau. Il passe en revue les réglages du routeur, trouve ce qui bride la connexion, et le Wi-Fi devient nettement plus rapide.", "lvl": 3, "diff": "Facile", "time": "30 min", "cost": "Gratuit", "pre": ["s-code"], "sk": {"n": [["laptop", "Ton ordi\n+ Claude Code", 0, 0], ["router", "Ta box", 1.5, 0], ["chart", "Débit\navant / après", 3, 0, "hi"], ["wifi", "Canal, bande,\nvoisins", 1.5, 1]], "e": [[0, 1, "réglages", ""], [1, 2, "", ""], [0, 3, "mesures", "d"]], "t": [["× 8", 3, -0.3]]}, "res": "Un Wi-Fi qui tient ses promesses : des pages qui s'ouvrent tout de suite, des visios sans coupure, et un rapport clair de ce qui a été changé et pourquoi.", "need": ["Un ordinateur portable connecté en Wi-Fi", "Claude Code", "Le mot de passe d'administration de ta box (souvent sous la box ou sur son écran)"], "steps": [{"h": "Mesure avant de toucher à quoi que ce soit", "p": "Place-toi là où le Wi-Fi est mauvais. Claude mesure le débit, la qualité du signal, la bande utilisée (2,4 ou 5 GHz), le canal, et les réseaux voisins qui se battent pour la même fréquence.", "cmd": "netsh wlan show interfaces      (sur Windows)\nnetworkQuality                  (sur Mac)", "pr": "Mon Wi-Fi est lent. Fais un diagnostic complet depuis cet ordinateur : débit réel, latence, force du signal, bande et canal utilisés, vitesse de connexion de la carte Wi-Fi, réseaux voisins et leurs canaux. Fais trois mesures pour avoir une moyenne. Garde les résultats dans un fichier « avant.txt ». Ne change aucun réglage."}, {"h": "Lis le diagnostic", "p": "Les coupables reviennent souvent : un ordinateur accroché au 2,4 GHz alors que le 5 GHz est libre, un canal saturé par les voisins, une largeur de canal réduite, un mode éco, ou un vieux câble entre la box et un répéteur qui bride tout à 100 Mb/s. Demande à Claude de classer les causes de la plus probable à la moins probable."}, {"h": "Ouvre l'interface de ta box", "p": "Elle répond à une adresse locale : 192.168.1.1 pour une Livebox ou une box SFR, mafreebox.freebox.fr pour une Freebox, mabbox.bytel.fr pour une Bbox. Connecte-toi avec le mot de passe administrateur. Claude te guide menu par menu.", "fig": {"scr": "laptop", "l": ["Wi-Fi 5 GHz", "Canal : auto → 36", "Largeur : 80 MHz", "Mode éco : désactivé"], "hl": 1}}, {"h": "Change un réglage à la fois", "p": "Applique la première correction, puis remesure. Un seul changement à la fois permet de savoir ce qui a vraiment aidé, et de revenir en arrière si ça empire.", "pr": "J'ai appliqué [le réglage]. Refais les trois mesures, compare avec « avant.txt » et dis-moi si on garde ce changement. Puis propose le suivant."}, {"h": "Garde le rapport", "p": "Demande un résumé final : réglages d'origine, réglages modifiés, gains mesurés. Après une mise à jour de la box ou un changement d'opérateur, tu sauras quoi refaire."}], "trouble": [["Je ne trouve pas le mot de passe de la box", "Il est souvent imprimé sous la box ou affiché sur son écran. Sinon, le site de ton opérateur explique comment le réinitialiser."], ["Le débit ne bouge pas", "La ligne elle-même est peut-être lente. Branche l'ordinateur en câble sur la box : si c'est lent aussi, appelle ton opérateur avec les mesures de Claude."], ["Un appareil ne se connecte plus", "Certains vieux appareils ne gèrent pas le 5 GHz. Garde un réseau 2,4 GHz actif pour eux."]], "more": ["Trouver le meilleur emplacement pour un répéteur, mesures à l'appui.", "Créer un réseau invité séparé pour les clients de la boutique.", "Mesurer le débit chaque nuit et garder un historique pour ton opérateur."], "warn": "Note les réglages d'origine avant de les changer. Un redémarrage de la box ne les efface pas, une réinitialisation si.", "kw": "wifi internet lent box routeur débit canal livebox freebox bbox sfr réseau"}, {"id": "journal", "src": "v", "ico": "printer", "t": "Imprimer ton journal du matin sur une imprimante à tickets", "pitch": "Chaque matin, une imprimante à tickets sort un petit journal fait pour toi : les mails qui attendent une réponse, ton agenda, la météo et trois nouvelles. Tu le lis avec ton café, sans écran.", "story": "Une imprimante à tickets récupérée sert de journal quotidien : Claude résume les mails de la veille, et l'imprimante les sort sur un rouleau de papier, comme un ticket de caisse.", "lvl": 3, "diff": "Moyen", "time": "2 h", "cost": "Gratuit si tu as l'imprimante, sinon ≈ 30 €", "pre": ["s-code", "s-pi"], "sk": {"n": [["mail", "Tes mails", 0, 0], ["news", "L'actu\n(flux RSS)", 0, 1], ["claude", "Claude\nrésume", 1.5, 0.5], ["printer", "Imprimante\nà tickets", 3, 0.5, "hi"]], "e": [[0, 2, "", ""], [1, 2, "", ""], [2, 3, "chaque matin", ""]]}, "res": "Un ruban de papier qui t'attend chaque matin : les messages importants en une ligne chacun, tes rendez-vous, la météo, et ce qui se passe dans ton secteur. L'imprimante thermique n'a besoin ni d'encre ni de cartouche.", "need": ["Une imprimante à tickets thermique compatible ESC/POS, en USB, réseau ou Bluetooth (une imprimante de caisse fait parfaitement l'affaire)", "Un rouleau de papier thermique", "Un ordinateur ou un Raspberry Pi allumé le matin", "Claude Code, et l'accès à ta boîte mail"], "steps": [{"h": "Fais imprimer une première ligne", "p": "Branche l'imprimante à l'ordinateur ou au réseau. La plupart des imprimantes de caisse parlent le même langage, ESC/POS, que Claude connaît bien.", "pr": "J'ai une imprimante à tickets [marque et modèle] branchée en [USB, réseau ou Bluetooth]. Trouve-la, installe ce qu'il faut, et imprime un ticket de test avec un titre en gros, une ligne de texte normal, des accents (é, è, à, ç) et une coupe du papier à la fin."}, {"h": "Donne accès à tes mails", "p": "Le plus simple est un accès en lecture par IMAP. Avec Gmail, active la validation en deux étapes, puis crée un « mot de passe d'application » dans la sécurité de ton compte Google. Donne ce mot de passe au programme, jamais ton mot de passe principal."}, {"h": "Décris ton journal idéal", "p": "Choisis les rubriques, l'ordre et la longueur. Un ticket trop long finit à la poubelle : vise ce qui se lit en trois minutes.", "pr": "Écris un programme qui prépare chaque matin mon journal : 1) les mails reçus depuis la veille qui demandent une action de ma part, une ligne chacun avec l'expéditeur ; 2) mes rendez-vous du jour ; 3) la météo de [ta ville] ; 4) trois nouvelles de [ton secteur] tirées de ces flux RSS : [liens]. Utilise Claude pour résumer, en français, ton direct. Mets en page pour du papier de [80] mm : titres en gras et en grand, lignes courtes, séparateurs. Imprime et coupe le papier à la fin."}, {"h": "Programme l'heure", "p": "Demande à Claude de lancer le programme chaque jour à l'heure voulue. Sur un Raspberry Pi, il utilise le planificateur du système ; sur Windows, le Planificateur de tâches.", "cmd": "0 7 * * 1-6  python3 journal.py     (7 h, du lundi au samedi)"}, {"h": "Ajuste pendant une semaine", "p": "Chaque jour, note ce qui manque ou ce qui ne sert à rien, et dis-le à Claude : « supprime la météo le week-end », « mets les clients avant les fournisseurs », « ajoute le chiffre d'affaires d'hier »."}], "trouble": [["L'imprimante sort des caractères bizarres", "Les accents posent souvent problème. Demande à Claude de régler la page de caractères de l'imprimante pour le français."], ["Rien ne sort le matin", "Vérifie que l'ordinateur ne dort pas à cette heure-là, ou passe sur un Raspberry Pi qui reste allumé."], ["Le résumé oublie des mails importants", "Donne des règles à Claude : « tout ce qui vient de mon comptable est important »."]], "more": ["Imprimer la liste des travaux à rendre dans la journée.", "Ajouter un mot de la semaine dans une langue que tu apprends.", "Un bouton physique qui réimprime le journal à la demande."], "warn": "Ton programme lit tes mails : garde-le sur une machine à toi, utilise un mot de passe d'application que tu peux révoquer à tout moment, et n'imprime rien de sensible sur un ticket qui traîne.", "kw": "imprimante ticket thermique journal matin mails résumé raspberry escpos epson caisse"}, {"id": "drone-ronde", "src": "v", "ico": "drone", "t": "Programmer une ronde de surveillance avec ton drone", "pitch": "Ton drone fait le tour du terrain sur un parcours enregistré, prend des photos, et Claude compare les images pour te signaler ce qui a changé. Le tout sans passer par le cloud.", "story": "Un téléphone de rechange est fixé sur un drone DJI et relié à l'alarme de la maison : quand elle sonne, le drone fait une ronde. Le système tourne en local, sans aucun service en ligne.", "lvl": 3, "diff": "Avancé", "time": "Un week-end", "cost": "Gratuit si tu as le drone", "pre": ["s-code"], "sk": {"n": [["user", "Toi, le drone\ntoujours en vue", 0, 0], ["drone", "Drone DJI\nsur son parcours", 1.5, 0, "hi"], ["house", "Ton terrain", 3, 0], ["claude", "Comparaison\ndes photos", 1.5, 1]], "e": [[0, 1, "tu lances", ""], [1, 2, "ronde", ""], [1, 3, "photos", "d"]]}, "res": "Une ronde reproductible : même trajet, même altitude, mêmes angles. Claude compare les photos d'une ronde à l'autre et liste ce qui a bougé : un portail ouvert, une échelle déplacée, une tuile tombée.", "need": ["Un drone DJI compatible avec le kit de développement de DJI (Mobile SDK), à vérifier selon ton modèle", "Un téléphone Android dédié à la radiocommande", "Un terrain où tu as le droit de voler", "Claude Code et Android Studio sur l'ordinateur"], "steps": [{"h": "Vérifie le droit avant la technique", "p": "En France, un drone de loisir doit rester visible à l'œil nu, ne vole pas la nuit, et ne filme ni les passants ni chez les voisins sans accord. Un drone qui décolle seul la nuit quand l'alarme sonne n'est donc pas autorisé pour un particulier. Ce tuto construit une ronde que tu déclenches toi-même, de jour, en gardant le drone en vue. Vérifie aussi ta zone sur la carte des restrictions drones du Géoportail."}, {"h": "Vérifie que ton drone se programme", "p": "Tous les DJI ne s'ouvrent pas aux programmes extérieurs. Donne ton modèle à Claude.", "pr": "J'ai un drone DJI [modèle]. Vérifie s'il est compatible avec le DJI Mobile SDK et quelles fonctions sont disponibles : vol par points de passage, contrôle de la caméra, récupération des photos. Si ce n'est pas le cas, propose l'alternative la plus proche."}, {"h": "Dessine le parcours", "p": "Sur une vue satellite de ton terrain, place quatre à huit points de passage, l'altitude (reste bas, 15 à 30 mètres) et ce que la caméra doit regarder à chaque point. Envoie la liste ou une capture annotée à Claude."}, {"h": "Fais construire l'appli de ronde", "p": "Claude Code écrit une appli Android qui charge le parcours, décolle quand tu appuies sur « Ronde », prend une photo à chaque point et ramène le drone. Tu peux reprendre la main à tout moment avec la radiocommande.", "pr": "Écris une appli Android avec le DJI Mobile SDK pour mon [modèle] : un bouton « Ronde » qui décolle, suit ces points de passage [liste avec altitudes], prend une photo orientée à chaque point, puis revient se poser. Un gros bouton « Stop » qui ramène le drone immédiatement. Tout reste sur le téléphone, aucune connexion à un service en ligne. Ajoute un mode simulation pour tester sans voler."}, {"h": "Teste en simulation, puis à basse altitude", "p": "Lance d'abord le mode simulation, puis un premier vol à 10 mètres sur un terrain dégagé. Garde les mains sur la radiocommande."}, {"h": "Compare les rondes", "p": "Après chaque ronde, transfère les photos sur l'ordinateur. Claude les compare à la ronde de référence.", "pr": "Voici les photos de la ronde d'aujourd'hui et celles de la ronde de référence, point par point. Liste ce qui a changé de façon notable : objets apparus ou disparus, portes ou portails ouverts, dégâts visibles. Ignore les changements de lumière et la végétation qui bouge."}], "trouble": [["Le drone refuse le parcours", "Une zone de restriction ou une altitude trop haute bloque souvent la mission. Vérifie la carte des zones et baisse l'altitude."], ["Trop de fausses alertes", "Fais les rondes à la même heure, avec une lumière comparable, et dis à Claude ce qu'il doit ignorer."]], "more": ["Inspecter ta toiture après une tempête sans monter à l'échelle.", "Suivre un chantier photo après photo, toujours sous le même angle.", "Pour une vraie surveillance de nuit, préférer des caméras fixes avec détection, que Claude peut aussi analyser."], "warn": "Respecte la vie privée : aucune image reconnaissable des voisins ni des passants. Une atteinte à la vie privée est punie jusqu'à un an de prison et 45 000 € d'amende.", "kw": "drone dji surveillance ronde alarme sécurité terrain sdk photo"}, {"id": "ipad", "src": "v", "ico": "tablet", "t": "Recycler un vieil iPad en tableau de commande de la maison", "pitch": "Un iPad trop vieux pour les applis d'aujourd'hui devient un écran mural dédié : lumières, chauffage, météo, agenda, en gros boutons.", "story": "Un iPad dépassé, incapable de faire tourner les applis récentes, est transformé en tableau de commande de la maison connectée.", "lvl": 3, "diff": "Moyen", "time": "2 h", "cost": "Gratuit (+ un support mural)", "pre": ["s-code", "s-pi"], "sk": {"n": [["tablet", "Vieil iPad\nau mur", 0, 0, "hi"], ["pi", "Raspberry Pi\nsert la page", 1.5, 0], ["house", "Lumières,\nchauffage…", 3, 0], ["weather", "Météo,\nagenda", 1.5, 1]], "e": [[0, 1, "tes clics", "d"], [1, 2, "", ""], [3, 0, "", ""]]}, "res": "Un écran toujours allumé à l'entrée ou dans la cuisine, qui affiche l'heure, la météo et tes rendez-vous, et commande la maison d'un doigt. Les vieux iPad ne font plus tourner les applis récentes, mais leur navigateur affiche très bien une page écrite exprès pour eux.", "need": ["Un vieil iPad, même bloqué sur une ancienne version d'iOS, et son chargeur", "Une maison connectée pilotable (Home Assistant, ampoules, prises) ou juste l'envie d'un écran météo et agenda", "Un Raspberry Pi ou un ordinateur allumé en permanence", "Claude Code"], "steps": [{"h": "Note la version d'iOS", "p": "Sur l'iPad : Réglages, Général, Informations. Note la version d'iOS. C'est elle qui dit à Claude ce que l'ancien navigateur sait encore faire.", "fig": {"scr": "tablet", "l": ["Réglages", "Général", "Informations", "Version iOS : 12.5.7"], "hl": 3}}, {"h": "Fais construire une page compatible", "p": "Le secret : une page très légère, écrite pour l'ancien Safari et servie par le Raspberry Pi. C'est elle qui parle à la maison connectée, à la place de l'iPad.", "pr": "Construis un tableau de commande pour un iPad sous iOS [version], donc avec un vieux Safari : la page doit fonctionner avec du JavaScript ancien, sans technologies récentes. Contenu : l'heure en grand, la météo de [ta ville], mes rendez-vous du jour, et de gros boutons pour [lumières du salon, chauffage, volets] via [Home Assistant ou tes prises connectées]. Sers-la depuis ce Raspberry Pi sur le réseau local."}, {"h": "Ouvre la page sur l'iPad", "p": "Dans Safari, tape l'adresse donnée par Claude, puis Partager et « Sur l'écran d'accueil ». L'iPad l'ouvre en plein écran, comme une appli."}, {"h": "Verrouille l'iPad sur cet écran", "p": "Active l'Accès guidé : Réglages, Accessibilité, Accès guidé. Ouvre ton tableau de commande et appuie trois fois sur le bouton principal pour le verrouiller dessus. Dans Réglages, Luminosité, règle le verrouillage automatique sur « Jamais »."}, {"h": "Fixe-le au mur", "p": "Un support adhésif pour tablette et un câble discret le long du mur suffisent. Demande à Claude un mode nuit automatique qui baisse la luminosité de la page le soir."}], "trouble": [["La page reste blanche", "Le vieux Safari ne comprend pas un morceau du code. Donne la version d'iOS à Claude, il simplifie."], ["Les boutons ne font rien", "Vérifie que l'iPad est sur le même réseau que le Raspberry Pi, et que la maison connectée accepte les commandes."], ["La coque se déforme", "Un iPad branché en permanence pendant des années peut voir sa batterie gonfler. Surveille-la."]], "more": ["Un mode boutique : planning du jour, commandes à préparer, météo pour la vitrine.", "Afficher la caméra de la porte d'entrée.", "Le même principe marche avec une vieille tablette Android."], "warn": "Une batterie gonflée est dangereuse. Si l'écran se soulève ou si la coque se déforme, débranche et fais recycler l'appareil.", "kw": "ipad tablette vieux recycler tableau de bord domotique écran mural home assistant"}, {"id": "blackberry", "src": "v", "ico": "bberry", "t": "Transformer un vieux BlackBerry en terminal de poche", "pitch": "Un BlackBerry d'occasion, avec son vrai clavier, devient une télécommande de poche pour Claude Code, qui tourne sur ton ordinateur à la maison.", "story": "Un BlackBerry acheté d'occasion est transformé en terminal de poche qui fait tourner Claude Code, avec son clavier physique.", "lvl": 3, "diff": "Moyen", "time": "1 h 30", "cost": "≈ 60 à 100 € d'occasion", "pre": ["s-code"], "sk": {"n": [["bberry", "BlackBerry\nKEYone ou Key2", 0, 0, "hi"], ["globe", "Liaison privée\n(Tailscale)", 1.5, 0], ["monitor", "Ton ordi à la maison\navec Claude Code", 3, 0]], "e": [[0, 1, "SSH", "d"], [1, 2, "", ""]]}, "res": "Dans le train ou au travail, tu sors le BlackBerry, tu tapes une consigne sur un vrai clavier, et Claude Code travaille sur l'ordinateur de la maison. Tu retrouves ta session exactement où tu l'avais laissée.", "need": ["Un BlackBerry sous Android avec clavier : KEYone ou Key2, d'occasion", "Un ordinateur à la maison, allumé, avec Claude Code", "Un compte Tailscale gratuit, pour relier tes appareils en privé"], "steps": [{"h": "Choisis le bon modèle", "p": "Prends un BlackBerry qui tourne sous Android : KEYone ou Key2. Les anciens modèles BB10 ne font plus tourner les applis nécessaires. Vérifie qu'il n'est pas bloqué opérateur et que la batterie tient."}, {"h": "Installe Termux", "p": "Termux est un terminal Linux pour Android. Installe-le depuis le magasin d'applis F-Droid : la version du Play Store n'est plus à jour. Ouvre-le et installe SSH.", "cmd": "pkg update && pkg install openssh"}, {"h": "Prépare l'ordinateur de la maison", "p": "Claude Code rend ton ordinateur joignable de façon sûre, et garde tes sessions ouvertes même quand tu te déconnectes.", "pr": "Je veux piloter ce PC depuis mon téléphone en SSH. Active et sécurise le serveur SSH (connexion par clé uniquement, pas de mot de passe), installe Tailscale pour que je puisse me connecter depuis l'extérieur sans ouvrir de port sur ma box, et installe tmux pour que mes sessions Claude Code restent ouvertes. Donne-moi les commandes exactes à taper sur le téléphone."}, {"h": "Connecte le BlackBerry", "p": "Installe Tailscale sur le BlackBerry avec le même compte. Dans Termux, crée une clé, envoie-la à l'ordinateur comme Claude te l'indique, puis connecte-toi. Ensuite, deux commandes suffisent à chaque fois.", "cmd": "ssh toi@ordi-maison\ntmux attach || tmux new -s claude"}, {"h": "Lance Claude Code", "p": "Dans la session, tape claude. Tu travailles maintenant sur l'ordinateur de la maison depuis ta poche. Termux ajoute au-dessus du clavier une rangée de touches spéciales, dont Échap et les flèches."}], "trouble": [["La connexion coupe dans le métro", "C'est le rôle de tmux : reconnecte-toi, la session t'attend."], ["Le clavier tape des caractères bizarres", "Demande à Claude de régler la disposition du clavier dans Termux."]], "more": ["Lancer un tuto de ce guide depuis le travail, sur l'ordinateur de la maison.", "Utiliser n'importe quel vieux téléphone Android de la même façon.", "Plus simple, sans BlackBerry : la version web claude.ai/code marche sur tout téléphone récent."], "warn": "Connexion par clé uniquement, et aucun port ouvert sur la box : sinon ton ordinateur devient visible de tout internet.", "kw": "blackberry clavier terminal ssh termux téléphone poche claude code distance tailscale"}, {"id": "habitude", "src": "v", "ico": "webcam", "t": "Te débarrasser d'une mauvaise habitude avec ta webcam", "pitch": "La webcam surveille un geste précis, te ronger les ongles ou te toucher le visage, et te prévient d'un petit son au moment où ça arrive. Tout reste sur ton ordinateur.", "story": "Un petit programme se sert de la webcam pour repérer un geste qu'on veut arrêter, et le signale sur le moment.", "lvl": 3, "diff": "Facile", "time": "45 min", "cost": "Gratuit", "pre": ["s-code"], "sk": {"n": [["webcam", "Ta webcam", 0, 0], ["laptop", "Analyse sur\nton ordi", 1.5, 0], ["bell", "Petit bip\n+ compteur", 3, 0, "hi"], ["cloud", "Aucune image\nenvoyée", 1.5, 1, "x"]], "e": [[0, 1, "images", "d"], [1, 2, "geste repéré", ""]]}, "res": "Un compagnon discret pendant que tu travailles. Le bip interrompt le geste automatique, et un compteur te montre les progrès de la semaine.", "need": ["Un ordinateur avec webcam", "Claude Code"], "steps": [{"h": "Décris le geste précisément", "p": "Plus c'est précis, mieux ça marche : « main droite près de la bouche plus d'une seconde », « doigts dans les cheveux », « dos voûté »."}, {"h": "Fais construire le détecteur", "p": "Claude utilise des outils libres qui repèrent les mains et le visage directement sur ta machine.", "pr": "Écris un petit programme qui utilise ma webcam pour détecter quand [le geste]. Utilise un modèle de repérage des mains et du visage qui tourne en local. À chaque détection qui dure plus de [1] seconde, joue un bip discret et compte. Aucune image ne doit être enregistrée ni envoyée. Ajoute une icône dans la barre des tâches pour mettre en pause."}, {"h": "Règle la sensibilité", "p": "Utilise-le une heure. S'il sonne quand tu bois ton café, dis-le : Claude ajoute une exception. S'il rate des gestes, il baisse le seuil."}, {"h": "Regarde tes progrès", "p": "Un graphique simple suffit à motiver.", "pr": "Ajoute un petit bilan : nombre de détections par jour sur la semaine, en graphique simple."}, {"h": "Lance-le au démarrage", "p": "Demande à Claude de le lancer à l'allumage de l'ordinateur, et de se mettre en pause pendant les visios."}], "trouble": [["Il ne voit rien", "Vérifie que la webcam n'est pas déjà utilisée par une autre appli et que la pièce est assez éclairée."], ["Il ralentit l'ordinateur", "Demande-lui d'analyser moins d'images par seconde : cinq suffisent."]], "more": ["Rappel de posture quand tu t'affaisses devant l'écran.", "Rappel de pause toutes les 50 minutes.", "Signal quand tu prends ton téléphone pendant une tâche importante."], "warn": "Les images doivent rester sur ta machine : précise-le dans la consigne, et demande à Claude de te montrer où c'est garanti dans le code.", "kw": "habitude ongles webcam caméra détection posture tic geste"}, {"id": "abonnements", "src": "v", "ico": "card", "t": "Remplacer tes abonnements par tes propres outils", "pitch": "Beaucoup d'applis payantes ne font qu'une ou deux choses simples. Claude te les fabrique, à ta mesure, et tu résilies.", "story": "La vidéo cite l'entrepreneur Pieter Levels, qui a remplacé plusieurs abonnements par des outils construits avec Claude, jusqu'à ne plus payer qu'une poignée de factures récurrentes.", "lvl": 1, "diff": "Facile", "time": "1 h par outil", "cost": "Gratuit", "pre": [], "sk": {"n": [["card", "Abonnement\nmensuel", 0, 0, "x"], ["claude", "Claude\nconstruit", 1.5, 0], ["apps", "Ton outil\nà toi", 3, 0, "hi"]], "e": [[0, 1, "tu décris", ""], [1, 2, "", ""]], "t": [["0 € / mois", 3, 0.86]]}, "res": "Des petits outils qui font exactement ce qu'il te faut, sans fonctions inutiles ni hausse de prix surprise, et des économies qui s'additionnent chaque mois.", "need": ["Tes relevés bancaires des trois derniers mois", "Claude, gratuit ou payant"], "steps": [{"h": "Fais l'inventaire", "p": "Joins tes relevés ou colle la liste de tes prélèvements. Claude trouve les abonnements, calcule le total annuel et repère ceux qu'un petit outil pourrait remplacer.", "pr": "Voici mes relevés des trois derniers mois. Trouve tous les abonnements et prélèvements récurrents, calcule le coût annuel de chacun, et classe-les : indispensables, remplaçables par un outil simple, à résilier. Pour les remplaçables, dis-moi ce que l'outil devrait faire."}, {"h": "Décris l'usage réel, pas l'appli", "p": "Pour l'abonnement choisi, écris en une phrase ce que tu en fais vraiment. Souvent, c'est une seule chose : un minuteur, une liste partagée, une fiche de suivi, un générateur de documents."}, {"h": "Fais construire l'outil", "p": "Claude crée une page qui fonctionne tout de suite, avec sa propre adresse. Tu peux la poser sur l'écran d'accueil du téléphone.", "pr": "Je paie [nom de l'appli] [prix] par mois et je m'en sers uniquement pour [usage]. Fabrique-moi un outil qui fait exactement ça, sous forme de page que je peux rouvrir et utiliser sur téléphone. Mes données doivent rester sur mon appareil. Dis-moi franchement ce que je perds par rapport à l'original."}, {"h": "Utilise les deux pendant une semaine", "p": "Garde l'abonnement le temps de vérifier que ton outil suffit, et demande les ajustements au fil de l'eau."}, {"h": "Résilie", "p": "Claude rédige la lettre ou t'indique la marche à suivre.", "pr": "Rédige la lettre de résiliation de mon abonnement [nom], numéro client [numéro], avec effet à la prochaine échéance."}], "trouble": [["Mon outil perd mes données", "Les pages simples gardent les données dans le navigateur. Pour plus de sûreté, demande une sauvegarde en fichier, ou passe par Claude Code pour une vraie base de données."], ["J'ai besoin de partager avec d'autres", "Précise-le dès le départ : Claude prévoit alors un stockage partagé."]], "more": ["Remplacer un outil de devis si tu n'en utilises qu'une partie.", "Une liste de courses partagée en famille.", "Refaire l'inventaire des abonnements chaque année."], "warn": "Pour la facturation et la comptabilité, garde un logiciel conforme à la loi française. Remplace plutôt les petits outils autour.", "kw": "abonnement économie résilier logiciel saas remplacer outil prélèvement"}, {"id": "negocier", "src": "v", "ico": "euro", "t": "Faire négocier Claude pour toi", "pitch": "Acheter ou vendre sur Leboncoin, renégocier un loyer ou un fournisseur : Claude estime le juste prix, fixe ta stratégie et rédige chaque message.", "story": "La vidéo raconte une expérience menée par Anthropic, Project Deal : 69 salariés ont confié à leur propre agent Claude l'achat et la vente d'objets. Les agents ont négocié seuls et conclu 186 affaires. Ceux qui utilisaient le modèle le plus puissant obtenaient de meilleurs prix, sans que l'autre camp s'en rende compte.", "lvl": 1, "diff": "Facile", "time": "20 min", "cost": "Gratuit", "pre": [], "sk": {"n": [["user", "Ton prix limite\net ton objectif", 0, 0], ["claude", "Claude\nnégocie", 1.5, 0], ["cart", "Leboncoin,\nVinted…", 3, 0], ["euro", "Meilleur prix", 1.5, 1, "hi"]], "e": [[0, 1, "", ""], [1, 2, "messages", "b"], [1, 3, "", ""]]}, "res": "Tu sais combien vaut l'objet, jusqu'où aller, et quoi répondre à chaque contre-offre. Tu gagnes du temps, quelques dizaines d'euros, et tu gardes ton calme.", "need": ["L'annonce ou l'objet concerné", "Ton prix plancher (si tu vends) ou plafond (si tu achètes)", "Claude, avec la recherche web activée"], "steps": [{"h": "Estime le juste prix", "p": "Avec la recherche web, Claude compare les annonces similaires et les ventes récentes.", "pr": "Je veux [acheter ou vendre] ceci : [lien de l'annonce ou description, état, année]. Cherche des annonces comparables en France. Donne une fourchette de juste prix, et les arguments qui font monter ou baisser ce prix."}, {"h": "Fixe ta stratégie", "p": "Donne ton prix limite et ton délai. Demande le prix d'ouverture, les concessions possibles, et le moment où il vaut mieux laisser tomber."}, {"h": "Rédige le premier message", "p": "Un premier message court et sérieux donne le ton.", "pr": "Écris mon premier message : poli, court, qui montre que je suis sérieux, avec une offre à [montant] justifiée par [arguments]. Prévois les trois réponses probables de l'autre partie et ce que je réponds à chacune."}, {"h": "Colle chaque réponse", "p": "Quand l'autre répond, colle son message dans la même conversation. Claude propose la réplique suivante en restant dans ta stratégie."}, {"h": "Entraîne-toi pour le face-à-face", "p": "Pour un loyer, un fournisseur ou un banquier, Claude joue l'autre partie sans te ménager.", "pr": "Je vais négocier [quoi] avec [qui]. Objectif : [objectif]. Limite : [limite]. Joue la personne en face, coriace et réaliste. Quand je dis « stop », sors du rôle et dis-moi ce que j'ai bien fait, ce que j'ai raté, et les trois phrases que j'aurais dû dire."}], "trouble": [["Le vendeur ne répond plus", "Demande une relance courte, 48 heures après, avec une petite concession."], ["L'annonce ressemble à une arnaque", "Colle-la à Claude : prix anormalement bas, paiement hors plateforme ou demande de code SMS sont des signaux d'alerte."]], "more": ["Vendre le stock qui dort au meilleur prix.", "Renégocier chaque année tes contrats d'énergie et de télécom.", "Préparer un rendez-vous fournisseur avec les prix de ses concurrents."], "warn": "Envoie les messages toi-même. Laisser un agent négocier seul au nom de quelqu'un pose encore des questions de droit et de confiance, que l'expérience d'Anthropic souligne elle-même.", "kw": "négociation leboncoin vinted prix achat vente marchander project deal loyer fournisseur"}, {"id": "maison", "src": "v", "ico": "house", "t": "Piloter toute ta maison depuis une seule appli", "pitch": "Lumières, prises, chauffage, volets, caméras : chaque marque a son appli. Home Assistant les réunit toutes, et Claude fait l'installation avec toi.", "story": "La vidéo montre une maison pilotée depuis une seule interface, montée avec l'aide de l'IA, avec des scénarios qui se déclenchent d'une phrase.", "lvl": 3, "diff": "Moyen", "time": "Une demi-journée", "cost": "≈ 80 € (Raspberry Pi)", "pre": ["s-pi", "s-code"], "sk": {"n": [["phone", "Une seule appli", 0, 0.5], ["pi", "Home Assistant\nsur Raspberry Pi", 1.5, 0.5, "hi"], ["bulb", "Lumières", 3, 0], ["thermo", "Chauffage", 3, 1]], "e": [[0, 1, "", ""], [1, 2, "", ""], [1, 3, "", ""]]}, "res": "Une appli unique sur tous les téléphones de la maison, des scénarios « je pars », « je rentre », « bonne nuit », et des automatismes qui tournent tout seuls, même quand internet coupe.", "need": ["Un Raspberry Pi 4 ou 5 avec carte microSD ou SSD, ou un vieil ordinateur", "Tes appareils connectés et leurs applis", "Claude Code sur ton ordinateur"], "steps": [{"h": "Fais l'inventaire", "p": "Photographie les étiquettes ou liste les applis que tu utilises. Claude te dit ce qui marchera, et comment.", "w": "chat", "pr": "Voici mes appareils connectés : [liste avec marques et modèles]. Pour chacun, dis-moi s'il est compatible avec Home Assistant, comment l'intégrer, et s'il fonctionne en local ou seulement par le cloud de la marque."}, {"h": "Installe Home Assistant", "p": "Avec Raspberry Pi Imager, choisis « Other specific-purpose OS », puis Home Assistant, et écris la carte. Démarre le Pi branché en câble sur la box. Une vingtaine de minutes plus tard, l'interface répond à cette adresse :", "cmd": "http://homeassistant.local:8123"}, {"h": "Ajoute les appareils un par un", "p": "Home Assistant détecte une bonne partie des appareils tout seul. Pour les autres, Claude te guide : intégration de la marque, ou petit boîtier compatible. Un appareil à la fois, et teste-le avant de passer au suivant."}, {"h": "Fais écrire tes scénarios", "p": "Décris ce que tu veux en français, Claude écrit les automatisations.", "pr": "J'utilise Home Assistant à l'adresse [adresse]. Écris trois scénarios : « Je pars » (tout éteindre, chauffage en éco, volets baissés), « Je rentre » (lumière de l'entrée, chauffage à [20] °C), « Bonne nuit » (tout éteindre sauf [veilleuse]). Ajoute une automatisation : lumière de l'entrée au coucher du soleil si quelqu'un est à la maison. Explique-moi comment les modifier."}, {"h": "Installe l'appli sur les téléphones", "p": "L'appli Home Assistant existe sur iPhone et Android. Elle sert aussi à savoir qui est à la maison pour les automatismes."}], "trouble": [["Un appareil ne marche que par le cloud", "Il marchera, mais plus lentement et pas sans internet. Pour tes prochains achats, demande à Claude des modèles qui fonctionnent en local."], ["Home Assistant ne répond pas", "Attends la fin du premier démarrage, et branche le Pi en câble plutôt qu'en Wi-Fi."]], "more": ["Un vieil iPad au mur comme tableau de commande.", "Couper les veilles inutiles la nuit avec des prises connectées.", "Recevoir une alerte si le congélateur dépasse -12 °C."], "warn": "Fais des sauvegardes régulières de Home Assistant (menu Paramètres, Système, Sauvegardes) : une carte microSD finit toujours par lâcher.", "kw": "domotique maison connectée home assistant raspberry lumières chauffage scénarios volets"}, {"id": "mineur", "src": "v", "ico": "thermo", "t": "Découvrir ce qui fait chauffer ton ordinateur", "pitch": "Tu demandes à Claude un simple moniteur de température. Il regarde ce qui tourne sur la machine et trouve parfois bien pire qu'un ventilateur encrassé.", "story": "Un Mac chauffait sans raison. En construisant un moniteur de température, Claude a découvert un logiciel caché qui minait de la cryptomonnaie en occupant les 12 cœurs du processeur.", "lvl": 3, "diff": "Facile", "time": "30 min", "cost": "Gratuit", "pre": ["s-code"], "sk": {"n": [["laptop", "Ton ordi\nqui chauffe", 0, 0], ["thermo", "Moniteur de\ntempérature", 1.5, 0], ["cpu", "12 cœurs\nà 100 %", 3, 0], ["bug", "Le coupable", 3, 1, "hi"]], "e": [[0, 1, "", ""], [1, 2, "", ""], [2, 3, "", ""]]}, "res": "Un petit moniteur de température et d'activité, et surtout un rapport : ce qui tourne sur ta machine, ce qui se lance au démarrage, et ce qui n'a rien à y faire.", "need": ["Ton ordinateur, Mac ou Windows", "Claude Code"], "steps": [{"h": "Demande le moniteur", "p": "C'est en regardant les programmes qui consomment que Claude repère les anomalies.", "pr": "Mon ordinateur chauffe et ventile même quand je ne fais rien. Construis-moi un petit moniteur qui affiche en permanence la température du processeur, l'utilisation de chaque cœur et les cinq programmes qui consomment le plus. Puis regarde ce qui tourne en ce moment et dis-moi si quelque chose est anormal."}, {"h": "Fais le tour complet", "p": "Va au-delà de la température : démarrage automatique, extensions, connexions.", "pr": "Fais un contrôle de sécurité complet : programmes qui démarrent tout seuls, tâches planifiées, extensions du navigateur, connexions réseau ouvertes, réglages du pare-feu, fichiers sensibles lisibles par tout le monde. Signale tout ce qui est suspect, explique pourquoi, et ne modifie rien sans mon accord."}, {"h": "Lis le rapport avant d'agir", "p": "Pour chaque élément suspect, Claude explique ce que c'est. Demande-lui de vérifier sur le web un nom inconnu : un nom bizarre n'est pas forcément un virus."}, {"h": "Supprime avec méthode", "p": "Valide les suppressions une par une. Claude arrête le programme, retire son lancement automatique, puis supprime ses fichiers. Redémarre et remesure la température."}, {"h": "Change tes mots de passe si besoin", "p": "Si un vrai logiciel malveillant a été trouvé, change les mots de passe importants depuis un autre appareil, en commençant par ta boîte mail et ta banque."}], "trouble": [["Le moniteur n'affiche pas la température", "Sur certains ordinateurs, lire les capteurs demande une autorisation d'administrateur. Claude te dira quoi accepter."], ["Rien de suspect et ça chauffe toujours", "Le problème peut être matériel : poussière, pâte thermique sèche, ventilateur fatigué. Fais nettoyer la machine."]], "more": ["Refaire ce contrôle une fois par mois avec une tâche planifiée.", "Faire le même bilan sur l'ordinateur du travail.", "Vérifier les extensions du navigateur, souvent en cause."], "warn": "Garde un antivirus à jour. Claude aide au diagnostic, il ne remplace pas une protection permanente.", "kw": "ordinateur chauffe lent virus mineur crypto malware sécurité température mac windows"}, {"id": "autoradio", "src": "v", "ico": "car", "t": "Vérifier ce que l'autoradio de ta voiture écoute", "pitch": "Les autoradios connectés ont un micro, du Bluetooth et des applis. Claude Code s'y branche et te dit ce qui écoute, enregistre ou envoie des données.", "story": "Claude Code est relié à l'autoradio d'une Honda Civic. Il y trouve un assistant vocal toujours à l'écoute, un enregistreur d'appels Bluetooth et une possible porte dérobée du fabricant.", "lvl": 3, "diff": "Moyen", "time": "1 h", "cost": "Gratuit", "pre": ["s-code", "s-adb"], "sk": {"n": [["laptop", "Ordi\n+ Claude Code", 0, 0.5], ["car", "Autoradio\nAndroid", 1.5, 0.5], ["mic", "Micro toujours\nactif ?", 3, 0, "hi"], ["bt", "Appels\nenregistrés ?", 3, 1]], "e": [[0, 1, "câble USB", ""], [1, 2, "", ""], [1, 3, "", ""]]}, "res": "La liste des applis de l'autoradio, de leurs autorisations (micro, contacts, position) et des serveurs qu'elles contactent. Tu coupes ce qui n'a rien à faire là.", "need": ["Un autoradio sous Android (la plupart des autoradios de remplacement le sont)", "Un câble USB adapté, ou le Wi-Fi", "Un ordinateur portable avec Claude Code"], "steps": [{"h": "Vérifie que l'autoradio est accessible", "p": "Les autoradios Android de remplacement ont presque tous des options pour développeurs, comme un téléphone. Les systèmes d'origine des constructeurs sont souvent fermés. Donne la marque et le modèle à Claude, il te dira ce qui est possible."}, {"h": "Active le débogage", "p": "Dans les paramètres de l'autoradio, À propos, appuie sept fois sur le numéro de version, puis active le débogage USB. Certains modèles demandent un code d'usine : cherche-le avec Claude.", "fig": {"scr": "tablet", "l": ["Paramètres", "À propos", "Numéro de version ×7", "Débogage USB : oui"], "hl": 2}}, {"h": "Fais l'audit", "p": "Claude passe tout en revue et t'explique en clair.", "pr": "Un autoradio Android est branché en ADB. Liste toutes les applis, et pour chacune : les autorisations accordées (micro, téléphone, contacts, position, stockage), si elle tourne en arrière-plan, et les connexions réseau ouvertes. Signale tout ce qui peut écouter, enregistrer des appels ou envoyer des données. Explique en français simple. Ne change rien sans mon accord."}, {"h": "Coupe ce qui doit l'être", "p": "Pour chaque appli suspecte, Claude retire l'autorisation du micro, ou désactive l'appli si elle ne
