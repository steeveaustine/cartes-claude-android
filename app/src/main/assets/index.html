yses, et joins-les à la conversation.", "Colle la consigne. Si ton forfait l'inclut, active la recherche approfondie pour un tour complet des sources.", "Laisse Claude travailler.", "Apporte la liste de questions à ta prochaine consultation."], "prompt": "Voici mon dossier médical sur [maladie ou problème]. Explique-moi mon diagnostic avec des mots simples. Cherche ensuite les traitements reconnus, les essais en cours en France et en Europe, et les centres spécialisés. Termine par dix questions précises à poser à mon médecin. Cite tes sources.", "note": "Claude t'aide à comprendre et à préparer. La décision se prend avec ton médecin.", "kw": "santé maladie analyses diagnostic médecin traitement"}], "modules": [{"t": "Premiers pas", "goal": "Comprendre ce qu'est Claude et où le trouver.", "lessons": [{"t": "Ce que Claude est, et ce qu'il n'est pas", "body": ["Claude est un assistant qui lit, écrit, calcule et fabrique. Tu lui parles comme à un collaborateur : tu expliques ce que tu veux, il le fait, tu corriges.", "Il ne se contente pas de répondre à des questions. Il lit tes documents, cherche sur le web, produit un fichier Excel, construit une page web ou pilote un logiciel.", "Il lui arrive de se tromper avec aplomb. Garde le réflexe de vérifier un chiffre, une date ou une règle de droit avant de t'en servir."], "ex": {"txt": "Ouvre Claude et demande-lui : « Explique-moi en cinq lignes ce que tu peux faire pour quelqu'un qui tient un commerce comme le mien. »"}, "q": {"p": "Claude te donne un chiffre précis sur ton secteur. Que fais-tu ?", "o": ["Je le reprends tel quel, il a tout lu", "Je lui demande sa source et je vérifie", "Je repose la question jusqu'à obtenir un autre chiffre"], "a": 1, "why": "Un chiffre sans source reste une piste. Demande d'où il vient, et active la recherche web pour obtenir des liens à ouvrir."}}, {"t": "Trois façons de l'utiliser", "body": ["Dans le navigateur ou sur téléphone, tu discutes, tu joins des fichiers et tu repars avec des documents finis. C'est le point de départ, et il couvre déjà la plupart des besoins.", "Sur ordinateur, l'appli bureau lui ouvre tes dossiers et tes logiciels. L'extension Chrome le laisse naviguer à ta place.", "Avec Claude Code, il écrit des programmes et bricole du matériel. C'est le niveau le plus puissant, et le plus exigeant.", "Dans cette appli, chaque outil indique son niveau par un, deux ou trois traits."], "ex": {"txt": "Installe l'appli Claude sur ton téléphone et connecte-toi avec le même compte que sur ordinateur. Tes conversations te suivent d'un appareil à l'autre."}, "q": {"p": "Tu veux que Claude range un dossier de ton ordinateur. De quoi as-tu besoin ?", "o": ["Du site claude.ai sur ton téléphone", "De l'appli bureau, avec l'accès à ce dossier", "De rien, Claude voit déjà tes fichiers"], "a": 1, "why": "Claude n'accède à tes fichiers que si tu les joins à la conversation ou si l'appli bureau lui ouvre le dossier."}}, {"t": "Gratuit ou payant, ce qui change", "body": ["Le compte gratuit suffit pour discuter, joindre des fichiers, parler à voix haute et créer jusqu'à cinq projets.", "L'abonnement payant ouvre la recherche approfondie, les tâches planifiées, l'extension Chrome et Claude Code. Il te laisse aussi travailler beaucoup plus longtemps chaque jour.", "Commence gratuitement. Passe au payant le jour où tu butes sur une limite. Les tarifs à jour sont sur claude.com/pricing."], "q": {"p": "Laquelle de ces fonctions demande un abonnement payant ?", "o": ["Parler à Claude à voix haute", "Créer un projet", "Programmer une tâche qui tourne chaque matin"], "a": 2, "why": "Les tâches planifiées font partie des forfaits payants. Le mode vocal et les projets existent aussi en gratuit."}}, {"t": "Ta première vraie demande", "body": ["Oublie les questions d'essai. Prends un vrai problème de ta semaine : un mail auquel tu tardes à répondre, une facture à vérifier, un document à résumer.", "Joins le document avec le bouton +, dis ce que tu veux en une phrase, et précise la forme attendue.", "Lis la réponse, puis corrige-la comme tu le ferais avec un employé : « plus court », « enlève le deuxième paragraphe ». La conversation garde le fil."], "ex": {"txt": "Photographie une facture reçue cette semaine et fais-la vérifier.", "tool": 36}, "q": {"p": "Quel est le meilleur premier essai ?", "o": ["« Raconte-moi une blague »", "Un vrai document de ta semaine, avec une demande précise", "« Que sais-tu faire ? »"], "a": 1, "why": "Tu juges un outil sur un vrai travail. Un cas réel te montre tout de suite ce que tu y gagnes."}}]}, {"t": "Bien demander", "goal": "Écrire des consignes qui donnent de bonnes réponses du premier coup.", "lessons": [{"t": "Les quatre ingrédients d'une bonne consigne", "body": ["Une consigne floue donne une réponse moyenne. Quatre informations changent tout."], "pts": ["Le contexte : qui tu es et à qui tu t'adresses.", "La tâche : ce que tu veux obtenir, précisément.", "Le format : un mail, un tableau, trois lignes.", "Les limites : le ton, la longueur, ce qu'il faut éviter."], "ba": {"before": "Écris un mail pour un client en retard de paiement.", "after": "Je tiens un garage. Un client fidèle a une facture de 480 € en retard de 45 jours. Écris un mail de relance court, ferme et cordial, qui propose un paiement en deux fois. Pas de menace."}, "ex": {"txt": "Construis ta première consigne complète dans l'atelier.", "view": "atelier"}, "q": {"p": "Que manque-t-il dans « Fais-moi un résumé de ce document » ?", "o": ["Rien, c'est clair", "Pour qui, en quelle longueur et pour quoi faire", "Des formules de politesse"], "a": 1, "why": "Un résumé pour ton comptable ne ressemble pas à un résumé pour un client. Dis à qui il sert et combien de lignes tu veux."}}, {"t": "Montre un exemple", "body": ["Décrire un style est difficile. Le montrer prend dix secondes. Colle un texte que tu aimes et dis : « fais pareil ».", "Ça marche pour un mail, un devis, une fiche produit, un tableau. Un seul bon exemple vaut dix adjectifs.", "Tu peux aussi montrer ce que tu ne veux pas : « évite ce ton-là »."], "ex": {"txt": "Donne tes propres textes à Claude pour qu'il écrive avec ta voix.", "tool": 44}, "q": {"p": "Tu veux des réponses aux avis clients qui te ressemblent. Le plus efficace ?", "o": ["Écrire « sois naturel »", "Coller trois réponses que tu as déjà rédigées", "Demander dix versions et en choisir une"], "a": 1, "why": "Avec trois exemples, Claude voit ta longueur de phrase, ton vocabulaire et ton ton. Aucun adjectif ne le dit aussi bien."}}, {"t": "Corrige, ne recommence pas", "body": ["La première réponse est un brouillon. Dis ce qui cloche comme tu le dirais à un employé : « trop long », « trop commercial », « garde le début, refais la fin ».", "Claude garde toute la conversation en tête. Inutile de répéter le contexte à chaque message.", "Quand la conversation part dans tous les sens, ouvre-en une nouvelle et repars de ta meilleure version."], "q": {"p": "La réponse est bonne mais deux fois trop longue. Que fais-tu ?", "o": ["Tu réécris toute la consigne", "Tu écris « divise la longueur par deux, garde les chiffres »", "Tu abandonnes"], "a": 1, "why": "Une correction courte suffit. Claude repart de sa réponse et applique ta remarque."}}, {"t": "Fais-le poser des questions", "body": ["Claude préfère répondre tout de suite, quitte à deviner. Tu peux lui demander l'inverse.", "Ajoute à la fin de ta consigne : « Avant de commencer, pose-moi les questions dont tu as besoin. » Tu obtiens trois ou quatre questions précises, et une réponse bien plus juste.", "Autre phrase utile : « Dis-moi ce dont tu n'es pas sûr. » Il signale alors les points à vérifier."], "ex": {"txt": "Reprends ta dernière demande et ajoute la phrase des questions. Compare les deux réponses."}, "q": {"p": "Quelle phrase évite que Claude invente ce qu'il ignore ?", "o": ["« Réponds vite »", "« Si une information te manque, demande-la-moi au lieu de deviner »", "« Sois créatif »"], "a": 1, "why": "Tu lui donnes le droit de ne pas savoir. Il pose alors la question au lieu de combler le vide."}}]}, {"t": "Lui donner de la matière", "goal": "Documents, photos, web : nourrir Claude et repartir avec un fichier fini.", "lessons": [{"t": "Joindre des fichiers et des photos", "body": ["Le bouton + accepte presque tout : PDF, Word, Excel, photos, captures d'écran. Sur téléphone, tu photographies directement un document.", "Claude lit le texte, les tableaux et l'image elle-même. Une facture froissée ou une note manuscrite passent, à condition que la photo soit nette.", "Dis toujours ce que tu veux en tirer. « Voici ma facture » ne suffit pas. « Sors-moi le total et vérifie la TVA » fonctionne."], "ex": {"txt": "Fais lire un document papier à Claude à partir d'une simple photo.", "tool": 36}, "q": {"p": "Tu joins un contrat de vingt pages. Quelle demande est la plus utile ?", "o": ["« Voilà »", "« Liste les clauses qui m'engagent sur la durée et les pénalités »", "« C'est bien ? »"], "a": 1, "why": "Une question précise donne une réponse exploitable. Claude sait alors quoi chercher dans les vingt pages."}}, {"t": "Chercher sur le web, vite ou à fond", "body": ["Avec la recherche web, Claude lit des pages récentes et te donne les liens. Utilise-la pour tout ce qui bouge : prix, horaires, actualité, réglementation.", "La recherche approfondie va plus loin. Claude consulte des dizaines de sources pendant plusieurs minutes et rend un rapport structuré. Elle se lance avec le bouton +, puis Recherche, sur les forfaits payants.", "Question simple, recherche web. Décision importante, recherche approfondie."], "ex": {"txt": "Lance une recherche approfondie sur une décision que tu repousses.", "tool": 34}, "q": {"p": "Tu veux choisir un nouveau logiciel de caisse. Qu'utilises-tu ?", "o": ["La mémoire de Claude, sans recherche", "La recherche approfondie, pour comparer avec des sources", "Le mode vocal"], "a": 1, "why": "Les logiciels et leurs prix changent sans cesse. Il faut des sources récentes, comparées entre elles."}}, {"t": "Repartir avec un fichier fini", "body": ["Claude ne produit pas seulement du texte à copier. Il fabrique de vrais fichiers : Word, Excel avec formules, PowerPoint, PDF.", "Il crée aussi des pages web qui fonctionnent : un calculateur, un formulaire, un petit site. Chaque page a son adresse et se partage par un lien.", "Nomme le format dans ta demande. « Fais-moi un tableau » donne un tableau dans la conversation. « Fais-moi un fichier Excel » donne un fichier à télécharger."], "ex": {"txt": "Demande ton premier vrai fichier.", "tool": 35}, "q": {"p": "Tu veux un devis à envoyer à un client. Quelle demande choisis-tu ?", "o": ["« Écris un devis »", "« Crée un devis en PDF avec mes coordonnées, prêt à envoyer »", "« Donne des idées de devis »"], "a": 1, "why": "En nommant le format et l'usage, tu reçois un fichier prêt à partir, pas un texte à remettre en page."}}, {"t": "Vérifier ce qu'il avance", "body": ["Claude écrit avec assurance, y compris quand il a tort. Trois réflexes te protègent."], "pts": ["Demande les sources, et clique dessus.", "Pour un calcul, demande-lui de montrer le détail.", "Pour une décision qui engage de l'argent, ta santé ou un contrat, fais valider par un professionnel."], "ex": {"txt": "Fais vérifier une affirmation que tu as lue cette semaine.", "tool": 59}, "q": {"p": "Claude cite un article de loi. Que fais-tu avant de l'utiliser dans un courrier ?", "o": ["Rien, il connaît le droit", "Tu demandes la source officielle et tu la lis", "Tu changes le numéro au hasard"], "a": 1, "why": "Les références juridiques inventées existent. Un lien vers le texte officiel se vérifie en trente secondes."}}]}, {"t": "Ne plus te répéter", "goal": "Projets, mémoire, compétences : Claude garde le contexte à ta place.", "lessons": [{"t": "Les projets", "body": ["Un projet est un classeur. Tu y ranges tes documents et tes consignes, et toutes les conversations ouvertes dedans les connaissent déjà.", "Crée un projet par sujet qui revient : ton commerce, ta comptabilité, un chantier, un voyage.", "Pour le créer : menu Projets, Nouveau projet, puis ajoute tes fichiers avec le + et écris tes instructions."], "ex": {"txt": "Crée ton premier projet.", "tool": 32}, "q": {"p": "À quoi sert un projet ?", "o": ["À payer moins cher", "À garder documents et consignes pour toutes les conversations d'un même sujet", "À partager ton écran"], "a": 1, "why": "Tu poses le contexte une fois. Chaque conversation du projet repart avec tes documents et tes règles."}}, {"t": "La mémoire et tes préférences", "body": ["Claude peut retenir ce que tu lui dis d'une conversation à l'autre : ton métier, tes habitudes, ta façon d'écrire.", "Tu gardes la main. « Retiens que… » ajoute un souvenir, « oublie que… » l'efface, et « que sais-tu sur moi ? » te montre tout.", "Dans tes préférences, écris une fois comment tu veux qu'on te réponde. Claude l'applique partout."], "ex": {"txt": "Règle ta mémoire et tes préférences.", "tool": 33}, "q": {"p": "Comment corriger un souvenir faux ?", "o": ["C'est impossible", "Tu le dis dans une conversation : « oublie ceci, retiens plutôt cela »", "Il faut supprimer ton compte"], "a": 1, "why": "La mémoire se corrige en parlant. Tu peux aussi lui demander ce qu'il a retenu pour vérifier."}}, {"t": "Les compétences", "body": ["Une compétence est une méthode enregistrée : ta façon de faire un devis, de répondre à un avis, de présenter un rapport.", "Tu fais le travail une fois avec Claude jusqu'au bon résultat, puis tu lui demandes d'en faire une compétence. La fois suivante, une phrase suffit.", "La différence avec un projet : le projet garde tes documents, la compétence garde ta façon de faire."], "ex": {"txt": "Transforme un travail réussi en compétence.", "tool": 42}, "q": {"p": "Tu rédiges chaque semaine le même type de compte rendu. Le bon outil ?", "o": ["Une compétence", "Le mode vocal", "La recherche approfondie"], "a": 0, "why": "Une tâche qui revient à l'identique mérite une méthode enregistrée. Tu ne fournis plus que ce qui change."}}]}, {"t": "Le brancher à tes outils", "goal": "Mails, agenda, navigateur, tâches automatiques.", "lessons": [{"t": "Les connecteurs", "body": ["Un connecteur relie Claude à un de tes outils : boîte mail, agenda, Drive, Canva et beaucoup d'autres. Claude y lit et y agit directement.", "Pour en ajouter un : Personnaliser, Connecteurs, choisis l'outil et connecte-toi.", "Claude te demande ton accord avant d'envoyer un message ou de modifier un fichier. Tu peux retirer un connecteur à tout moment."], "ex": {"txt": "Relie ta boîte mail et fais trier ta semaine.", "tool": 38}, "q": {"p": "Avec le connecteur de ta boîte mail, Claude peut…", "o": ["Envoyer des mails sans te prévenir", "Lire tes mails et préparer des brouillons que tu valides", "Changer ton mot de passe"], "a": 1, "why": "Il lit et prépare. L'envoi passe par ton accord."}}, {"t": "Les tâches planifiées", "body": ["Tu décris un travail et sa fréquence. Claude le refait tout seul : chaque heure, chaque jour, chaque semaine ou les jours ouvrés.", "Bons candidats : la synthèse des mails du matin, la veille des prix, le rapport du lundi.", "La plupart des tâches tournent dans le nuage, ordinateur éteint. Celles qui touchent à tes fichiers ont besoin qu'il soit allumé."], "ex": {"txt": "Programme ta première tâche.", "tool": 39}, "q": {"p": "Quelle demande convient à une tâche planifiée ?", "o": ["« Écris-moi un poème »", "« Chaque lundi à 8h, compare les prix de mes trois fournisseurs »", "« Corrige cette phrase »"], "a": 1, "why": "Une tâche planifiée sert pour un travail qui revient à date fixe, avec le même déroulé à chaque fois."}}, {"t": "Le navigateur et l'ordinateur", "body": ["Avec l'extension Chrome, Claude navigue à ta place : il clique, remplit des formulaires, télécharge des factures.", "Avec le contrôle de l'ordinateur, il utilise tes logiciels comme toi, à la souris et au clavier. C'est plus lent, à réserver aux logiciels sans connecteur.", "Règle simple : reste devant l'écran pour tout ce qui touche à l'argent. Pas de paiement ni de virement sans toi."], "ex": {"txt": "Confie une corvée de navigation à Claude.", "tool": 40}, "q": {"p": "Quand utiliser le contrôle de l'ordinateur ?", "o": ["Toujours, c'est le plus rapide", "Quand aucun connecteur n'existe pour le logiciel", "Jamais"], "a": 1, "why": "Un connecteur est plus rapide et plus fiable. Le contrôle à la souris reste la solution de secours."}}]}, {"t": "Lui faire construire", "goal": "Claude Code : des programmes sur mesure sans savoir coder.", "lessons": [{"t": "Claude Code, c'est quoi", "body": ["Claude Code est le mode où Claude écrit des programmes, les lance et corrige ses erreurs tout seul. Il se trouve dans l'onglet Code de l'appli bureau.", "Tu n'as pas besoin de savoir programmer. Tu décris le résultat voulu, comme à un artisan.", "C'est lui qui permet les projets les plus ambitieux : une appli pour ton métier, un diagnostic de ton réseau, un objet à imprimer en 3D."], "q": {"p": "Que faut-il savoir pour utiliser Claude Code ?", "o": ["Programmer en Python", "Décrire clairement ce que tu veux", "Rien, il devine"], "a": 1, "why": "Le code, c'est son travail. Le tien est d'expliquer le besoin et de tester le résultat."}}, {"t": "Ta première session", "body": ["Quatre gestes suffisent pour démarrer."], "pts": ["Ouvre l'onglet Code et crée une nouvelle session.", "Choisis un dossier vide. Claude ne travaillera que là.", "Décris ton projet en quelques phrases.", "Lis ce qu'il propose et accepte les actions une par une."], "ex": {"txt": "Lance ton premier projet : une petite appli pour ton métier.", "tool": 65}, "q": {"p": "Pourquoi démarrer dans un dossier vide ?", "o": ["Pour aller plus vite", "Pour que Claude ne puisse rien abîmer d'autre", "Parce que c'est obligatoire"], "a": 1, "why": "Un dossier vide limite son terrain de jeu. Tes autres fichiers restent hors de portée."}}, {"t": "Les bons réflexes", "body": ["Un projet réussi tient à quelques habitudes simples."], "pts": ["Demande une maquette ou un plan avant qu'il ne construise.", "Avance par étapes et teste à chaque fois.", "Quand ça ne marche pas, décris ce que tu vois. Il cherche la cause.", "Fais une copie de ce qui compte avant de le laisser modifier."], "q": {"p": "Le programme affiche une erreur. Que dis-tu à Claude ?", "o": ["« Ça ne marche pas »", "Ce que tu as fait, ce que tu attendais, et le message exact", "Rien, tu recommences tout"], "a": 1, "why": "Avec le message exact et le contexte, il trouve la cause. Avec « ça ne marche pas », il devine."}}, {"t": "Plusieurs Claude à la fois", "body": ["Pour un gros travail découpable, Claude peut lancer plusieurs agents qui avancent en parallèle : cinquante fiches à rédiger, vingt concurrents à étudier.", "Tu le demandes en toutes lettres : « répartis ce travail entre plusieurs agents ».", "Le revers : ton quota d'utilisation fond beaucoup plus vite. Garde ça pour les travaux qui le méritent."], "ex": {"txt": "Découvre comment répartir un gros travail.", "tool": 19}, "q": {"p": "Quel travail se prête aux agents en parallèle ?", "o": ["Une lettre de deux lignes", "Trente fiches produit indépendantes à rédiger", "Une question de culture générale"], "a": 1, "why": "Des morceaux indépendants peuvent avancer en même temps. Une tâche courte ou unique n'y gagne rien."}}]}, {"t": "Garder la main", "goal": "Limites, données, décisions : rester le patron.", "lessons": [{"t": "Ce que Claude ne fait pas", "body": ["Connaître ses limites t'évite de perdre du temps à insister."], "pts": ["Il ne crée pas de photos réalistes par lui-même. Il dessine des schémas, des illustrations simples et des mises en page.", "Il ne connaît pas l'actualité récente sans la recherche web.", "Il ne remplace ni ton médecin, ni ton avocat, ni ton comptable.", "Il ne se souvient que de ce que la mémoire ou le projet a gardé."], "q": {"p": "Tu veux une photo réaliste de ta vitrine rénovée. Claude peut…", "o": ["La générer directement, sans rien d'autre", "Faire un plan ou une mise en page, mais pas la photo par lui-même", "La prendre avec ta webcam sans rien installer"], "a": 1, "why": "Claude dessine et met en page. Pour une photo réaliste, il faut un outil d'images relié par un connecteur."}}, {"t": "Ce que tu lui confies", "body": ["Tu choisis ce que Claude voit. Quelques règles de bon sens suffisent."], "pts": ["Ne colle jamais un mot de passe, un numéro de carte ou un code reçu par SMS.", "Masque les noms quand ils n'apportent rien à la demande.", "Relie uniquement les outils dont tu as besoin, et retire ceux qui ne servent plus.", "Les réglages de confidentialité sont dans les Paramètres. Prends deux minutes pour les lire."], "q": {"p": "Lequel de ces éléments ne doit jamais être collé dans une conversation ?", "o": ["Le texte d'un mail client", "Le code de ta carte bancaire", "Tes horaires d'ouverture"], "a": 1, "why": "Aucune tâche n'en a besoin. Un code de carte ou un mot de passe ne se partage avec personne, assistant compris."}}, {"t": "Rester le patron", "body": ["Claude propose, tu décides. Relis tout ce qui part sous ton nom : un mail, un devis, une réponse à un avis.", "Quand il agit pour toi, dans ta boîte mail ou sur un site, il demande ton accord aux moments importants. Lis ce qu'il te montre avant d'accepter.", "Tu peux l'arrêter à tout instant. Une tâche mal partie se coupe, une tâche planifiée se supprime."], "q": {"p": "Claude a rédigé une réponse à un client mécontent. Avant l'envoi…", "o": ["Tu l'envoies sans lire, pour gagner du temps", "Tu la relis et tu ajustes : c'est ta signature", "Tu lui demandes de l'envoyer à tous tes clients"], "a": 1, "why": "Le message part sous ton nom. Trente secondes de relecture valent mieux qu'une phrase malheureuse."}}]}]};
const $ = (s, r) => (r || document).querySelector(s);
const $$ = (s, r) => [...(r || document).querySelectorAll(s)];
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const norm = s => String(s).toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "");
const cap = s => s.charAt(0).toUpperCase() + s.slice(1);

const CATS = Object.fromEntries(DATA.cats.map(c => [c.id, c]));
const TOOLS = DATA.tools;
const TOOL = Object.fromEntries(TOOLS.map(t => [t.id, t]));

let toastT;
function toast(msg) { const el = $("#toast"); el.textContent = msg; el.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => { el.hidden = true; }, 2300); }
async function copyText(text, selEl) {
  try {
    if (window.Android && Android.copy) Android.copy(text); else await navigator.clipboard.writeText(text);
    toast("Consigne copiée");
  } catch (e) {
    if (selEl) { const r = document.createRange(); r.selectNodeContents(selEl); const s = getSelection(); s.removeAllRanges(); s.addRange(r); }
    toast("Texte sélectionné, copie-le à la main");
  }
}
const STOP = new Set("mes mon ma un une des de du le la les a au aux en et pour ton ta tes sur par avec je veux faire comment mon l d".split(" "));
function search(q) {
  const toks = norm(q).split(/[^a-z0-9]+/).filter(k => k && !STOP.has(k));
  if (!toks.length) return { tools: [], lessons: [] };
  const sc = (title, rest) => { const t = norm(title), r = norm(rest); let s = 0; for (const k of toks) { if (t.includes(k)) s += 3; else if (r.includes(k)) s += 1; else return 0; } return s; };
  const rank = (arr, f) => arr.map(x => [f(x), x]).filter(x => x[0]).sort((a, b) => b[0] - a[0]).map(x => x[1]);
  return {
    tools: rank(TOOLS, t => sc(t.t, t.pitch + " " + (t.kw || "") + " " + CATS[t.cat].name)),
    lessons: rank(LESSONS, l => sc(l.t, l.body.join(" ") + " " + (l.pts || []).join(" ")))
  };
}

function promptParts(p) {
  const out = [], re = /\[([^\]]+)\]/g; let last = 0, m;
  while ((m = re.exec(p))) { if (m.index > last) out.push({ s: p.slice(last, m.index) }); out.push({ ph: m[1] }); last = re.lastIndex; }
  if (last < p.length) out.push({ s: p.slice(last) });
  return out;
}

}

  <nav class="pager" aria-label="Leçons">
    ${prev ? `<a class="btn" href="#lecon-${prev.key}">${icon("left", "sm")}Précédente</a>` : `<span></span>`}
    <a class="btn" id="nx" href="${next ? "#lecon-" + next.key : "#formation"}">${next ? "Leçon suivante" : "Retour au parcours"} ${icon("right", "sm")}</a>
  </nav>`;
  const fb = $("#fb");
  const win = () => {
    $$(".opt").forEach((b, i) => { b.disabled = true; if (i === l.q.a) b.classList.add("good"); });
    fb.className = "fb"; fb.innerHTML = `<b>C'est ça.</b> ${esc(l.q.why)}`; fb.hidden = false;
    $("#nx").classList.add("primary");
  };
  if (S.lessons[l.key]) win();
  $(".opts").addEventListener("click", e => {
    const b = e.target.closest(".opt"); if (!b || b.disabled) return;
    if (+b.dataset.i === l.q.a) { S.lessons[l.key] = true; save(); win(); if (doneLessons() === LESSONS.length) toast("Parcours terminé, bravo"); }
    else { b.classList.add("bad"); b.disabled = true; fb.className = "fb no"; fb.innerHTML = `<b>Pas tout à fait.</b> Relis la leçon et tente une autre réponse.`; fb.hidden = false; }
  });
}

/* ---------- atelier ---------- */
const A_DEF = { who: "", task: "", dest: "", ctx: "", format: "", len: "", tone: "", avoid: "", ask: false, two: false, doubt: false };
const A_PRE = [
  { n: "Annonce d'horaires", v: { who: "Je tiens une boulangerie de quartier", task: "une annonce de mes nouveaux horaires", dest: "mes clients habituels", ctx: "Fermé le lundi à partir de mars, ouverture à 7h au lieu de 7h30", format: "Message court", tone: "Chaleureux", avoid: "les formules creuses" } },
  { n: "Relance d'impayé", v: { who: "Je tiens un garage automobile", task: "un mail de relance pour une facture de 480 € en retard de 45 jours", dest: "un client fidèle", ctx: "Je propose un paiement en deux fois", format: "Mail", len: "Très court", tone: "Direct", avoid: "les menaces", two: true } },
  { n: "Résumé pour le comptable", v: { who: "Je suis gérant d'une petite société", task: "un résumé du document joint", dest: "mon comptable", ctx: "Il doit décider si la dépense est déductible", format: "Liste", len: "Une demi-page", tone: "Professionnel", doubt: true } }
];
const A_OPT = { format: ["Mail", "Message court", "Liste", "Tableau", "Document Word", "Plan en étapes"], len: ["Très court", "Une demi-page", "Détaillé"], tone: ["Direct", "Chaleureux", "Professionnel", "Simple"] };
function atelierText(a) {
  const t = s => s.trim().replace(/[.\s]+$/, ""), low = s => s.charAt(0).toLowerCase() + s.slice(1), L = [];
  if (t(a.who)) L.push(t(a.who) + ".");
  if (t(a.task)) L.push("Je veux " + low(t(a.task)) + (t(a.dest) ? ", pour " + low(t(a.dest)) : "") + ".");
  else if (t(a.dest)) L.push("C'est pour " + low(t(a.dest)) + ".");
  if (t(a.ctx)) L.push("À savoir : " + low(t(a.ctx)) + ".");
  if (a.format) L.push("Forme attendue : " + a.format.toLowerCase() + (a.len ? ", " + a.len.toLowerCase() : "") + ".");
  else if (a.len) L.push("Longueur : " + a.len.toLowerCase() + ".");
  if (a.tone) L.push("Ton " + a.tone.toLowerCase() + ".");
  if (t(a.avoid)) L.push("À éviter : " + low(t(a.avoid)) + ".");
  if (a.ask) L.push("Avant de commencer, pose-moi les questions dont tu as besoin.");
  if (a.two) L.push("Propose deux versions différentes.");
  if (a.doubt) L.push("Signale ce dont tu n'es pas sûr.");
  return L.join("\n");
}
function viewAtelier() {
  let sample = false;
  if (!S.atelier) { S.atelier = Object.assign({}, A_DEF, A_PRE[0].v); sample = true; }
  const a = S.atelier;
  const txt = (id, lab, ph, big) => `<div class="field"><label class="label" for="a-${id}">${lab}</label>${big ? `<textarea id="a-${id}" rows="2" data-k="${id}" placeholder="${esc(ph)}"></textarea>` : `<input id="a-${id}" type="text" data-k="${id}" placeholder="${esc(ph)}" autocomplete="off">`}</div>`;
  const pick = (k, lab) => `<div class="field"><span class="label">${lab}</span><div class="chips">${A_OPT[k].map(o => `<button type="button" class="chip" data-k="${k}" data-v="${o}">${o}</button>`).join("")}</div></div>`;
  $("#view").innerHTML = `
  <header class="stack"><h1>Atelier</h1><p class="lede">Construis une bonne consigne, ingrédient par ingrédient. Elle s'écrit sous tes yeux.</p></header>
  <div class="atelier">
    <form class="af" id="af">
      <p class="hint" id="smp" ${sample ? "" : "hidden"}>Un exemple est chargé pour te montrer. Remplace-le par ton cas, ou efface tout.</p>
      ${txt("who", "Qui es-tu ?", "Je tiens une boulangerie de quartier")}
      ${txt("task", "Je veux…", "un mail qui annonce mes nouveaux horaires", true)}
      ${txt("dest", "C'est pour…", "mes clients habituels")}
      ${txt("ctx", "Ce que Claude doit savoir", "Les faits, les chiffres, les dates", true)}
      ${pick("format", "Sous quelle forme ?")}
      ${pick("len", "Quelle longueur ?")}
      ${pick("tone", "Quel ton ?")}
      ${txt("avoid", "À éviter", "les formules creuses, le ton trop commercial")}
      <div class="field"><span class="label">Options</span><div class="chips">
        <button type="button" class="chip" data-t="ask">Pose-moi des questions d'abord</button>
        <button type="button" class="chip" data-t="two">Deux versions</button>
        <button type="button" class="chip" data-t="doubt">Signale tes doutes</button></div></div>
    </form>
    <div class="ap">
      <div><div class="meter-top"><span id="mlab"></span><span id="msc"></span></div><div class="segs" id="segs"></div><div class="checks" id="chk"></div></div>
      <p class="hint" id="mhint"></p>
      <div class="preview" id="apv"></div>
      <div class="actions"><button type="button" class="btn primary" id="acopy">${icon("copy", "sm")}Copier</button><a class="btn" id="aopen" target="_blank" rel="noopener">Ouvrir dans Claude ${icon("ext", "sm")}</a><button type="button" class="btn" id="aclr">Tout effacer</button></div>
    </div>
  </div>
  <section class="stack"><h2>Charger un exemple</h2><div class="chips">${A_PRE.map((p, i) => `<button type="button" class="chip" data-p="${i}">${p.n}</button>`).join("")}</div></section>`;
  const fill = () => {
    $$("#af [data-k]").forEach(el => { if (el.tagName === "BUTTON") el.setAttribute("aria-pressed", String(a[el.dataset.k] === el.dataset.v)); else el.value = a[el.dataset.k] || ""; });
    $$("#af [data-t]").forEach(el => el.setAttribute("aria-pressed", String(!!a[el.dataset.t])));
  };
  const draw = () => {
    const ing = [["Tâche", a.task.trim(), "Dis ce que tu veux obtenir."], ["Contexte", a.who.trim() || a.ctx.trim(), "Ajoute qui tu es ou ce que Claude doit savoir."], ["Destinataire", a.dest.trim(), "Précise pour qui c'est : le ton de la réponse en dépend."], ["Format", a.format || a.len, "Choisis une forme, sinon la réponse risque d'être trop longue."], ["Limites", a.tone || a.avoid.trim(), "Donne un ton ou ce qu'il faut éviter."]];
    const n = ing.filter(x => x[1]).length, miss = ing.find(x => !x[1]);
    $("#mlab").textContent = ["Page blanche", "Trop vague", "Trop vague", "Ça prend forme", "Presque complète", "Consigne solide"][n];
    $("#msc").textContent = n + " / 5";
    $("#segs").innerHTML = ing.map((x, i) => `<i class="${i < n ? "on" : ""}"></i>`).join("");
    $("#chk").innerHTML = ing.map(x => `<span class="${x[1] ? "on" : ""}">${x[1] ? "✓ " : ""}${x[0]}</span>`).join("");
    $("#mhint").textContent = miss ? miss[2] : "Les cinq ingrédients y sont. Tu peux l'envoyer.";
    const t = atelierText(a), pv = $("#apv");
    pv.textContent = t || "Ta consigne apparaîtra ici. Commence par dire ce que tu veux.";
    pv.classList.toggle("void", !t);
    $("#aopen").href = "https://claude.ai/new?q=" + encodeURIComponent(t);
  };
  const touch = () => { $("#smp").hidden = true; save(); draw(); };
  $("#af").addEventListener("input", e => { const k = e.target.dataset.k; if (k) { a[k] = e.target.value; touch(); } });
  $("#af").addEventListener("click", e => {
    const b = e.target.closest("button"); if (!b) return;
    if (b.dataset.k) a[b.dataset.k] = a[b.dataset.k] === b.dataset.v ? "" : b.dataset.v; else if (b.dataset.t) a[b.dataset.t] = !a[b.dataset.t]; else return;
    fill(); touch();
  });
  $("#af").addEventListener("submit", e => e.preventDefault());
  $("#acopy").addEventListener("click", () => { const t = atelierText(a); if (t) copyText(t, $("#apv")); else toast("Rien à copier pour l'instant"); });
  $("#aclr").addEventListener("click", () => { Object.assign(a, A_DEF); fill(); touch(); });
  $$("[data-p]").forEach(b => b.addEventListener("click", () => { Object.assign(a, A_DEF, A_PRE[+b.dataset.p].v); fill(); touch(); window.scrollTo(0, 0); }));
  fill(); draw(); if (sample) save();
}

/* ---------- navigation ---------- */
$("#nav").innerHTML = `<a class="brand" href="#accueil">${LOGO}Claude en main</a>`
  + [["accueil", "home", "Accueil"], ["outils", "grid", "Outils"], ["formation", "book", "Formation"], ["atelier", "pen", "Atelier"]].map(t => `<a class="tab" href="#${t[0]}" data-tab="${t[0]}">${icon(t[1])}<span>${t[2]}</span></a>`).join("");
const cur = () => location.hash || "#accueil";
const stack = [cur()], pos = {};
function route() {
  const h = cur().slice(1); let m, tab = "accueil";
  if (h === "outils") { tab = "outils"; viewTools(null); }
  else if ((m = h.match(/^cat-([a-z]+)$/)) && CATS[m[1]]) { tab = "outils"; viewTools(m[1]); }
  else if ((m = h.match(/^outil-(\d+)$/)) && TOOL[m[1]]) { tab = "outils"; viewTool(TOOL[m[1]]); }
  else if (h === "formation") { tab = "formation"; viewFormation(); }
  else if ((m = h.match(/^lecon-(\d+-\d+)$/)) && LESSONS.find(l => l.key === m[1])) { tab = "formation"; viewLesson(LESSONS.find(l => l.key === m[1])); }
  else if (h === "atelier") { tab = "atelier"; viewAtelier(); }
  else viewHome();
  $$(".tab").forEach(a => { if (a.dataset.tab === tab) a.setAttribute("aria-current", "page"); else a.removeAttribute("aria-current"); });
}
window.addEventListener("hashchange", () => {
  const h = cur(), back = stack.length > 1 && stack[stack.length - 2] === h;
  pos[stack[stack.length - 1]] = window.scrollY;
  if (back) stack.pop(); else stack.push(h);
  route(); window.scrollTo(0, back ? (pos[h] || 0) : 0);
});
document.addEventListener("click", e => { const b = e.target.closest("[data-back]"); if (b && stack.length > 1) { e.preventDefault(); history.back(); } });
route();
</script>

</body></html>
